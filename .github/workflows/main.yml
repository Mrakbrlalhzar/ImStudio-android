        // ---------------------------------------------------------------------------
        // Parser state
        // ---------------------------------------------------------------------------
        struct StackEntry { Node* node; };
        static std::vector<StackEntry> g_istack;
        static ImVec2 g_pending_size(0, 0);   // SetNextWindowSize/Pos applied to next Begin
        static ImVec2 g_pending_pos(0, 0);
        static int     g_pending_cond = 0;

        static Node* ICur()
        {
            return g_istack.empty() ? nullptr : g_istack.back().node;
        }
        static void IPush(Node* n)
        {
            if (n) g_istack.push_back({ n });
        }
        static void IPop(int count = 1)
        {
            for (int i = 0; i < count && !g_istack.empty(); i++) g_istack.pop_back();
        }

        static Node* IMake(int kind)
        {
            Node* n = Node_New(kind);
            Node_MakeDefault(n, kind); // Node_New already applies defaults
            return n;
        }

        // Attach under current container; if none (file has no Begin), auto-create
        // a window for that file's widgets so nothing is silently dropped.
        static const char* g_cur_fname = nullptr;
        static Node* g_file_win = nullptr;
        static void IAttach(Node* n)
        {
            Node* p = ICur();
            if (p) { Node_AddChild(p, n); return; }
            if (!g_file_win)
            {
                g_file_win = IMake(NWindow);
                snprintf(g_file_win->name, sizeof(g_file_win->name), "%s",
                         g_cur_fname ? g_cur_fname : "Imported");
            }
            Node_AddChild(g_file_win, n);
        }

        // Set node name/value from first string literal of an arg.
        static void ISetName(Node* n, const std::string& arg)
        {
            std::string s;
            if (FirstStringLiteral(arg, s))
            {
                strncpy(n->name, s.c_str(), 63); n->name[63] = 0;
                strncpy(n->value_str, s.c_str(), 63); n->value_str[63] = 0;
            }
        }

        // ---------------------------------------------------------------------------
        // HandleCall: one parsed ImGui:: call -> node tree ops.
        // meth/args are pre-extracted for single-line calls; for accumulated
        // multi-line calls they are re-extracted inside.
        // ---------------------------------------------------------------------------
        static void HandleCall(const std::string& code, int line_no,
                                Node*& root, ImportReport& rep, const char* fname)
        {
            // extract "ImGui::<meth>(<args>)" from the start of the FIRST ImGui:: in code
            size_t ip = code.find("ImGui::");
            if (ip == std::string::npos) return;
            size_t ns = ip + 7;
            while (ns < code.size() && isspace((unsigned char)code[ns])) ns++;
            size_t ne = ns;
            while (ne < code.size() && (isalnum((unsigned char)code[ne]) || code[ne] == '_')) ne++;
            if (ne == ns) return;
            std::string meth = code.substr(ns, ne - ns);
            size_t call = code.find('(', ne);
            if (call == std::string::npos) return;
            int depth = 0; bool in_str = false; size_t end = std::string::npos;
            for (size_t i = call; i < code.size(); i++)
            {
                if (in_str) { if (code[i] == '\\') i++; else if (code[i] == '"') in_str = false; continue; }
                if (code[i] == '"') { in_str = true; continue; }
                if (code[i] == '(') depth++;
                else if (code[i] == ')') { depth--; if (depth == 0) { end = i; break; } }
            }
            if (end == std::string::npos) return;
            std::string args = code.substr(call + 1, end - call - 1);

            std::vector<std::string> a;
            SplitArgs(args, a);
            int NA = (int)a.size();

            auto arg = [&](int i) -> const std::string& {
                static std::string empty;
                return (i >= 0 && i < NA) ? a[i] : empty;
            };

            // ---------- container opens ----------
            if (meth == "Begin" && NA >= 1)
            {
                Node* n = IMake(NWindow);
                ISetName(n, arg(0));
                if (NA >= 3) { int un = 0; n->flags = ResolveFlagsExpr(arg(2), un); rep.calls_unresolved += un; }
                // pending SetNextWindow* values
                if (g_pending_size.x != 0 || g_pending_size.y != 0)
                {
                    n->w = g_pending_size.x; n->h = g_pending_size.y;
                    g_pending_size = ImVec2(0, 0);
                }
                if (g_pending_pos.x != 0 || g_pending_pos.y != 0)
                {
                    n->pos_x = g_pending_pos.x; n->pos_y = g_pending_pos.y;
                    n->pos_cond = g_pending_cond ? g_pending_cond : ImGuiCond_Once;
                    g_pending_pos = ImVec2(0, 0);
                    g_pending_cond = 0;
                }
                if (!root) root = n;
                else { Node* p = ICur(); if (p) Node_AddChild(p, n); }
                IPush(n);
                rep.nodes_imported++;
            }
            else if (meth == "BeginChild" && NA >= 1)
            {
                Node* n = IMake(NChild);
                ISetName(n, arg(0));
                if (NA >= 4) { int un = 0; n->flags = ResolveFlagsExpr(arg(3), un); rep.calls_unresolved += un; }
                if (NA >= 2) { float w = 0, h = 0; ParseVec2Expr(arg(1), w, h); n->w = w; n->h = h; }
                IAttach(n); IPush(n);
                rep.nodes_imported++;
            }
            else if (meth == "BeginTabBar" && NA >= 1)
            {
                Node* n = IMake(NTabBar);
                ISetName(n, arg(0));
                if (NA >= 2) { int un = 0; n->flags = ResolveFlagsExpr(arg(1), un); rep.calls_unresolved += un; }
                IAttach(n); IPush(n);
                rep.nodes_imported++;
            }
            else if (meth == "BeginTabItem" && NA >= 1)
            {
                Node* n = IMake(NTabItem);
                ISetName(n, arg(0));
                if (NA >= 3) { int un = 0; n->flags = ResolveFlagsExpr(arg(2), un); rep.calls_unresolved += un; }
                IAttach(n); IPush(n);
                rep.nodes_imported++;
            }
            else if (meth == "BeginMenu" && NA >= 1)
            {
                Node* n = IMake(NMenu);
                ISetName(n, arg(0));
                if (NA >= 2) { int un = 0; n->flags = ResolveFlagsExpr(arg(1), un); rep.calls_unresolved += un; }
                IAttach(n); IPush(n);
                rep.nodes_imported++;
            }
            else if (meth == "BeginCollapsingHeader" && NA >= 1)
            {
                Node* n = IMake(NCollapsingHeader);
                ISetName(n, arg(0));
                if (NA >= 2) { int un = 0; n->flags = ResolveFlagsExpr(arg(1), un); rep.calls_unresolved += un; }
                IAttach(n); IPush(n);
                rep.nodes_imported++;
            }
            else if (meth == "BeginTable" && NA >= 2)
            {
                Node* n = IMake(NTable);
                ISetName(n, arg(0));
                float cols = 3; FirstNumber(arg(1), cols); n->v_int = (int)cols;
                if (NA >= 3) { int un = 0; n->flags = ResolveFlagsExpr(arg(2), un); rep.calls_unresolved += un; }
                IAttach(n); IPush(n);
                rep.nodes_imported++;
            }
            else if (meth == "BeginPopupModal" && NA >= 1)
            {
                Node* n = IMake(NPopupModal);
                ISetName(n, arg(0));
                if (NA >= 3) { int un = 0; n->flags = ResolveFlagsExpr(arg(2), un); rep.calls_unresolved += un; }
                IAttach(n); IPush(n);
                rep.nodes_imported++;
            }
            else if (meth == "BeginTooltip")
            {
                Node* n = IMake(NTooltip);
                IAttach(n); IPush(n);
                rep.nodes_imported++;
            }
            // ---------- container closes ----------
            else if (meth == "End" || meth == "EndChild" || meth == "EndTabBar" ||
                     meth == "EndTabItem" || meth == "EndMenu" || meth == "EndTable" ||
                     meth == "EndPopup" || meth == "EndCollapsingHeader")
            {
                // End* pops one container regardless of type mismatch (tolerant)
                IPop();
            }
            // ---------- menu bar ----------
            else if (meth == "BeginMenuBar")
            {
                Node* n = IMake(NMenuBar);
                IAttach(n); IPush(n);
                rep.nodes_imported++;
            }
            else if (meth == "EndMenuBar") { IPop(); }
            // ---------- leaf widgets ----------
            else if (meth == "Text" || meth == "TextV" || meth == "TextUnformatted")
            {
                Node* n = IMake(NText);
                ISetName(n, arg(0));
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "TextWrapped")
            {
                Node* n = IMake(NTextWrapped);
                ISetName(n, arg(0));
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "TextDisabled")
            {
                Node* n = IMake(NTextDisabled);
                ISetName(n, arg(0));
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "BulletText")
            {
                Node* n = IMake(NBulletText);
                ISetName(n, arg(0));
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "SeparatorText")
            {
                Node* n = IMake(NSeparatorText);
                ISetName(n, arg(0));
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "Separator")
            {
                Node* n = IMake(NSeparator);
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "Button" && NA >= 1)
            {
                Node* n = IMake(NButton);
                ISetName(n, arg(0));
                if (NA >= 2) { float w = 0, h = 0; ParseVec2Expr(arg(1), w, h); n->w = w; n->h = h; }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "SmallButton")
            {
                Node* n = IMake(NSmallButton);
                ISetName(n, arg(0));
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "ArrowButton" && NA >= 2)
            {
                Node* n = IMake(NArrowButton);
                ISetName(n, arg(0));
                float d = 0; if (FirstNumber(arg(1), d)) n->arrow_dir = (int)d;
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "Checkbox" && NA >= 2)
            {
                Node* n = IMake(NCheckbox);
                ISetName(n, arg(0));
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "RadioButton" && NA >= 2)
            {
                Node* n = IMake(NRadioButton);
                ISetName(n, arg(0));
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "Combo" || meth == "BeginCombo")
            {
                Node* n = IMake(NCombo);
                ISetName(n, arg(0));
                if (NA >= 3)
                {
                    // items given as Selectable pairs inside BeginCombo/EndCombo: we
                    // take the preview (arg1) and known items list if literal
                }
                if (NA >= 4 && meth == "BeginCombo") { int un = 0; n->flags = ResolveFlagsExpr(arg(3), un); rep.calls_unresolved += un; }
                IAttach(n);
                if (meth == "BeginCombo") IPush(n); // Selectables inside become items
                rep.nodes_imported++;
            }
            else if (meth == "EndCombo") { IPop(); }
            else if (meth == "ListBox" || meth == "BeginListBox")
            {
                Node* n = IMake(NListBox);
                ISetName(n, arg(0));
                if (meth == "BeginListBox") { IAttach(n); IPush(n); }
                else IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "EndListBox") { IPop(); }
            else if (meth == "InputText" || meth == "InputTextWithHint")
            {
                Node* n = IMake(NInputText);
                ISetName(n, arg(0));
                if (meth == "InputTextWithHint" && NA >= 2) ISetName(n, arg(1));
                if (NA >= 2) { std::string s; if (FirstStringLiteral(arg(1), s)) strncpy(n->value_str, s.c_str(), 63); }
                if (NA >= 4) { int un = 0; n->flags = ResolveFlagsExpr(arg(3), un); rep.calls_unresolved += un; }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "InputTextMultiline")
            {
                Node* n = IMake(NInputTextMultiline);
                ISetName(n, arg(0));
                if (NA >= 2) { std::string s; if (FirstStringLiteral(arg(1), s)) strncpy(n->value_str, s.c_str(), 63); }
                if (NA >= 5) { int un = 0; n->flags = ResolveFlagsExpr(arg(4), un); rep.calls_unresolved += un; }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "InputInt" && NA >= 2)
            {
                Node* n = IMake(NInputInt);
                ISetName(n, arg(0));
                if (NA >= 5) { int un = 0; n->flags = ResolveFlagsExpr(arg(4), un); rep.calls_unresolved += un; }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "InputFloat" && NA >= 2)
            {
                Node* n = IMake(NInputFloat);
                ISetName(n, arg(0));
                if (NA >= 6) { int un = 0; n->flags = ResolveFlagsExpr(arg(5), un); rep.calls_unresolved += un; }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "DragInt" && NA >= 2)
            {
                Node* n = IMake(NDragInt);
                ISetName(n, arg(0));
                if (NA >= 3) { float sp = 1; if (FirstNumber(arg(2), sp)) n->v_speed = sp; }
                if (NA >= 4) { float mn = 0; if (FirstNumber(arg(3), mn)) n->v_min = mn; }
                if (NA >= 5) { float mx = 0; if (FirstNumber(arg(4), mx)) n->v_max = mx; }
                if (NA >= 6) { int un = 0; n->flags = ResolveFlagsExpr(arg(5), un); rep.calls_unresolved += un; }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "DragFloat" && NA >= 2)
            {
                Node* n = IMake(NDragFloat);
                ISetName(n, arg(0));
                if (NA >= 3) { float sp = 1; if (FirstNumber(arg(2), sp)) n->v_speed = sp; }
                if (NA >= 4) { float mn = 0; if (FirstNumber(arg(3), mn)) n->v_min = mn; }
                if (NA >= 5) { float mx = 1; if (FirstNumber(arg(4), mx)) n->v_max = mx; }
                if (NA >= 6) { int un = 0; n->flags = ResolveFlagsExpr(arg(5), un); rep.calls_unresolved += un; }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "SliderInt" && NA >= 4)
            {
                Node* n = IMake(NSliderInt);
                ISetName(n, arg(0));
                float mn = 0, mx = 100;
                FirstNumber(arg(2), mn); FirstNumber(arg(3), mx);
                n->v_min = mn; n->v_max = mx;
                if (NA >= 5) { int un = 0; n->flags = ResolveFlagsExpr(arg(4), un); rep.calls_unresolved += un; }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "SliderFloat" && NA >= 4)
            {
                Node* n = IMake(NSliderFloat);
                ISetName(n, arg(0));
                float mn = 0, mx = 1;
                FirstNumber(arg(2), mn); FirstNumber(arg(3), mx);
                n->v_min = mn; n->v_max = mx;
                if (NA >= 5) { int un = 0; n->flags = ResolveFlagsExpr(arg(4), un); rep.calls_unresolved += un; }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "ProgressBar" && NA >= 1)
            {
                Node* n = IMake(NProgressBar);
                float fr = 0.7f; if (NA >= 1) FirstNumber(arg(0), fr);
                n->fraction = fr;
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "ColorEdit3" || meth == "ColorEdit4")
            {
                Node* n = IMake(meth == "ColorEdit3" ? NColorEdit3 : NColorEdit4);
                ISetName(n, arg(0));
                if (NA >= 3) { int un = 0; n->flags = ResolveFlagsExpr(arg(2), un); rep.calls_unresolved += un; }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "PlotLines" || meth == "PlotHistogram")
            {
                Node* n = IMake(meth == "PlotLines" ? NPlotLines : NPlotHistogram);
                ISetName(n, arg(0));
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "MenuItem" && NA >= 1)
            {
                Node* n = IMake(NMenuItem);
                ISetName(n, arg(0));
                if (NA >= 2) { std::string s; if (FirstStringLiteral(arg(1), s)) strncpy(n->shortcut, s.c_str(), 23); }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "Selectable")
            {
                Node* n = IMake(NSelectable);
                ISetName(n, arg(0));
                if (NA >= 4) { int un = 0; n->flags = ResolveFlagsExpr(arg(3), un); rep.calls_unresolved += un; }
                IAttach(n);
                rep.nodes_imported++;
            }
            else if (meth == "TableNextRow")
            {
                // begin a new row under the current Table node
                Node* t = ICur();
                if (t && t->kind == NTable)
                {
                    Node* row = IMake(NTreeNode /*row placeholder kind=TableRow below*/);
                    row->kind = NTableRow;
                    Node_AddChild(t, row);
                    IPush(row);
                    rep.nodes_imported++;
                }
            }
            else if (meth == "TableSetupColumn" || meth == "TableSetupScrollFreeze" ||
                     meth == "TableHeadersRow")
            {
                // table detail calls: noted, structure stays rows/cells
            }
            // pre-window setters (applied to the NEXT Begin in same file)
            else if (meth == "SetNextWindowSize")
            {
                float w = 0, h = 0;
                ParseVec2Expr(arg(0), w, h);
                g_pending_size = ImVec2(w, h);
            }
            else if (meth == "SetNextWindowPos")
            {
                float x = 0, y = 0;
                ParseVec2Expr(arg(0), x, y);
                g_pending_pos = ImVec2(x, y);
            }
            else if (meth == "SetNextWindowCond")
            {
                int un = 0;
                int c = ResolveFlagsExpr(arg(0), un);
                g_pending_cond = c;
            }
            // rest: silently ignored (style, drawlist, io config etc.)
        }

        // ---------------------------------------------------------------------------
        // File scan + folder import
        // ---------------------------------------------------------------------------
        static void ParseImguiFile(const std::string& path, const std::string& text, Node*& root, ImportReport& rep)
        {
            const char* fname = strrchr(path.c_str(), '/');
            fname = fname ? fname + 1 : path.c_str();
            g_cur_fname = fname;
            g_file_win = nullptr; // per-file auto-window

            // split into lines; accumulate multi-line calls (bounded)
            std::vector<std::string> lines_v;
            {
                size_t p = 0;
                while (true)
                {
                    size_t nl = text.find('\n', p);
                    lines_v.push_back(text.substr(p, (nl == std::string::npos ? text.size() : nl) - p));
                    if (nl == std::string::npos) break;
                    p = nl + 1;
                }
            }

            std::string acc; int acc_line = 0, acc_lines = 0;
            for (int li = 0; li < (int)lines_v.size(); li++)
            {
                const std::string& raw = lines_v[li];

                // non-ImGui detection on the raw line
                for (auto& r : kNonImguiRules)
                {
                    if (raw.find(r.token) != std::string::npos)
                    {
                        char where[512];
                        snprintf(where, sizeof(where), "%s:%d: [%s] %s",
                                 fname, li + 1, r.lib, raw.substr(0, 100).c_str());
                        rep.non_imgui.push_back(where);
                        break;
                    }
                }

                if (!acc.empty())
                {
                    acc += " "; acc += raw; acc_lines++;
                    int opens = 0, closes = 0;
                    for (char c : acc) { if (c == '(') opens++; else if (c == ')') closes++; }
                    if (closes >= opens && closes > 0)
                    {
                        HandleCall(acc, acc_line, root, rep, fname);
                        acc.clear();
                    }
                    else if (acc_lines > 20) acc.clear();
                    continue;
                }

                // strip // comments outside strings
                std::string code = raw;
                {
                    bool in_str = false; size_t cq = std::string::npos;
                    for (size_t i = 0; i < code.size(); i++)
                    {
                        if (code[i] == '"') in_str = !in_str;
                        if (!in_str && code[i] == '/' && i + 1 < code.size() && code[i+1] == '/') { cq = i; break; }
                    }
                    if (cq != std::string::npos) code = code.substr(0, cq);
                }

                size_t ip = code.find("ImGui::");
                if (ip == std::string::npos) continue;
                // find matching close paren of the first call on this line
                size_t call = code.find('(', ip + 7);
                if (call == std::string::npos) continue;
                int depth = 0; bool in_str = false; size_t end = std::string::npos;
                for (size_t i = call; i < code.size(); i++)
                {
                    if (in_str) { if (code[i] == '\\') i++; else if (code[i] == '"') in_str = false; continue; }
                    if (code[i] == '"') { in_str = true; continue; }
                    if (code[i] == '(') depth++;
                    else if (code[i] == ')') { depth--; if (depth == 0) { end = i; break; } }
                }
                if (end == std::string::npos)
                {
                    acc = code; acc_line = li + 1; acc_lines = 0;
                    continue;
                }
                // single-line call: dispatch from ip to end
                HandleCall(code.substr(0, end + 1), li + 1, root, rep, fname);
            }
        }


        // Console accessors (used by editor_chrome.cpp, defined before this include)
        void ImportReportClear() { g_import.lines.clear(); g_import.non_imgui.clear(); }
        int  ImportReportScanned()      { return g_import.files_scanned; }
        int  ImportReportNodes()        { return g_import.nodes_imported; }
        int  ImportReportFilesWithImgui(){ return g_import.files_with_imgui; }
        int  ImportReportNonImguiCount(){ return (int)g_import.non_imgui.size(); }
        const char* ImportReportNonImguiLine(int i)
        { return (i >= 0 && i < (int)g_import.non_imgui.size()) ? g_import.non_imgui[i].c_str() : ""; }

        // Import a whole folder tree. Returns the new root (or null).
        // Hard 8-second budget: pathological/huge folders can never hang the app.
        #include <time.h>
        static Node* ImportFolder(const char* folder, ImportReport& rep)
        {
            struct timespec ts0; clock_gettime(CLOCK_MONOTONIC, &ts0);
            auto elapsed_s = [&]() {
                struct timespec t; clock_gettime(CLOCK_MONOTONIC, &t);
                return (float)(t.tv_sec - ts0.tv_sec) + (t.tv_nsec - ts0.tv_nsec) / 1e9f;
            };

            std::vector<std::string> files;
            CollectFiles(folder, files, 0);
            rep.files_scanned = (int)files.size();
            std::sort(files.begin(), files.end()); // deterministic order

            Node* root = nullptr;
            g_istack.clear();
            g_pending_size = ImVec2(0, 0);
            g_pending_pos  = ImVec2(0, 0);
            g_pending_cond = 0;

            for (auto& f : files)
            {
                if (elapsed_s() > 8.0f) { rep.lines.push_back("import budget exhausted; stopped early"); break; }
                std::string text = ReadFileText(f.c_str());
                if (text.empty()) continue;
                bool had_root = (root != nullptr);
                ParseImguiFile(f, text, root, rep);
                // reset stack between files; adopt this file's auto-window (if any)
                g_istack.clear();
                if (g_file_win)
                {
                    if (!root) root = g_file_win;
                    else Node_AddChild(root, g_file_win); // multi-window document
                    g_file_win = nullptr;
                }
                if (text.find("ImGui::") != std::string::npos) rep.files_with_imgui++;
            }
            if (root) Node_ResyncIds(root);
            rep.imported_root = root;
            rep.nodes_imported = Node_TotalCount(root);
            return root;
        }

        IMGUIED_EOF

        echo '[gen] project files written:'
        find . -type f | sort
    - name: Fetch real Dear ImGui ${{ env.IMGUI_VERSION_TAG }}
      run: curl -L --fail --retry 3 -o /tmp/imgui.tgz "https://codeload.github.com/ocornut/imgui/tar.gz/refs/tags/${IMGUI_VERSION_TAG}" && mkdir -p app/src/main/cpp/imgui && tar -xzf /tmp/imgui.tgz -C app/src/main/cpp/imgui --strip-components=1 && ls app/src/main/cpp/imgui | head && grep -q 'IMGUI_VERSION       "1.91.5"' app/src/main/cpp/imgui/imgui.h && echo 'Dear ImGui v1.91.5 fetched OK'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Accept Android SDK licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
    - name: Install NDK + CMake (pinned)
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null'
    - name: Build debug APK (assembles native ImGui via CMake)
      run: gradle assembleDebug --no-daemon --stacktrace
    - name: Build release APK
      run: gradle assembleRelease --no-daemon --stacktrace
    - name: Collect APKs
      run: mkdir -p dist && cp app/build/outputs/apk/debug/app-debug.apk dist/ImGuiMenuEditor-debug.apk && cp app/build/outputs/apk/release/app-release-unsigned.apk dist/ImGuiMenuEditor-release-unsigned.apk 2>/dev/null || cp app/build/outputs/apk/release/app-release.apk dist/ImGuiMenuEditor-release-unsigned.apk 2>/dev/null || true; ls -la dist/ || true
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImGuiMenuEditor-APK
        path: dist/*.apk
