        write_if_missing android/app/src/main/java/com/raais/imstudio/ui/dialogs/ConfirmDialog.kt <<'EOF'
        package com.raais.imstudio.ui.dialogs

        import androidx.compose.material3.AlertDialog
        import androidx.compose.material3.Text
        import androidx.compose.material3.TextButton
        import androidx.compose.runtime.Composable

        @Composable
        fun ConfirmDeleteDialog(
            widgetId: Int,
            onConfirm: () -> Unit,
            onDismiss: () -> Unit
        ) {
            AlertDialog(
                onDismissRequest = onDismiss,
                title = { Text("حذف ویجت") },
                text = { Text("حذف ویجت #$widgetId؟") },
                confirmButton = { TextButton(onClick = onConfirm) { Text("حذف") } },
                dismissButton = { TextButton(onClick = onDismiss) { Text("لغو") } }
            )
        }
        EOF
      shell: bash

    # ============================================================
    # 7. مستندات و .gitignore
    # ============================================================
    - name: Generate docs and gitignore
      run: |
        write_if_missing .gitignore <<'EOF'
        # Android
        *.iml
        .gradle/
        .idea/
        local.properties
        .DS_Store
        build/
        captures/
        .externalNativeBuild/
        .cxx/
        *.apk
        *.aab
        android/app/build/
        android/build/
        android/app/.cxx/

        # Logs
        *.log
        EOF

        write_if_missing README.md <<'EOF'
        # ImStudio Android

        Native Android port of [Raais/ImStudio](https://github.com/Raais/ImStudio)
        with a Jetpack Compose UI.
        EOF

        write_if_missing docs/ARCHITECTURE.md <<'EOF'
        # Architecture

        This project re-implements ImStudio's editor UI natively on Android using
        Jetpack Compose while reusing the upstream C++ core.
        EOF

        write_if_missing docs/BUILD.md <<'EOF'
        # Build

        Prereqs: JDK 17, Android SDK, NDK 26.1.10909125.

        ```bash
        cd android
        ./gradlew assembleDebug
        ```
        EOF

        write_if_missing docs/UPSTREAM.md <<'EOF'
        # Upstream sync

        The file `.upstream-commit` records the upstream SHA from the last successful sync.
        EOF

        write_if_missing scripts/sync-upstream.sh <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail

        ROOT=$(cd "$(dirname "$0")/.." && pwd)
        TMP=$(mktemp -d)
        trap 'rm -rf "$TMP"' EXIT

        echo "→ Cloning upstream ImStudio..."
        git clone --depth 1 https://github.com/Raais/ImStudio "$TMP/ImStudio"

        VD="$ROOT/android/app/src/main/cpp/vendor"
        mkdir -p "$VD"/{imstudio,imgui,fmt}

        cp -f "$TMP"/ImStudio/src/sources/ims_generator.cpp "$VD/imstudio/"
        cp -f "$TMP"/ImStudio/src/sources/ims_generator.h   "$VD/imstudio/"
        cp -f "$TMP"/ImStudio/src/sources/ims_buffer.cpp    "$VD/imstudio/"
        cp -f "$TMP"/ImStudio/src/sources/ims_buffer.h      "$VD/imstudio/"
        cp -f "$TMP"/ImStudio/src/sources/ims_object.h      "$VD/imstudio/"
        [ -f "$TMP"/ImStudio/src/sources/ims_object.cpp ] && cp -f "$TMP"/ImStudio/src/sources/ims_object.cpp "$VD/imstudio/" || true
        [ -f "$TMP"/ImStudio/src/utils/ims_utils.cpp ] && cp -f "$TMP"/ImStudio/src/utils/ims_utils.cpp "$VD/imstudio/" || true
        [ -f "$TMP"/ImStudio/src/utils/ims_utils.h ]   && cp -f "$TMP"/ImStudio/src/utils/ims_utils.h   "$VD/imstudio/" || true

        cp -f "$TMP"/ImStudio/src/third-party/imgui/imgui*.cpp "$VD/imgui/" 2>/dev/null || true
        cp -f "$TMP"/ImStudio/src/third-party/imgui/imgui*.h   "$VD/imgui/" 2>/dev/null || true
        cp -f "$TMP"/ImStudio/src/third-party/imgui/imconfig.h "$VD/imgui/" 2>/dev/null || true
        cp -f "$TMP"/ImStudio/src/third-party/imgui/imstb_*.h  "$VD/imgui/" 2>/dev/null || true

        mkdir -p "$VD/imgui/misc/cpp"
        cp -f "$TMP"/ImStudio/src/third-party/imgui/misc/cpp/imgui_stdlib.h   "$VD/imgui/misc/cpp/" 2>/dev/null || true
        cp -f "$TMP"/ImStudio/src/third-party/imgui/misc/cpp/imgui_stdlib.cpp "$VD/imgui/misc/cpp/" 2>/dev/null || true

        if [ -d "$TMP"/ImStudio/src/third-party/fmt/include/fmt ]; then
            mkdir -p "$VD/fmt/include/fmt"
            cp -f "$TMP"/ImStudio/src/third-party/fmt/include/fmt/*.h "$VD/fmt/include/fmt/"
        fi

        SHA=$(cd "$TMP/ImStudio" && git rev-parse --short HEAD)
        echo "$SHA" > "$ROOT/.upstream-commit"
        echo "✓ Synced upstream commit $SHA"
        EOF
        chmod +x scripts/sync-upstream.sh
      shell: bash

    # ============================================================
    # 8. Commit & push به ریپوی خودت
    # ============================================================
    - name: Commit and push to your repo
      run: |
        git config user.name "ImStudio Sync Bot"
        git config user.email "bot@imstudio.local"

        git add -A

        echo "=== Files staged ==="
        git diff --staged --name-only | wc -l
        git diff --staged --stat | tail -5

        if git diff --staged --quiet; then
          echo "Nothing to commit — repo already up to date."
        else
          git commit -m "chore: sync from upstream @ ${UPSTREAM_SHA} [skip ci]"
          git push
          echo "✓ Pushed to ${GITHUB_REF_NAME}"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ============================================================
    # 9. Build APK
    # ============================================================
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK (without NDK)
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Install Android NDK 26.1.10909125
      run: |
        echo "y" | sdkmanager --install "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
        ls $ANDROID_HOME/ndk/

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: |
        cd android
        gradle wrapper --gradle-version 8.4
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ImStudio-Android-${{ env.UPSTREAM_SHA }}
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
