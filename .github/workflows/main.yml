        inline const FlagDef* FlagTableFor(int kind, int& n)
        {
            switch (kind)
            {
            case NWindow: case NPopupModal: return FlagTableWindow(n);
            case NChild: return FlagTableChild(n);
            case NCollapsingHeader: case NTreeNode: return FlagTableTreeNode(n);
            case NInputText: case NInputTextMultiline: case NInputInt: case NInputFloat:
                return FlagTableInputText(n);
            case NSliderInt: case NSliderFloat: case NDragInt: case NDragFloat:
                return FlagTableSlider(n);
            case NCombo: return FlagTableCombo(n);
            case NSelectable: return FlagTableSelectable(n);
            case NTabBar: return FlagTableTabBar(n);
            case NTabItem: return FlagTableTabItem(n);
            case NTable: return FlagTableTable(n);
            case NTableRow: return FlagTableTableRow(n);
            case NColorEdit3: case NColorEdit4: return FlagTableColorEdit(n);
            default: n = 0; return nullptr;
            }
        }

