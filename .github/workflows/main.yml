        package com.raais.imstudio.ui

        import androidx.compose.foundation.background
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.rememberScrollState
        import androidx.compose.foundation.verticalScroll
        import androidx.compose.material3.*
        import androidx.compose.runtime.Composable
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.unit.dp
        import com.raais.imstudio.engine.EditorViewModel
        import com.raais.imstudio.engine.ImStudioState

        @Composable
        fun PropertiesPanel(state: ImStudioState, vm: EditorViewModel) {
            val selected = state.selected()

            Column(
                modifier = Modifier
                    .fillMaxHeight()
                    .background(MaterialTheme.colorScheme.surface)
                    .verticalScroll(rememberScrollState())
                    .padding(16.dp),
                verticalArrangement = Arrangement.spacedBy(12.dp)
            ) {
                Text("ویژگی‌ها", style = MaterialTheme.typography.titleMedium)

                if (selected == null) {
                    Text(
                        "یک ویجت را روی بوم انتخاب کنید",
                        color = MaterialTheme.colorScheme.onSurfaceVariant
                    )
                    return
                }

                OutlinedTextField(
                    value = selected.label,
                    onValueChange = { state.setLabel(selected.id, it) },
                    label = { Text("Label") },
                    modifier = Modifier.fillMaxWidth(),
                    singleLine = true
                )

                OutlinedTextField(
                    value = selected.valueS,
                    onValueChange = { state.setValueS(selected.id, it) },
                    label = { Text("Value (value_s)") },
                    modifier = Modifier.fillMaxWidth(),
                    singleLine = true
                )

                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                    NumField(
                        value = selected.x,
                        label = "X",
                        onChange = { state.moveWidget(selected.id, it, selected.y) },
                        modifier = Modifier.weight(1f)
                    )
                    NumField(
                        value = selected.y,
                        label = "Y",
                        onChange = { state.moveWidget(selected.id, selected.x, it) },
                        modifier = Modifier.weight(1f)
                    )
                }

                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                    NumField(
                        value = selected.sizeX,
                        label = "Size X",
                        onChange = { state.resizeWidget(selected.id, it, selected.sizeY) },
                        modifier = Modifier.weight(1f)
                    )
                    NumField(
                        value = selected.sizeY,
                        label = "Size Y",
                        onChange = { state.resizeWidget(selected.id, selected.sizeX, it) },
                        modifier = Modifier.weight(1f)
                    )
                }

                OutlinedTextField(
                    value = selected.type,
                    onValueChange = {},
                    enabled = false,
                    label = { Text("Type") },
                    modifier = Modifier.fillMaxWidth()
                )

                HorizontalDivider()

                Button(
                    onClick = { state.deleteWidget(selected.id) },
                    colors = ButtonDefaults.buttonColors(
                        containerColor = MaterialTheme.colorScheme.error
                    ),
                    modifier = Modifier.fillMaxWidth()
                ) {
                    Text("حذف ویجت")
                }
            }
        }

        @Composable
        private fun NumField(
            value: Float,
            label: String,
            onChange: (Float) -> Unit,
            modifier: Modifier = Modifier
        ) {
            OutlinedTextField(
                value = value.toString(),
                onValueChange = { it.toFloatOrNull()?.let(onChange) },
                label = { Text(label) },
                modifier = modifier,
                singleLine = true
            )
        }
