        mkdir -p "$(dirname 'app/src/main/cpp/editor_import.cpp')"
        cat > 'app/src/main/cpp/editor_import.cpp' <<'IMGUIED_EOF'
        // editor_import.cpp - Project importer: scans an imported folder (copied to
        // cacheDir/import by MainActivity via SAF), parses C/C++/header files, and
        // rebuilds an editor document from the REAL ImGui calls it finds.
        //
        // Structure/nesting: ImGui::Begin/BeginChild/BeginTabBar/BeginTabItem/
        // BeginMenu/BeginCollapsingHeader/BeginTable + matching End* form a stack,
        // so nested layouts inside one window become a proper node tree.
        //
        // Every flag argument (e.g. ImGuiWindowFlags_NoResize|ImGuiWindowFlags_MenuBar)
        // is resolved BY NAME via editor_flags.h (all 589 enum entries), so imported
        // flags round-trip exactly.
        //
        // Non-ImGui report: any .cpp/.h/.cc file is scanned; calls that are NOT ImGui
        // API are ignored, and lines that use other well-known libraries are logged
        // (file:line: the call) in the "not related to imgui" report, shown in the
        // in-app console AND exported to Downloads.
        #pragma once
        #include "editor_nodes.h"
        #include "editor_flags.h"
        #include <dirent.h>
        #include <sys/stat.h>
        #include <algorithm>
        #include <vector>
        #include <string>

        // ---------------------------------------------------------------------------
        // Import state + report
        // ---------------------------------------------------------------------------
        struct ImportReport
        {
            int                  files_scanned = 0;
            int                  files_with_imgui = 0;
            int                  nodes_imported = 0;
            int                  calls_unresolved = 0;
            std::vector<std::string> lines;      // report lines (console + export)
            std::vector<std::string> non_imgui; // "file:line: [lib] code" entries
            Node*                imported_root = nullptr;
        };

        static ImportReport g_import;

        // ---------------------------------------------------------------------------
        // Small helpers
        // ---------------------------------------------------------------------------
        static bool HasSuffixCI(const char* s, const char* suf)
        {
            size_t ls = strlen(s), lf = strlen(suf);
            if (ls < lf) return false;
            for (size_t i = 0; i < lf; i++)
            {
                char a = s[ls - lf + i], b = suf[i];
                if (a >= 'A' && a <= 'Z') a += 32;
                if (b >= 'A' && b <= 'Z') b += 32;
                if (a != b) return false;
            }
            return true;
        }

        static bool IsSourceFile(const char* name)
        {
            return HasSuffixCI(name, ".cpp") || HasSuffixCI(name, ".cc") || HasSuffixCI(name, ".cxx") ||
                   HasSuffixCI(name, ".h") || HasSuffixCI(name, ".hpp") || HasSuffixCI(name, ".inl") ||
                   HasSuffixCI(name, ".c");
        }

        static std::string ReadFileText(const char* path)
        {
            FILE* f = fopen(path, "rb");
            if (!f) return "";
            std::string s;
            char buf[4096]; size_t r;
            while ((r = fread(buf, 1, sizeof(buf), f)) > 0) s.append(buf, r);
            fclose(f);
            return s;
        }

        static void Unescape(std::string& s)
        {
            std::string o; o.reserve(s.size());
            for (size_t i = 0; i < s.size(); i++)
            {
                if (s[i] == '\\' && i + 1 < s.size())
                {
                    char c = s[++i];
                    if (c == 'n') o += '\n';
                    else if (c == 't') o += '\t';
                    else if (c == 'r') o += '\r';
                    else o += c;
                }
                else o += s[i];
            }
            s.swap(o);
        }

        // Split a call's argument list on top-level commas (parens/braces/strings ok).
        static void SplitArgs(const std::string& args, std::vector<std::string>& out)
        {
            int depth = 0; bool in_str = false; size_t start = 0;
            for (size_t i = 0; i <= args.size(); i++)
            {
                char c = (i < args.size()) ? args[i] : ',';
                if (in_str)
                {
                    if (c == '\\') { i++; continue; }
                    if (i < args.size() && c == '"') in_str = false;
                    continue;
                }
                if (c == '"') { in_str = true; continue; }
                if (c == '(' || c == '{' || c == '[') depth++;
                else if (c == ')' || c == '}' || c == ']') depth--;
                if (c == ',' && depth <= 0)
                {
                    std::string a = args.substr(start, i - start);
                    size_t b = a.find_first_not_of(" \t\r\n");
                    size_t e = a.find_last_not_of(" \t\r\n");
                    if (b != std::string::npos) out.push_back(a.substr(b, e - b + 1));
                    start = i + 1;
                    depth = std::max(depth, 0);
                }
            }
        }

        static bool FirstStringLiteral(const std::string& e, std::string& out)
        {
            size_t q = e.find('"');
            if (q == std::string::npos) return false;
            std::string s;
            for (size_t i = q + 1; i < e.size(); i++)
            {
                if (e[i] == '\\') { s += e[i]; if (i + 1 < e.size()) s += e[++i]; continue; }
                if (e[i] == '"') break;
                s += e[i];
            }
            Unescape(s);
            out = s;
            return true;
        }

        static bool FirstNumber(const std::string& e, float& out)
        {
            size_t i = 0;
            while (i < e.size() && !(isdigit((unsigned char)e[i]) || e[i] == '-' || e[i] == '+')) i++;
            if (i >= e.size()) return false;
            const char* p = e.c_str() + i;
            char* end = nullptr;
            double v = strtod(p, &end);
            if (end == p) return false;
            out = (float)v;
            return true;
        }

        // Parse "ImVec2(x, y)" (or the two first numbers after a possible label)
        // into x/y. Handles: ImVec2(60, 40), ImVec2(w, 300), {-1, 0}.
        static bool ParseVec2Expr(const std::string& e, float& x, float& y)
        {
            size_t p = e.find('(');
            if (p == std::string::npos) p = e.find('{');
            std::string inner = (p != std::string::npos) ? e.substr(p + 1) : e;
            size_t cm = inner.find(',');
            std::string xs = (cm != std::string::npos) ? inner.substr(0, cm) : inner;
            std::string ys = (cm != std::string::npos) ? inner.substr(cm + 1) : std::string();
            bool ok = false;
            if (FirstNumber(xs, x)) ok = true; else x = 0;
            if (cm != std::string::npos) { if (FirstNumber(ys, y)) ok = true; else y = 0; }
            else y = 0;
            return ok;
        }

        // Resolve "ImGuiWindowFlags_NoResize | ImGuiWindowFlags_MenuBar" (names, int
        // literals, or mixed) to a single int. Unknown tokens increment unresolved.
        static int ResolveFlagsExpr(const std::string& e, int& unresolved)
        {
            int val = 0;
            size_t i = 0;
            while (i < e.size())
            {
                while (i < e.size() && (isspace((unsigned char)e[i]) || e[i] == '|' || e[i] == '(' || e[i] == ')')) i++;
                if (i >= e.size()) break;
                size_t s = i;
                while (i < e.size() && (isalnum((unsigned char)e[i]) || e[i] == '_' || e[i] == '.')) i++;
                std::string tok = e.substr(s, i - s);
                if (tok.empty()) { i = s + 1; continue; } // always advance: guard vs stall
                if (tok == "0") { /* keep 0 */ }
                else
                {
                    int v;
                    if (ImGuiEdResolveName(tok.c_str(), v)) val |= v;
                    else if (tok[0] >= '0' && tok[0] <= '9') val |= atoi(tok.c_str());
                    else unresolved++;
                }
            }
            return val;
        }

        // Recursively collect source files under dir (depth-limited, cycle-safe).
        static void CollectFiles(const std::string& dir, std::vector<std::string>& files, int depth = 0)
        {
            if (depth > 8) return;
            DIR* d = opendir(dir.c_str());
            if (!d) return;
            struct dirent* e;
            while ((e = readdir(d)) != nullptr)
            {
                if (!strcmp(e->d_name, ".") || !strcmp(e->d_name, "..")) continue;
                std::string p = dir + "/" + e->d_name;
                struct stat st;
                if (stat(p.c_str(), &st) != 0) continue;
                if (S_ISDIR(st.st_mode)) CollectFiles(p, files, depth + 1);
                else if (IsSourceFile(e->d_name)) files.push_back(p);
            }
            closedir(d);
        }

