                    text = { Text("همه ویجت‌ها حذف شوند؟") },
                    confirmButton = { TextButton(onClick = { vm.clearAll(); pendingClear = false }) { Text("پاک کن") } },
                    dismissButton = { TextButton(onClick = { pendingClear = false }) { Text("لغو") } })
            }
        }
