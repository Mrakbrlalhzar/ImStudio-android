name: Fix android_main linkage and build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Patch android_main.cpp with extern "C"
      run: |
        # Find the definition of android_main and add extern "C" before it
        if grep -q "void android_main(android_app\* app)" android/app/src/main/cpp/android_main.cpp; then
          sed -i 's/void android_main(android_app\* app)/extern "C" void android_main(android_app* app)/' android/app/src/main/cpp/android_main.cpp
          echo "Patched android_main.cpp with extern \"C\""
        else
          echo "ERROR: android_main definition not found"
          exit 1
        fi

    - name: Patch CMakeLists.txt to add -u android_main
      run: |
        # Add -u android_main to linker flags to prevent symbol stripping
        if ! grep -q "u android_main" android/app/src/main/cpp/CMakeLists.txt; then
          sed -i '/target_link_options(imguieditor PRIVATE "-u" "ANativeActivity_onCreate")/a target_link_options(imguieditor PRIVATE "-u" "android_main")' android/app/src/main/cpp/CMakeLists.txt
          echo "Patched CMakeLists.txt with -u android_main"
        else
          echo "CMakeLists.txt already has -u android_main"
        fi

    - name: Commit fix
      run: |
        git config user.name "ImGui Engine Bot"
        git config user.email "bot@imgui-engine.local"
        git add -A
        if git diff --staged --quiet; then echo "Nothing to commit"; else
          git commit -m "fix(android): add extern \"C\" to android_main and -u linker flag [skip ci]"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Install NDK
      run: |
        echo "y" | sdkmanager --install "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: |
        cd android
        if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.4; fi
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ImGui-Visual-Engine
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
