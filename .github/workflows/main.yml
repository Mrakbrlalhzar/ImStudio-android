        Node* Node_New(int kind)
        {
            Node* n = new Node();
            Node_MakeDefault(n, kind);
            return n;
        }

        // Re-assign fresh sequential ids to a loaded tree so new-node ids never
        // collide with existing ones (stale ids from an old save file).
        void Node_ResyncIds(Node* root)
        {
            std::vector<Node*> stack;
            if (root) stack.push_back(root);
            int depth = 0;
            while (!stack.empty() && depth++ < 65536)
            {
                Node* n = stack.back(); stack.pop_back();
                n->id = Node_NextId();
                for (Node* c : n->children) stack.push_back(c);
            }
        }

        void Node_Delete(Node* n) { delete n; }

        static Node* Node_CloneDepth(const Node* src, Node* parent, int depth)
        {
            Node* n = new Node(*src);
            n->id = Node_NextId();
            n->parent = parent;
            n->children.clear();
            if (depth < NODE_MAX_DEPTH)
                for (Node* c : src->children)
                    n->children.push_back(Node_CloneDepth(c, n, depth + 1));
            return n;
        }
        Node* Node_Clone(const Node* src, Node* parent)
        {
            return Node_CloneDepth(src, parent, 0);
        }

        Node* Node_FindById(Node* root, int id)
        {
            // depth-capped to guarantee termination on corrupt (cyclic) trees
            std::vector<Node*> stack;
            if (root) stack.push_back(root);
            int depth = 0;
            while (!stack.empty() && depth++ < 4096)
            {
                Node* n = stack.back(); stack.pop_back();
                if (n->id == id) return n;
                if ((int)n->children.size() > 4096) continue;
                for (Node* c : n->children) stack.push_back(c);
            }
            return nullptr;
        }

        void Node_AddChild(Node* p, Node* c, int pos)
        {
            if (!p || !c) return;
            // Cycle guard: never let a node become its own descendant. A cyclic tree
            // makes every render/save walk recurse without bound -> stack overflow.
            if (p == c) return;
            for (Node* a = p; a; a = a->parent)
                if (a == c) { return; }
            c->parent = p;
            if (pos < 0 || pos >= (int)p->children.size())
                p->children.push_back(c);
            else
                p->children.insert(p->children.begin() + pos, c);
        }

        void Node_RemoveFromParent(Node* n)
        {
            if (!n || !n->parent) return;
            auto& v = n->parent->children;
            for (auto it = v.begin(); it != v.end(); ++it)
                if (*it == n) { v.erase(it); break; }
            n->parent = nullptr;
        }

        int Node_IndexInParent(const Node* n)
        {
            if (!n || !n->parent) return -1;
            auto& v = n->parent->children;
            for (size_t i = 0; i < v.size(); i++) if (v[i] == n) return (int)i;
            return -1;
        }

        int Node_TotalCount(const Node* n)
        {
            // depth-capped (see NODE_MAX_DEPTH)
            if (!n) return 0;
            int c = 1;
            for (Node* ch : n->children) c += Node_TotalCount(ch);
            return c;
        }

        const char* Node_ShortLabel(const Node* n)
        {
            static char buf[128];
            if ((n->kind == NText) || (n->kind == NTextWrapped) || (n->kind == NTextDisabled) || (n->kind == NBulletText))
                snprintf(buf, sizeof(buf), "%s: %s", NodeKindName(n->kind), n->value_str);
            else
                snprintf(buf, sizeof(buf), "%s: %s", NodeKindName(n->kind), n->name);
            return buf;
        }

        // ---------------------------------------------------------------------------
        // Serialization
        // ---------------------------------------------------------------------------
        static void Esc(std::string& out, const char* s)
        {
            for (const char* p = s; *p; p++)
            {
                if (*p == '\n') out += "\\n";
                else if (*p == '\\' || *p == ';') { out += '\\'; out += *p; }
                else out += *p;
            }
        }
        static const char* Unesc(const char* s, char* out, size_t outsz)
        {
            size_t j = 0;
            for (const char* p = s; *p && j + 1 < outsz; p++)
            {
                if (*p == '\\' && p[1])
                {
                    p++;
                    if (*p == 'n') out[j++] = '\n';
                    else out[j++] = *p;
                }
                else out[j++] = *p;
            }
            out[j] = 0;
            return out;
        }

        void SerializeNode(const Node* n, std::string& out, int depth)
        {
            char line[1024], tmp[256];
            snprintf(line, sizeof(line), "%d {k=%s; n=%s; v=%s; o=%d; vis=%d; sel=%d; pf=%d; f1=%d; f2=%d; ad=%d; "
                     "i1=%d; i2=%d; fA=%.4g; fB=%.4g; fC=%.4g; fD=%.4g; mn=%.4g; mx=%.4g; sp=%.4g; w=%.4g; h=%.4g; "
                     "px=%.4g; py=%.4g; pc=%d; "
                     "c0=%.3f,%.3f,%.3f,%.3f; fr=%.3g; ci=%d; fmt=%s; sc=%s; sl=%d; ind=%.4g; "
                     "sa=%d; sav=%.3g; cU=%d%d%d; cI=%d,%d,%d; cV=%s",
                     depth, NodeKindName(n->kind), n->name, n->value_str, n->open?1:0, n->visible?1:0, n->selected?1:0,
                     n->p_open_flag?1:0, n->flags, n->flags2, n->arrow_dir,
                     n->v_int, n->v_int2, n->v_float, n->v_float2, n->v_float3, n->v_float4, n->v_min, n->v_max, n->v_speed, n->w, n->h,
                     n->pos_x, n->pos_y, n->pos_cond,
                     n->colors[0], n->colors[1], n->colors[2], n->colors[3], n->fraction, n->combo_i, n->fmt, n->shortcut,
                     n->same_line?1:0, n->indent,
                     n->st_alpha_used?1:0, n->st_alpha,
                     n->st_col_used[0]?1:0, n->st_col_used[1]?1:0, n->st_col_used[2]?1:0,
                     n->st_col_id[0], n->st_col_id[1], n->st_col_id[2],
                     tmp);
            // colors overrides: serialize 3 slots as hex after cV marker
            char cols[256]; cols[0] = 0;
            for (int i = 0; i < 3; i++)
            {
                char cbuf[32];
                if (n->st_col_used[i])
                {
                    unsigned r = (unsigned)(n->st_col_v[i][0]*255.0f+0.5f), g = (unsigned)(n->st_col_v[i][1]*255.0f+0.5f),
                             b = (unsigned)(n->st_col_v[i][2]*255.0f+0.5f), a = (unsigned)(n->st_col_v[i][3]*255.0f+0.5f);
                    snprintf(cbuf, sizeof(cbuf), "%02X%02X%02X%02X", r, g, b, a);
                }
                else snprintf(cbuf, sizeof(cbuf), "-");
                strcat(cols, i ? "," : ""); strcat(cols, cbuf);
            }
            strcat(line, cols);
            strcat(line, "}\n");
            out += line;
            if (depth < NODE_MAX_DEPTH)
                for (Node* c : n->children)
                    SerializeNode(c, out, depth + 1);
        }

        std::string SaveTreeToString(const Node* root)
        {
            std::string s;
            s += "#IMGUI_MENU_V2\n";
            if (root) SerializeNode(root, s, 0);
            return s;
        }

        // --- parse helpers ---
        static std::string GetField(const char* body, const char* key)
        {
            char pat[64]; snprintf(pat, sizeof(pat), "%s=", key);
            const char* p = strstr(body, pat);
            if (!p) return "";
            p += strlen(pat);
            std::string v;
            while (*p && *p != ';') v += *p++;
            return v;
        }

        static Node* ParseNodeLine(const char* line)
        {
            // line: "DEPTH { fields }"
            int depth = atoi(line);
            const char* b = strchr(line, '{');
            const char* e = strrchr(line, '}');
            if (!b || !e || e <= b) return nullptr;
            std::string body(b + 1, e - b - 1);
            // split off cV hex list (last field)
            std::string kv = GetField(body.c_str(), "k");
            if (kv.empty()) return nullptr;
            Node* n = new Node();
            Node_MakeDefault(n, NodeKindFromName(kv.c_str()));
            char t1[64], t2[64];
            Unesc(GetField(body.c_str(), "n").c_str(), n->name, sizeof(n->name));
            Unesc(GetField(body.c_str(), "v").c_str(), n->value_str, sizeof(n->value_str));
            n->open       = GetField(body.c_str(), "o").c_str()[0] == '1';
            n->visible    = GetField(body.c_str(), "vis").c_str()[0] == '1';
            n->selected   = GetField(body.c_str(), "sel").c_str()[0] == '1';
            n->p_open_flag= GetField(body.c_str(), "pf").c_str()[0] == '1';
            n->flags      = atoi(GetField(body.c_str(), "f1").c_str());
            n->flags2     = atoi(GetField(body.c_str(), "f2").c_str());
            n->arrow_dir  = atoi(GetField(body.c_str(), "ad").c_str());
            n->v_int      = atoi(GetField(body.c_str(), "i1").c_str());
            n->v_int2     = atoi(GetField(body.c_str(), "i2").c_str());
            n->v_float    = (float)atof(GetField(body.c_str(), "fA").c_str());
            n->v_float2   = (float)atof(GetField(body.c_str(), "fB").c_str());
            n->v_float3   = (float)atof(GetField(body.c_str(), "fC").c_str());
            n->v_float4   = (float)atof(GetField(body.c_str(), "fD").c_str());
            n->v_min      = (float)atof(GetField(body.c_str(), "mn").c_str());
            n->v_max      = (float)atof(GetField(body.c_str(), "mx").c_str());
            n->v_speed    = (float)atof(GetField(body.c_str(), "sp").c_str());
            n->w          = (float)atof(GetField(body.c_str(), "w").c_str());
            n->h          = (float)atof(GetField(body.c_str(), "h").c_str());
            sscanf(GetField(body.c_str(), "c0").c_str(), "%f,%f,%f,%f", &n->colors[0], &n->colors[1], &n->colors[2], &n->colors[3]);
            n->fraction   = (float)atof(GetField(body.c_str(), "fr").c_str());
            n->combo_i    = atoi(GetField(body.c_str(), "ci").c_str());
            Unesc(GetField(body.c_str(), "fmt").c_str(), n->fmt, sizeof(n->fmt));
            Unesc(GetField(body.c_str(), "sc").c_str(), n->shortcut, sizeof(n->shortcut));
            n->same_line  = GetField(body.c_str(), "sl").c_str()[0] == '1';
            n->indent     = (float)atof(GetField(body.c_str(), "ind").c_str());
            // V2 fields (absent in V1 files -> GetField returns "", atof/atoi -> 0: tolerant)
            n->pos_x      = (float)atof(GetField(body.c_str(), "px").c_str());
            n->pos_y      = (float)atof(GetField(body.c_str(), "py").c_str());
            n->pos_cond   = atoi(GetField(body.c_str(), "pc").c_str());
            n->st_alpha_used = GetField(body.c_str(), "sa").c_str()[0] == '1';
            n->st_alpha   = (float)atof(GetField(body.c_str(), "sav").c_str());
            std::string cu = GetField(body.c_str(), "cU");
            if (cu.size() >= 3) { n->st_col_used[0] = cu[0]=='1'; n->st_col_used[1] = cu[1]=='1'; n->st_col_used[2] = cu[2]=='1'; }
            sscanf(GetField(body.c_str(), "cI").c_str(), "%d,%d,%d", &n->st_col_id[0], &n->st_col_id[1], &n->st_col_id[2]);
            std::string cv = GetField(body.c_str(), "cV");
            if (cv.size() >= 3)
            {
                char cbuf[256]; strncpy(cbuf, cv.c_str(), 255); cbuf[255] = 0;
                char* save = nullptr;
                for (int i = 0; i < 3; i++)
                {
                    char* tok = strtok_r(i ? nullptr : cbuf, ",", &save);
                    if (!tok) break;
                    if (strcmp(tok, "-") != 0 && strlen(tok) == 8)
                    {
                        unsigned rv = 0; sscanf(tok, "%X", &rv);
                        n->st_col_v[i][0] = ((rv >> 24) & 255) / 255.0f;
                        n->st_col_v[i][1] = ((rv >> 16) & 255) / 255.0f;
                        n->st_col_v[i][2] = ((rv >> 8) & 255) / 255.0f;
                        n->st_col_v[i][3] = (rv & 255) / 255.0f;
                    }
                }
            }
            (void)t1; (void)t2;
            return n;
        }

        Node* LoadTreeFromString(const std::string& text)
        {
            if (text.empty()) return nullptr;
            // V2 or V1 (V1 files simply lack the px/py/pc fields; loader is tolerant)
            bool v2 = text.rfind("#IMGUI_MENU_V2", 0) == 0;
            if (!v2 && text.rfind("#IMGUI_MENU_V1", 0) != 0) return nullptr;
            Node* root = nullptr;
            std::vector<Node*> stack; // stack[depth] = current open node
            const char* p = text.c_str();
            while ((p = strchr(p, '\n')) != nullptr)
            {
                p++;
                if (*p == '\0' || *p == '#') continue;
                const char* e = strchr(p, '\n');
                std::string line(p, e ? (size_t)(e - p) : strlen(p));
                if (line.find('{') == std::string::npos) continue;
                int depth = atoi(line.c_str());
                if (depth < 0 || depth > NODE_MAX_DEPTH) continue; // guard: corrupt depth
                Node* n = ParseNodeLine(line.c_str());
                if (!n) continue;
                while ((int)stack.size() > depth + 1) stack.pop_back();
                if (depth == 0 || stack.empty()) { root = n; stack.clear(); stack.push_back(n); }
                else { Node_AddChild(stack[depth - 1 < (int)stack.size() ? depth - 1 : (int)stack.size() - 1], n); stack.push_back(n); }
                if ((int)stack.size() != depth + 1) // tolerate malformed depth
                {
                    while ((int)stack.size() < depth + 1) stack.push_back(n); // pad
                    while ((int)stack.size() > depth + 1) stack.pop_back();
                    stack[depth] = n;
                }
            }
            if (root) Node_ResyncIds(root);
            return root;
        }

        IMGUIED_EOF

        mkdir -p "$(dirname 'app/src/main/cpp/editor_render.cpp')"
        cat > 'app/src/main/cpp/editor_render.cpp' <<'IMGUIED_EOF'
        // editor_render.cpp - Renders the user's node tree with REAL Dear ImGui calls,
        // and captures per-node screen rects so a touch anywhere selects that node.
        #pragma once // included once into main.cpp via #include, keep it header-clean
        #include "editor_nodes.h"
        #include <cmath>

        // Hit rect captured this frame: node id -> screen rect.
        struct HitEntry { int id; ImRect r; };
        static ImVector<HitEntry> g_hits;
        static int g_hit_selected = -1;       // set by touch tap in palette mode
        static int g_hit_hover_id = -1;       // transient

        static void HitClear() { g_hits.clear(); }
        static void HitAdd(int id, const ImVec2& a, const ImVec2& b)
        {
            if (id < 0) return;
            HitEntry e; e.id = id; e.r = ImRect(a, b);
            g_hits.push_back(e);
        }
        static void HitAddItem(int id) { HitAdd(id, ImGui::GetItemRectMin(), ImGui::GetItemRectMax()); }

        // Find node under a screen point (last/highest wins as "innermost").
        static int HitTest(int x, int y)
        {
            int found = -1;
            for (int i = 0; i < g_hits.Size; i++)
                if (g_hits[i].r.Contains(ImVec2((float)x, (float)y)))
                    found = g_hits[i].id;
            return found;
        }

        // ---------------------------------------------------------------------------
        // Style overrides: push before rendering a node's subtree, pop after.
        // ---------------------------------------------------------------------------
        struct StyleOverrideState { int colors; int vars; };
        static void PushNodeStyle(const Node* n, StyleOverrideState& st)
        {
            st.colors = 0; st.vars = 0;
            if (n->st_alpha_used)
            {
                ImGui::PushStyleVar(ImGuiStyleVar_Alpha, n->st_alpha);
                st.vars++;
            }
            for (int i = 0; i < 3; i++)
                if (n->st_col_used[i] && n->st_col_id[i] >= 0 && n->st_col_id[i] < ImGuiCol_COUNT)
                {
                    ImGui::PushStyleColor(n->st_col_id[i], ImVec4(n->st_col_v[i][0], n->st_col_v[i][1], n->st_col_v[i][2], n->st_col_v[i][3]));
                    st.colors++;
                }
        }
        static void PopNodeStyle(const StyleOverrideState& st)
        {
            if (st.colors) ImGui::PopStyleColor(st.colors);
            if (st.vars) ImGui::PopStyleVar(st.vars);
        }

        // ---------------------------------------------------------------------------
        // Split "A,B,C" csv into items.
        // ---------------------------------------------------------------------------
        static void SplitCsv(const char* s, ImVector<const char*>& out)
        {
            static char buf[512]; // single-threaded UI, ok
            strncpy(buf, s, 511); buf[511] = 0;
            char* save = nullptr;
            for (char* t = strtok_r(buf, ",", &save); t; t = strtok_r(nullptr, ",", &save))
                out.push_back(t);
        }

        // procedural data for plots
        static float PlotValue(void*, int i) { return 0.5f + 0.4f * sinf((float)i * 0.13f); }
        static float HistValue(void*, int i) { return 0.3f + 0.6f * fabsf(sinf((float)i * 0.21f)); }

        // ---------------------------------------------------------------------------
        // Render one node (and children). In edit_mode we also record hit rects and
        // show selection highlight. The rendered widgets are REAL ImGui widgets.
        // ---------------------------------------------------------------------------
        static void RenderNode(Node* n, bool edit_mode, int selected_id, int depth = 0)
        {
            if (depth > NODE_MAX_DEPTH) return; // guard: cyclic/corrupt tree
            // pre-layout: indent / same-line
            if (n->indent != 0.0f) ImGui::Indent(n->indent);
            if (n->same_line) ImGui::SameLine();

            StyleOverrideState st;
            PushNodeStyle(n, st);

            bool vis = n->visible;
            if (!vis) ImGui::BeginDisabled(true);
            bool is_sel = (edit_mode && n->id == selected_id);

            switch (n->kind)
            {
            case NWindow:
            {
                if (!vis) { /* still Begin to keep structure, disabled look */ }
                // V2: explicit position (SetNextWindowPos equivalent)
                if (n->pos_x != 0.0f || n->pos_y != 0.0f)
                    ImGui::SetNextWindowPos(ImVec2(n->pos_x, n->pos_y),
                                            (ImGuiCond)(n->pos_cond ? n->pos_cond : ImGuiCond_Once));
                ImGui::SetNextWindowSize(ImVec2(n->w > 0 ? n->w : 300, n->h > 0 ? n->h : 200), n->w > 0 ? ImGuiCond_FirstUseEver : ImGuiCond_Appearing);
                bool open = ImGui::Begin(n->name, n->p_open_flag ? &n->p_open_flag : nullptr, n->flags);
                HitAdd(n->id, ImGui::GetWindowPos(), ImVec2(ImGui::GetWindowPos().x + ImGui::GetWindowSize().x, ImGui::GetWindowPos().y + ImGui::GetWindowSize().y));
                if (open)
                {
                    for (Node* c : n->children) RenderNode(c, edit_mode, selected_id, depth + 1);
                    HitAdd(n->id, ImGui::GetWindowPos(), ImVec2(ImGui::GetWindowPos().x + ImGui::GetWindowSize().x, ImGui::GetWindowPos().y + ImGui::GetWindowSize().y)); // innermost update
                }
                ImGui::End();
                break;
            }
            case NMenuBar:
                if (ImGui::BeginMenuBar())
                {
                    HitAddItem(n->id);
                    for (Node* c : n->children) RenderNode(c, edit_mode, selected_id, depth + 1);
                    ImGui::EndMenuBar();
                }
                break;
            case NMenu:
                if (ImGui::BeginMenu(n->name, vis))
                {
                    HitAddItem(n->id);
                    for (Node* c : n->children) RenderNode(c, edit_mode, selected_id, depth + 1);
                    ImGui::EndMenu();
                }
                break;
            case NMenuItem:
                if (n->shortcut[0]) ImGui::MenuItem(n->name, n->shortcut, n->selected, vis);
                else                 ImGui::MenuItem(n->name, nullptr, n->selected, vis);
                HitAddItem(n->id);
                break;
            case NCollapsingHeader:
            {
                ImGuiTreeNodeFlags f = n->flags | (n->selected ? ImGuiTreeNodeFlags_Selected : 0);
                if (n->p_open_flag)
                    ImGui::CollapsingHeader(n->name, &n->p_open_flag, f);
                else
                    ImGui::CollapsingHeader(n->name, f);
                HitAddItem(n->id);
                if (n->open && n->p_open_flag)
                    for (Node* c : n->children) RenderNode(c, edit_mode, selected_id, depth + 1);
                break;
            }
            case NTreeNode:
            {
                ImGuiTreeNodeFlags f = n->flags | (n->selected ? ImGuiTreeNodeFlags_Selected : 0);
                bool open = ImGui::TreeNodeEx(n->name, f);
                HitAddItem(n->id);
                if (open)
                {
                    for (Node* c : n->children) RenderNode(c, edit_mode, selected_id, depth + 1);
                    ImGui::TreePop();
                }
                break;
            }
            case NTabBar:
                if (ImGui::BeginTabBar(n->name, n->flags))
                {
                    HitAddItem(n->id);
                    for (Node* c : n->children) RenderNode(c, edit_mode, selected_id, depth + 1);
                    ImGui::EndTabBar();
                }
                break;
            case NTabItem:
                if (ImGui::BeginTabItem(n->name, n->p_open_flag ? &n->p_open_flag : nullptr, n->flags))
                {
                    HitAddItem(n->id);
                    for (Node* c : n->children) RenderNode(c, edit_mode, selected_id, depth + 1);
                    ImGui::EndTabItem();
                }
                break;
            case NGroup:
                ImGui::BeginGroup();
                for (Node* c : n->children) RenderNode(c, edit_mode, selected_id, depth + 1);
                ImGui::EndGroup();
                HitAddItem(n->id);
                break;
            case NChild:
            {
                bool open = ImGui::BeginChild(n->name, ImVec2(n->w, n->h), n->flags, n->flags2);
                HitAdd(n->id, ImGui::GetWindowPos(), ImVec2(ImGui::GetWindowPos().x + ImGui::GetWindowSize().x, ImGui::GetWindowPos().y + ImGui::GetWindowSize().y));
                if (open) for (Node* c : n->children) RenderNode(c, edit_mode, selected_id, depth + 1);
                ImGui::EndChild();
                break;
            }
            case NTable:
            {
                // children: NTableRow nodes. Each TableRow's children = cells (rendered
                // as text of cell nodes, using their name or value_str).
                bool open = ImGui::BeginTable(n->name, n->v_int, n->flags,
                             ImVec2(n->w != 0 ? n->w : 0.0f, n->h != 0 ? n->h : 0.0f));
                if (open)
                {
                    HitAdd(n->id, ImGui::GetWindowPos(), ImVec2(ImGui::GetWindowPos().x + ImGui::GetWindowSize().x, ImGui::GetWindowPos().y + ImGui::GetWindowSize().y));
                    int col = 0;
                    for (Node* row : n->children)
                    {
                        ImGui::TableNextRow(ImGuiTableRowFlags_None);
                        HitAddItem(row->id);
                        col = 0;
                        for (Node* cell : row->children)
                        {
                            ImGui::TableSetColumnIndex(col % ImMax(n->v_int, 1));
                            ImGui::TextUnformatted(cell->name[0] ? cell->name : (cell->value_str[0] ? cell->value_str : " "));
                            HitAddItem(cell->id);
                            col++;
                        }
                    }
                    ImGui::EndTable();
                }
                break;
            }
            case NText:        ImGui::TextUnformatted(n->value_str); HitAddItem(n->id); break;
            case NTextWrapped: ImGui::TextWrapped("%s", n->value_str); HitAddItem(n->id); break;
            case NTextDisabled: ImGui::TextDisabled("%s", n->value_str); HitAddItem(n->id); break;
            case NSeparator:   ImGui::Separator(); HitAddItem(n->id); break;
            case NSeparatorText: ImGui::SeparatorText(n->name); HitAddItem(n->id); break;
            case NBulletText: ImGui::BulletText("%s", n->value_str); HitAddItem(n->id); break;
            case NButton:     ImGui::Button(n->name, ImVec2(n->w, n->h)); HitAddItem(n->id); break;
            case NSmallButton: ImGui::SmallButton(n->name); HitAddItem(n->id); break;
            case NArrowButton: ImGui::ArrowButton(n->name, (ImGuiDir)n->arrow_dir); HitAddItem(n->id); break;
            case NCheckbox:   { bool b = n->v_int != 0; ImGui::Checkbox(n->name, &b); n->v_int = b ? 1 : 0; HitAddItem(n->id); } break;
            case NCheckboxFlags: { int f = n->flags; ImGui::CheckboxFlags(n->name, &f, 1); n->flags = f; HitAddItem(n->id); } break;
            case NRadioButton:
            {
                bool on = (n->v_int == n->combo_i);
                ImGui::RadioButton(n->name, &on); if (on != (n->v_int == n->combo_i)) {}
                if (on) n->v_int = n->combo_i;
                HitAddItem(n->id);
                break;
            }
            case NCombo:
            {
                ImVector<const char*> items; SplitCsv(n->value_str, items);
                const char* preview = items.Size ? items[ImClamp(n->combo_i, 0, items.Size - 1)] : "";
                if (ImGui::BeginCombo(n->name, preview, n->flags))
                {
                    HitAddItem(n->id);
                    for (int i = 0; i < items.Size; i++)
                        if (ImGui::Selectable(items[i], n->combo_i == i))
                            n->combo_i = i;
                    ImGui::EndCombo();
                }
                else HitAddItem(n->id);
                break;
            }
            case NListBox:
            {
                ImVector<const char*> items; SplitCsv(n->value_str, items);
                if (ImGui::BeginListBox(n->name, ImVec2(n->w, n->h)))
                {
                    for (int i = 0; i < items.Size; i++)
                        if (ImGui::Selectable(items[i], n->combo_i == i))
                            n->combo_i = i;
                    ImGui::EndListBox();
                }
                HitAddItem(n->id);
                break;
            }
            case NInputText:
            {
                static char live[64]; strncpy(live, n->value_str, 63); live[63] = 0;
                if (ImGui::InputText(n->name, live, sizeof(live), n->flags))
                    strncpy(n->value_str, live, 63);
                HitAddItem(n->id);
                break;
            }
            case NInputTextMultiline:
            {
                static char live[256]; strncpy(live, n->value_str, 255); live[255] = 0;
                if (ImGui::InputTextMultiline(n->name, live, sizeof(live), ImVec2(n->w, n->h), n->flags))
                    strncpy(n->value_str, live, 63);
                HitAddItem(n->id);
                break;
            }
            case NInputInt:
            {
                int v = n->v_int;
                ImGui::InputInt(n->name, &v, n->v_int2 ? n->v_int2 : 1, 100, n->flags);
                n->v_int = v;
                HitAddItem(n->id);
                break;
            }
            case NInputFloat:
            {
                float v = n->v_float;
                ImGui::InputFloat(n->name, &v, n->v_speed, 0.0f, n->fmt[0] ? n->fmt : "%.3f", n->flags);
                n->v_float = v;
                HitAddItem(n->id);
                break;
            }
            case NDragInt:
            {
                int v = n->v_int;
                ImGui::DragInt(n->name, &v, n->v_speed, (int)n->v_min, (int)n->v_max, n->fmt[0] ? n->fmt : "%d", n->flags);
                n->v_int = v;
                HitAddItem(n->id);
                break;
            }
            case NDragFloat:
            {
                float v = n->v_float;
                ImGui::DragFloat(n->name, &v, n->v_speed, n->v_min, n->v_max, n->fmt[0] ? n->fmt : "%.3f", n->flags);
                n->v_float = v;
                HitAddItem(n->id);
                break;
            }
            case NSliderInt:
            {
                int v = n->v_int;
                ImGui::SliderInt(n->name, &v, (int)n->v_min, (int)n->v_max, n->fmt[0] ? n->fmt : "%d", n->flags);
                n->v_int = v;
                HitAddItem(n->id);
                break;
            }
            case NSliderFloat:
            {
                float v = n->v_float;
                ImGui::SliderFloat(n->name, &v, n->v_min, n->v_max, n->fmt[0] ? n->fmt : "%.3f", n->flags);
                n->v_float = v;
                HitAddItem(n->id);
                break;
            }
            case NColorEdit3: ImGui::ColorEdit3(n->name, n->colors, (ImGuiColorEditFlags)n->flags); HitAddItem(n->id); break;
            case NColorEdit4: ImGui::ColorEdit4(n->name, n->colors, (ImGuiColorEditFlags)n->flags); HitAddItem(n->id); break;
            case NProgressBar: ImGui::ProgressBar(n->fraction, ImVec2(n->w, n->h), n->value_str[0] ? n->value_str : nullptr); HitAddItem(n->id); break;
            case NPlotLines:
                ImGui::PlotLines(n->name, PlotValue, nullptr, n->v_int, 0, n->value_str[0] ? n->value_str : nullptr,
                                 n->v_min, n->v_max, ImVec2(n->w, n->h));
                HitAddItem(n->id); break;
            case NPlotHistogram:
                ImGui::PlotHistogram(n->name, HistValue, nullptr, n->v_int, 0, n->value_str[0] ? n->value_str : nullptr,
                                     n->v_min, n->v_max, ImVec2(n->w, n->h));
                HitAddItem(n->id); break;
            case NImage:
                // placeholder textured quad via the standard Image() call on the font atlas tex
                ImGui::Image(ImGui::GetIO().Fonts->TexID, ImVec2(n->w, n->h),
                             ImVec2(0, 0), ImVec2(0.25f, 0.25f),
                             ImVec4(n->colors[0], n->colors[1], n->colors[2], n->colors[3]),
                             ImVec4(0, 0, 0, 0));
                HitAddItem(n->id);
                break;
            case NSelectable:
                ImGui::Selectable(n->name, n->selected, n->flags, ImVec2(n->w, n->h));
                HitAddItem(n->id);
                break;
            case NTooltip:
                if (ImGui::IsItemHovered() || edit_mode)
                {
                    if (ImGui::BeginTooltip())
                    {
                        ImGui::TextUnformatted(n->value_str[0] ? n->value_str : n->name);
                        HitAddItem(n->id);
                        ImGui::EndTooltip();
                    }
                }
                break;
            case NPopupModal:
                if (n->open)
                {
                    ImGui::SetNextWindowSize(ImVec2(n->w > 0 ? n->w : 300, n->h > 0 ? n->h : 150), ImGuiCond_Appearing);
                    if (ImGui::BeginPopupModal(n->name, n->p_open_flag ? &n->p_open_flag : nullptr, n->flags))
                    {
                        HitAdd(n->id, ImGui::GetWindowPos(), ImVec2(ImGui::GetWindowPos().x + ImGui::GetWindowSize().x, ImGui::GetWindowPos().y + ImGui::GetWindowSize().y));
                        for (Node* c : n->children) RenderNode(c, edit_mode, selected_id, depth + 1);
                        ImGui::EndPopup();
                    }
                }
                break;
            default: break;
            }

            if (!vis) ImGui::EndDisabled();
            PopNodeStyle(st);

            if (n->indent != 0.0f) ImGui::Unindent(n->indent);

            // selection highlight ring drawn AFTER item (fg drawlist over everything)
            if (is_sel)
            {
                for (int i = 0; i < g_hits.Size; i++)
                    if (g_hits[i].id == n->id)
                    {
                        ImGui::GetForegroundDrawList()->AddRect(ImVec2(g_hits[i].r.Min.x - 3, g_hits[i].r.Min.y - 3), ImVec2(g_hits[i].r.Max.x + 3, g_hits[i].r.Max.y + 3),
                                                                IM_COL32(255, 180, 0, 220), 4.0f, 0, 3.0f);
                    }
            }
        }

        IMGUIED_EOF

        mkdir -p "$(dirname 'app/src/main/cpp/editor_chrome.cpp')"
        cat > 'app/src/main/cpp/editor_chrome.cpp' <<'IMGUIED_EOF'
        // editor_chrome.cpp - The editor UI itself: tree + drawers + boxes + d-pad + lock.
        // Runs in edit mode only. All panels are real Dear ImGui windows.
        #pragma once
        #include "editor_nodes.h"

        // Forward decls (defined in main.cpp AFTER all modules are included):
        void PickImportFolder();          // opens the SAF folder picker via Kotlin
        void ImportReportClear();         // defined in editor_import.cpp
        int  ImportReportScanned();
        int  ImportReportNodes();
        int  ImportReportFilesWithImgui();
        int  ImportReportNonImguiCount();
        const char* ImportReportNonImguiLine(int i);

        // ---------------------------------------------------------------------------
        // Editor context shared across chrome + render.
        // ---------------------------------------------------------------------------
        struct EditorState
        {
            Node*   root = nullptr;         // document root (a Window node)
            int     sel = -1;               // selected node id
            bool    edit_mode = true;       // false = locked/fullscreen preview
            bool    show_demo_test = false; // demo window under lock for testing
            bool    palette_fullscreen = false;
            bool    show_tree = true, show_props = true;
            char    load_buf[64] = "";
            // d-pad navigation scratch
            Node* SelNode() { return Node_FindById(root, sel); }
        };

        static EditorState g_ed;
        static const char* GetSelPath(Node* n) { static char p[256]; p[0]=0;
            // build "Root/Child/Sub" path of node
            const Node* c = n; int i = 254;
            char tmp[256]; tmp[255]=0;
            while (c) {
                const char* lab = (c->kind==NText||c->kind==NTextWrapped||c->kind==NBulletText||c->kind==NTextDisabled) ? c->value_str : c->name;
                int L = (int)strlen(lab); if (L > 60) L = 60;
                if (i - L - 1 < 0) break;
                if (c != n) { tmp[i--] = '/'; }
                // we build backwards
                i -= L; for (int j = 0; j < L; j++) tmp[i + 1 + j] = lab[j];
                c = c->parent;
            }
            snprintf(p, 256, "%s", tmp + i + 1);
            return p; }

        // ---------------------------------------------------------------------------
        // Add-new palette (left drawer): all node kinds grouped by category.
        // ---------------------------------------------------------------------------
        static const char* const KindCategories[] = {
            "Windows & Layout", "Containers", "Text & Display", "Buttons", "Toggles",
            "Inputs", "Numeric", "Colors & Plots", "Advanced"
        };
        static const int KindCategoryMap[][2] = {
            {0, NWindow}, {0, NChild}, {0, NGroup},
            {1, NMenuBar}, {1, NMenu}, {1, NMenuItem}, {1, NCollapsingHeader}, {1, NTreeNode},
            {1, NTabBar}, {1, NTabItem},
            {2, NText}, {2, NTextWrapped}, {2, NTextDisabled}, {2, NSeparator}, {2, NSeparatorText}, {2, NBulletText},
            {3, NButton}, {3, NSmallButton}, {3, NArrowButton},
            {4, NCheckbox}, {4, NCheckboxFlags}, {4, NRadioButton}, {4, NSelectable},
            {4, NCombo}, {4, NListBox},
            {5, NInputText}, {5, NInputTextMultiline},
            {6, NInputInt}, {6, NInputFloat}, {6, NDragInt}, {6, NDragFloat},
            {6, NSliderInt}, {6, NSliderFloat}, {6, NProgressBar},
            {7, NColorEdit3}, {7, NColorEdit4}, {7, NPlotLines}, {7, NPlotHistogram}, {7, NImage},
            {8, NTable}, {8, NTableRow}, {8, NTooltip}, {8, NPopupModal},
        };

        static void AddNodeButton(int kind, int target_parent_id)
        {
            Node* p = Node_FindById(g_ed.root, target_parent_id);
            if (!p || !NodeAcceptsChildren(p->kind)) { ImGui::TextDisabled("(select a container)"); return; }
            Node* n = Node_New(kind);
            Node_AddChild(p, n);
            g_ed.sel = n->id;
        }

        static void DrawAddPalette()
        {
            ImGui::SetNextWindowPos(ImVec2(0, 60));
            ImGui::SetNextWindowSize(ImVec2(200, -1), ImGuiCond_Appearing);
            ImGui::Begin("Add", nullptr, ImGuiWindowFlags_NoTitleBar | ImGuiWindowFlags_NoResize | ImGuiWindowFlags_NoMove | ImGuiWindowFlags_NoCollapse | ImGuiWindowFlags_NoSavedSettings);
            ImGui::TextUnformatted("ADD ITEM");
            ImGui::Separator();
            Node* sel = g_ed.SelNode();
            if (!sel) ImGui::TextDisabled("no selection");
            int pid = (sel && NodeAcceptsChildren(sel->kind)) ? sel->id : (g_ed.root ? g_ed.root->id : -1);
            char lbl[64];
            for (int c = 0; c < 9; c++)
            {
                if (!ImGui::CollapsingHeader(KindCategories[c])) continue;
                for (auto& m : KindCategoryMap)
                {
                    if (m[0] != c) continue;
                    snprintf(lbl, sizeof(lbl), "+ %s", NodeKindName(m[1]));
                    if (ImGui::SmallButton(lbl)) AddNodeButton(m[1], pid);
                    ImGui::SameLine();
                }
                ImGui::NewLine();
            }
            ImGui::End();
        }

        // ---------------------------------------------------------------------------
        // Tree view (left drawer, below add palette).
        // ---------------------------------------------------------------------------
        static void TreeRow(Node* n, int depth = 0)
        {
            if (depth > NODE_MAX_DEPTH) return; // guard: cyclic/corrupt tree
            ImGuiTreeNodeFlags fl = ImGuiTreeNodeFlags_OpenOnArrow | ImGuiTreeNodeFlags_SpanFullWidth;
            if (n->children.empty()) fl |= ImGuiTreeNodeFlags_Leaf;
            if (n->id == g_ed.sel) fl |= ImGuiTreeNodeFlags_Selected;
            if (n->palette_open) fl |= ImGuiTreeNodeFlags_DefaultOpen;
            bool open = ImGui::TreeNodeEx(Node_ShortLabel(n), fl);
            if (ImGui::IsItemClicked() && !ImGui::IsItemToggledOpen())
                g_ed.sel = n->id;
            if (open)
            {
                for (Node* c : n->children) TreeRow(c, depth + 1);
                ImGui::TreePop();
            }
        }

        static void DrawTree()
        {
            ImGui::SetNextWindowPos(ImVec2(0, 0), ImGuiCond_Appearing);
            ImGui::SetNextWindowSize(ImVec2(200, 60), ImGuiCond_Appearing);
            ImGui::Begin("Tree", nullptr, ImGuiWindowFlags_NoMove | ImGuiWindowFlags_NoCollapse | ImGuiWindowFlags_NoSavedSettings);
            if (!g_ed.root) { ImGui::TextDisabled("(empty)"); }
            else TreeRow(g_ed.root);
            ImGui::End();
        }

        // ---------------------------------------------------------------------------
        // Node properties (right drawer): every option per kind.
        // ---------------------------------------------------------------------------
        static void FlagCheckboxes(int* flags, const FlagDef* defs, int n)
        {
            for (int i = 0; i < n; i++)
            {
                int v = ((*flags) & defs[i].value) ? 1 : 0;
                if (ImGui::CheckboxFlags(defs[i].name, flags, defs[i].value)) {}
            }
        }

        static void DrawNodeProps(Node* n)
        {
            if (!n) { ImGui::TextDisabled("select an item"); return; }
            char t[80];
            snprintf(t, sizeof(t), "%s  #%d", NodeKindName(n->kind), n->id);
            if (ImGui::CollapsingHeader(t, ImGuiTreeNodeFlags_DefaultOpen))
            {
                ImGui::InputText("name", n->name, sizeof(n->name));
                if (n->kind == NText || n->kind == NTextWrapped || n->kind == NTextDisabled ||
                    n->kind == NBulletText || n->kind == NCombo || n->kind == NListBox || n->kind == NInputText ||
                    n->kind == NInputTextMultiline || n->kind == NProgressBar || n->kind == NTooltip ||
                    n->kind == NPlotLines || n->kind == NPlotHistogram)
                    ImGui::InputText("value", n->value_str, sizeof(n->value_str));
                if (n->kind == NMenuItem)
                    ImGui::InputText("shortcut", n->shortcut, sizeof(n->shortcut));
                ImGui::Checkbox("visible/enabled", &n->visible);
                ImGui::Checkbox("selected", &n->selected);
                if (NodeIsContainerish(n->kind) || n->kind == NTabItem)
                    ImGui::Checkbox("open", &n->p_open_flag);
                ImGui::DragFloat("indent", &n->indent, 0.5f, 0, 400);
                ImGui::Checkbox("same line", &n->same_line);
            }

            // Kind-specific numeric options
            if (ImGui::CollapsingHeader("Options"))
            {
                switch (n->kind)
                {
                case NArrowButton:
                    ImGui::RadioButton("Left", &n->arrow_dir, 0); ImGui::SameLine();
                    ImGui::RadioButton("Right", &n->arrow_dir, 1); ImGui::SameLine();
                    ImGui::RadioButton("Up", &n->arrow_dir, 2); ImGui::SameLine();
                    ImGui::RadioButton("Down", &n->arrow_dir, 3);
                    break;
                case NInputInt:
                    ImGui::InputInt("step", &n->v_int2, 1, 100);
                    break;
                case NInputFloat: case NDragInt: case NDragFloat: case NSliderInt: case NSliderFloat:
                    ImGui::DragFloat("speed", &n->v_speed, 0.01f, 0, 100);
                    break;
                case NCombo: case NListBox: case NRadioButton:
                    ImGui::SliderInt("sel index", &n->combo_i, 0, 12);
                    break;
                case NTable:
                    ImGui::SliderInt("columns", &n->v_int, 1, 8);
                    break;
                case NProgressBar:
                    ImGui::SliderFloat("fraction", &n->fraction, 0, 1);
                    break;
                case NPlotLines: case NPlotHistogram:
                    ImGui::SliderInt("values", &n->v_int, 1, 200);
                    break;
                case NInputText: case NInputTextMultiline:
                    // buffer size fixed; note only
                    ImGui::TextDisabled("buffer: 64/256 chars");
                    break;
                default:
                    ImGui::TextDisabled("(no numeric options)");
                    break;
                }
                ImGui::DragFloat("w", &n->w, 1, -600, 2000);
                ImGui::DragFloat("h", &n->h, 1, -600, 2000);
            }

            // Ranges for numeric widgets
            if (n->kind == NSliderInt || n->kind == NSliderFloat || n->kind == NDragInt || n->kind == NDragFloat ||
                n->kind == NInputInt || n->kind == NInputFloat)
            {
                if (ImGui::CollapsingHeader("Range & Format"))
                {
                    ImGui::DragFloat("min", &n->v_min, 0.5f, -100000, 100000);
                    ImGui::DragFloat("max", &n->v_max, 0.5f, -100000, 100000);
                    ImGui::InputText("format", n->fmt, sizeof(n->fmt));
                }
            }

            // Flags for this kind
            int fn = 0; const FlagDef* fd = FlagTableFor(n->kind, fn);
            if (fd && fn > 0)
            {
                if (ImGui::CollapsingHeader("Flags"))
                    FlagCheckboxes(&n->flags, fd, fn);
            }

            // Colors edit for ColorEdit nodes + preview colors
            if (n->kind == NColorEdit3 || n->kind == NColorEdit4)
            {
                if (ImGui::CollapsingHeader("Color value", ImGuiTreeNodeFlags_DefaultOpen))
                {
                    if (n->kind == NColorEdit3) ImGui::ColorEdit3("##v", n->colors, (ImGuiColorEditFlags)n->flags);
                    else ImGui::ColorEdit4("##v", n->colors, (ImGuiColorEditFlags)n->flags);
                }
            }

            // Style overrides (alpha + 3 color slots)
            if (ImGui::CollapsingHeader("Style Overrides"))
            {
                ImGui::Checkbox("use alpha", &n->st_alpha_used);
                if (n->st_alpha_used) ImGui::SliderFloat("alpha", &n->st_alpha, 0, 1);
                for (int i = 0; i < 3; i++)
                {
                    char lid[32]; snprintf(lid, sizeof(lid), "slot %d", i);
                    ImGui::Checkbox(lid, &n->st_col_used[i]);
                    if (n->st_col_used[i])
                    {
                        if (n->st_col_id[i] < 0) n->st_col_id[i] = 0;
                        if (n->st_col_id[i] >= StyleColCount()) n->st_col_id[i] = 0;
                        ImGui::PushID(i);
                        ImGui::Combo("color", &n->st_col_id[i], [](void* data, int idx, const char** out) {
                            *out = StyleColName(idx); return true; }, nullptr, StyleColCount());
                        ImGui::ColorEdit4("override", n->st_col_v[i]);
                        ImGui::PopID();
                    }
                }
            }

            // Node actions
            if (ImGui::CollapsingHeader("Actions"))
            {
                if (ImGui::Button("Duplicate")) { if (n->parent) { Node* c = Node_Clone(n, n->parent); Node_AddChild(n->parent, c, Node_IndexInParent(n) + 1); g_ed.sel = c->id; } }
                ImGui::SameLine();
                if (ImGui::Button("Delete")) { if (n->parent) { Node_RemoveFromParent(n); Node_Delete(n); g_ed.sel = -1; } }
                if (n->parent && ImGui::Button("Move Up")) { int i = Node_IndexInParent(n); if (i > 0) { n->parent->children[i] = n->parent->children[i-1]; n->parent->children[i-1] = n; } }
                ImGui::SameLine();
                if (n->parent && ImGui::Button("Move Down")) { int i = Node_IndexInParent(n); if (i < (int)n->parent->children.size()-1) { n->parent->children[i] = n->parent->children[i+1]; n->parent->children[i+1] = n; } }
            }
        }

