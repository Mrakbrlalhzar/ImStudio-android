        mkdir -p "$(dirname 'app/src/main/cpp/editor_crashlog.h')"
        cat > 'app/src/main/cpp/editor_crashlog.h' <<'IMGUIED_EOF'
        // editor_crashlog.h - Native crash logger for the ImGui menu editor.
        // A SIGSEGV/SIGBUS/SIGFPE/SIGILL/SIGABRT handler writes a report (signal,
        // fault address, registers, frame-pointer backtrace, recent breadcrumbs and
        // the tail of /proc/self/maps) to <internalDataPath>/crash_native.log through
        // a pre-opened fd, then re-raises the signal for normal system handling.
        // The Kotlin side (MainActivity) copies that file into the PUBLIC Downloads
        // folder on every next launch, so no adb/root is needed to read it.
        // Uses only pre-opened fds + write/read/lseek/memmove (no malloc, no locks);
        // snprintf is not strictly async-signal-safe but allocates nothing on
        // bionic/glibc for these format strings (same trade-off minimal handlers make).
        #ifndef IMGUIED_CRASHLOG_H
        #define IMGUIED_CRASHLOG_H

        #include <signal.h>
        #include <fcntl.h>
        #include <unistd.h>
        #include <string.h>
        #include <stdio.h>
        #include <stdarg.h>
        #include <sys/ucontext.h>
        #include <sys/syscall.h>

        #define CRASHLOG_MAX_CRUMBS 48
        #define CRASHLOG_CRUMB_BUF  96
        #define NODE_MAX_DEPTH      64 // shared tree-depth cap (guards every recursion)

        struct ImGuiEdCrashLog {
            int          fd;         // pre-opened append fd for crash_native.log
            int          maps_fd;    // pre-opened /proc/self/maps (re-read on crash)
            volatile int seq;        // breadcrumb sequence counter
            char         crumbs[CRASHLOG_MAX_CRUMBS][CRASHLOG_CRUMB_BUF];
            int          seqs[CRASHLOG_MAX_CRUMBS];
        };
        static ImGuiEdCrashLog g_crashlog = { -1, -1, 0, { { 0 } }, { 0 } };

        // ---- write helpers (write(2) is async-signal-safe) ----
        static void ImGuiEdCrashWrite(const char* s)
        {
            if (g_crashlog.fd >= 0) { ssize_t r = write(g_crashlog.fd, s, strlen(s)); (void)r; }
        }

        // ---- breadcrumbs: fixed ring buffer, no allocation ----
        static void ImGuiEdCrumb(const char* fmt, ...)
        {
            if (g_crashlog.fd < 0) return;
            char buf[CRASHLOG_CRUMB_BUF];
            va_list ap; va_start(ap, fmt);
            vsnprintf(buf, sizeof(buf), fmt, ap);
            va_end(ap);
            int s = __sync_fetch_and_add(&g_crashlog.seq, 1);
            int i = s % CRASHLOG_MAX_CRUMBS;
            memcpy(g_crashlog.crumbs[i], buf, CRASHLOG_CRUMB_BUF);
            g_crashlog.seqs[i] = s;
        }

        // ---- the handler ----
        static void ImGuiEdCrashSignalHandler(int sig, siginfo_t* si, void* uctx_v)
        {
            char buf[1024];
            const char* nm = sig == SIGSEGV ? "SIGSEGV" : sig == SIGBUS ? "SIGBUS" :
                             sig == SIGFPE ? "SIGFPE"  : sig == SIGILL ? "SIGILL" :
                             sig == SIGABRT ? "SIGABRT" : "?";
            snprintf(buf, sizeof(buf),
                     "\n==== NATIVE CRASH ====\nsignal: %d (%s) si_code=%d\n"
                     "fault address: %p\ntid: %d\n",
                     sig, nm, si ? si->si_code : 0, si ? si->si_addr : (void*)0,
                     (int)syscall(SYS_gettid));
            ImGuiEdCrashWrite(buf);

            ucontext_t* uc = (ucontext_t*)uctx_v;
            void* fp = nullptr;
            if (uc) {
                // Registers (per-ABI) + the frame pointer for the backtrace walk.
        #if defined(__aarch64__)
                int off = 0;
                char r[900];
                for (int i = 0; i <= 28; i += 4)
                    off += snprintf(r + off, (int)sizeof(r) - off, "x%d=%016llx x%d=%016llx ",
                                    i,   (unsigned long long)uc->uc_mcontext.regs[i],
                                    i+2, (unsigned long long)uc->uc_mcontext.regs[i+2]);
                off += snprintf(r + off, (int)sizeof(r) - off, "sp=%016llx pc=%016llx",
                                (unsigned long long)uc->uc_mcontext.sp,
                                (unsigned long long)uc->uc_mcontext.pc);
                ImGuiEdCrashWrite(r); ImGuiEdCrashWrite("\n");
                fp = (void*)uc->uc_mcontext.regs[29];
        #elif defined(__arm__)
                snprintf(buf, sizeof(buf),
                         "pc=%08x sp=%08x lr=%08x fp=%08x r0=%08x r1=%08x r2=%08x r3=%08x\n",
                         (unsigned)uc->uc_mcontext.arm_pc, (unsigned)uc->uc_mcontext.arm_sp,
                         (unsigned)uc->uc_mcontext.arm_lr, (unsigned)uc->uc_mcontext.arm_fp,
                         (unsigned)uc->uc_mcontext.arm_r0, (unsigned)uc->uc_mcontext.arm_r1,
                         (unsigned)uc->uc_mcontext.arm_r2, (unsigned)uc->uc_mcontext.arm_r3);
                ImGuiEdCrashWrite(buf);
                fp = (void*)uc->uc_mcontext.arm_fp;
        #elif defined(__x86_64__)
                snprintf(buf, sizeof(buf),
                         "rip=%016llx rsp=%016llx rbp=%016llx rax=%016llx rbx=%016llx\n",
                         (unsigned long long)uc->uc_mcontext.gregs[REG_RIP],
                         (unsigned long long)uc->uc_mcontext.gregs[REG_RSP],
                         (unsigned long long)uc->uc_mcontext.gregs[REG_RBP],
                         (unsigned long long)uc->uc_mcontext.gregs[REG_RAX],
                         (unsigned long long)uc->uc_mcontext.gregs[REG_RBX]);
                ImGuiEdCrashWrite(buf);
                fp = (void*)uc->uc_mcontext.gregs[REG_RBP];
        #elif defined(__i386__)
                snprintf(buf, sizeof(buf),
                         "eip=%08x esp=%08x ebp=%08x eax=%08x ebx=%08x\n",
                         (unsigned)uc->uc_mcontext.gregs[REG_EIP], (unsigned)uc->uc_mcontext.gregs[REG_ESP],
                         (unsigned)uc->uc_mcontext.gregs[REG_EBP], (unsigned)uc->uc_mcontext.gregs[REG_EAX],
                         (unsigned)uc->uc_mcontext.gregs[REG_EBX]);
                ImGuiEdCrashWrite(buf);
                fp = (void*)uc->uc_mcontext.gregs[REG_EBP];
        #else
                ImGuiEdCrashWrite("(registers: unsupported ABI)\n");
        #endif
            }

            // Frame-pointer chain backtrace (best effort; bounded and range-checked).
            ImGuiEdCrashWrite("backtrace (frame-pointer chain):\n");
            for (int i = 0; i < 24 && fp; i++) {
                unsigned long a = (unsigned long)fp;
                if (a < 0x1000 || (a & 7) != 0 || a > 0x7ffffffffffful) break;
                void** f = (void**)fp;
                void* ret = f[1];
                snprintf(buf, sizeof(buf), "  #%02d pc %p\n", i, ret);
                ImGuiEdCrashWrite(buf);
                fp = f[0];
            }

            // Breadcrumbs, oldest first.
            ImGuiEdCrashWrite("breadcrumbs (oldest first):\n");
            int total = g_crashlog.seq;
            for (int k = total - CRASHLOG_MAX_CRUMBS; k < total; k++) {
                if (k < 0) continue;
                int i = k % CRASHLOG_MAX_CRUMBS;
                if (g_crashlog.seqs[i] != k) continue; // slot in flight / overwritten
                snprintf(buf, sizeof(buf), "  %s\n", g_crashlog.crumbs[i]);
                ImGuiEdCrashWrite(buf);
            }

            // Keep the last 8 KB of /proc/self/maps (covers the faulting library).
            if (g_crashlog.maps_fd >= 0) {
                lseek(g_crashlog.maps_fd, 0, SEEK_SET);
                ImGuiEdCrashWrite("maps tail:\n");
                static char win[8192], tmp[8192]; // static: no stack blowup, no alloc
                size_t keep = 0; ssize_t r;
                while ((r = read(g_crashlog.maps_fd, tmp, sizeof(tmp))) > 0) {
                    size_t take = (size_t)r;
                    if (take >= sizeof(win)) { // keep only the last 8 KB of this chunk
                        memcpy(win, tmp + take - sizeof(win), sizeof(win)); keep = sizeof(win);
                    } else {
                        size_t room = sizeof(win) - keep;
                        if (take > room) { size_t drop = take - room; memmove(win, win + drop, keep - drop); keep -= drop; }
                        memcpy(win + keep, tmp, take); keep += take;
                    }
                }
                if (g_crashlog.fd >= 0) { ssize_t w = write(g_crashlog.fd, win, keep); (void)w; }
            }

            ImGuiEdCrashWrite("==== END CRASH ====\n");

            // Restore default disposition and re-raise so the system's normal crash
            // handling (tombstone / force-close dialog) still runs.
            signal(sig, SIG_DFL);
            raise(sig);
        }

        // ---- init ----
        static char g_crashlog_altstack[64 * 1024]; // dedicated stack: stack-overflow
                                                    // SIGSEGVs can still be logged
        static void ImGuiEdCrashLogInit(const char* internal_data_dir)
        {
            char path[512];
            snprintf(path, sizeof(path), "%s/crash_native.log", internal_data_dir);
            g_crashlog.fd = open(path, O_WRONLY | O_CREAT | O_APPEND, 0600);
            g_crashlog.maps_fd = open("/proc/self/maps", O_RDONLY);

            stack_t ss; memset(&ss, 0, sizeof(ss));
            ss.ss_sp = g_crashlog_altstack;
            ss.ss_size = sizeof(g_crashlog_altstack);
            ss.ss_flags = 0;
            sigaltstack(&ss, nullptr);

            struct sigaction sa; memset(&sa, 0, sizeof(sa));
            sa.sa_sigaction = ImGuiEdCrashSignalHandler;
            sa.sa_flags = SA_SIGINFO | SA_ONSTACK;
            sigemptyset(&sa.sa_mask);
            const int sigs[5] = { SIGSEGV, SIGBUS, SIGFPE, SIGILL, SIGABRT };
            for (int i = 0; i < 5; i++) sigaction(sigs[i], &sa, nullptr);

            ImGuiEdCrashWrite("\n==== SESSION START ====\n");
            ImGuiEdCrumb("crash log armed");
        }

        #endif // IMGUIED_CRASHLOG_H

