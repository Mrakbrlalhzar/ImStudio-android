        // ---------------------------------------------------------------------------
        // Photoshop chrome entry point: toolbar + docks + d-pad + lock
        // ---------------------------------------------------------------------------
        static void DrawPsChrome()
        {
            ImGuiIO& io = ImGui::GetIO();
            float dt = io.DeltaTime;
            AnimDock(g_dockPalette,    g_dockPalette.want    && g_ed.edit_mode, dt);
            AnimDock(g_dockInspector,  g_dockInspector.want && g_ed.edit_mode, dt);
            AnimDock(g_dockConsole,    g_dockConsole.want   && g_ed.edit_mode, dt);

            DrawPsToolbar();
            DrawPaletteDock();
            DrawInspectorDock();
            DrawConsoleDock();
            if (g_ed.edit_mode) DrawBottomBox();
            DrawLockButton();
        }

