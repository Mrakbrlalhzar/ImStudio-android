name: ImStudio Android — Sync & Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write

jobs:
  sync-generate-build:
    runs-on: ubuntu-latest
    steps:
    # ============================================================
    # 1. Checkout + clone upstream
    # ============================================================
    - name: Checkout target repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Clone upstream ImStudio (read-only reference)
      run: |
        git clone --depth 1 https://github.com/Raais/ImStudio /tmp/ImStudio
        UPSTREAM_SHA=$(cd /tmp/ImStudio && git rev-parse --short HEAD)
        echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
        echo "Syncing from upstream commit $UPSTREAM_SHA"
        echo "→ Available sources:"
        ls -1 /tmp/ImStudio/src/sources/ | head -40

    - name: Prepare helper
      run: |
        cat > /tmp/write_if_missing <<'HELPER_EOF'
        #!/bin/bash
        path="$1"
        if [ ! -f "$path" ]; then
            mkdir -p "$(dirname "$path")"
            cat > "$path"
            echo "  + wrote $path"
        else
            cat > /dev/null
        fi
        HELPER_EOF
        chmod +x /tmp/write_if_missing
        echo "/tmp" >> $GITHUB_PATH

    # ============================================================
    # 2. Copy vendor (always overwrite)
    # ============================================================
    - name: Copy upstream vendor sources
      run: |
        VD=android/app/src/main/cpp/vendor
        mkdir -p $VD/imstudio $VD/imgui $VD/fmt

        echo "→ Copying imstudio core..."
        for f in ims_generator.cpp ims_generator.h ims_buffer.cpp ims_buffer.h \
                 ims_object.h ims_object.cpp ims_object_draw.cpp; do
            if [ -f /tmp/ImStudio/src/sources/$f ]; then
                cp -f /tmp/ImStudio/src/sources/$f $VD/imstudio/
                echo "  + $f"
            fi
        done
        for f in ims_utils.cpp ims_utils.h; do
            if [ -f /tmp/ImStudio/src/utils/$f ]; then
                cp -f /tmp/ImStudio/src/utils/$f $VD/imstudio/
            fi
        done

        echo "→ Copying ImGui core (incl. demo & stdlib)..."
        cp -f /tmp/ImStudio/src/third-party/imgui/imgui*.cpp     $VD/imgui/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/imgui*.h       $VD/imgui/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/imconfig.h     $VD/imgui/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/imstb_*.h      $VD/imgui/ 2>/dev/null || true
        mkdir -p $VD/imgui/misc/cpp
        cp -f /tmp/ImStudio/src/third-party/imgui/misc/cpp/imgui_stdlib.h   $VD/imgui/misc/cpp/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/misc/cpp/imgui_stdlib.cpp $VD/imgui/misc/cpp/ 2>/dev/null || true

        echo "→ Copying fmt (header-only)..."
        if [ -d /tmp/ImStudio/src/third-party/fmt/include/fmt ]; then
            mkdir -p $VD/fmt/include/fmt
            cp -f /tmp/ImStudio/src/third-party/fmt/include/fmt/*.h $VD/fmt/include/fmt/
        fi

        echo "$UPSTREAM_SHA" > .upstream-commit

    # ============================================================
    # 3. C++ bridge — full lifecycle management, safe init, logging
    # ============================================================
    - name: Generate C++ bridge sources (with full lifecycle + safety)
      run: |
        write_if_missing android/app/src/main/cpp/include/jni_bridge.h <<'EOF'
        #pragma once
        #include <string>

        namespace imstudio::engine {
            void init();
            void shutdown();
            int  add_widget(const std::string& type);
            bool delete_widget(int id);
            int  get_count();
            int  get_id_at(int index);
            std::string get_type(int id);
            std::string get_label(int id);
            std::string get_value_s(int id);
            float get_x(int id);
            float get_y(int id);
            float get_size_x(int id);
            float get_size_y(int id);
            float get_width(int id);
            bool set_label(int id, const std::string& v);
            bool set_value_s(int id, const std::string& v);
            bool move(int id, float x, float y);
            bool resize(int id, float sx, float sy);
            bool set_width(int id, float w);
            std::string generate_full_code();
        }
        EOF

        write_if_missing android/app/src/main/cpp/src/util/jstring_util.h <<'EOF'
        #pragma once
        #include <jni.h>
        #include <string>

        namespace imstudio::util {
            inline std::string from_jstring(JNIEnv* env, jstring s) {
                if (!s) return {};
                const char* c = env->GetStringUTFChars(s, nullptr);
                std::string out(c ? c : "");
                env->ReleaseStringUTFChars(s, c);
                return out;
            }
            inline jstring to_jstring(JNIEnv* env, const std::string& s) {
                return env->NewStringUTF(s.c_str());
            }
        }
        EOF

        write_if_missing android/app/src/main/cpp/src/engine/buffer_accessor.h <<'EOF'
        #pragma once
        #include <string>

        namespace imstudio::engine {
            void init();
            void shutdown();
            int  add_widget(const std::string& type);
            bool delete_widget(int id);
            int  get_count();
            int  get_id_at(int index);
            std::string get_type(int id);
            std::string get_label(int id);
            std::string get_value_s(int id);
            float get_x(int id);
            float get_y(int id);
            float get_size_x(int id);
            float get_size_y(int id);
            float get_width(int id);
            bool set_label(int id, const std::string& v);
            bool set_value_s(int id, const std::string& v);
            bool move(int id, float x, float y);
            bool resize(int id, float sx, float sy);
            bool set_width(int id, float w);
        }
        EOF

        write_if_missing android/app/src/main/cpp/src/engine/buffer_accessor.cpp <<'EOF'
        #include "engine/buffer_accessor.h"
        #include "ims_buffer.h"
        #include "ims_object.h"
        #include "imgui.h"

        #include <android/log.h>
        #include <mutex>
        #include <new>

        #define LOG_TAG "ImStudioCore"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO,  LOG_TAG, __VA_ARGS__)
        #define LOGW(...) __android_log_print(ANDROID_LOG_WARN,  LOG_TAG, __VA_ARGS__)
        #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

        namespace imstudio::engine {

        // Lazy state — no global constructor runs at .so load time.
        static ImStudio::BufferWindow* g_BufferPtr = nullptr;
        static std::mutex             g_Mutex;

        // Ensures ImGui context and BufferWindow exist. Must be called with lock held.
        static bool ensure_initialized_locked() {
            // Step 1: ImGui context
            if (ImGui::GetCurrentContext() == nullptr) {
                LOGI("[ensure] Creating ImGui context...");
                IMGUI_CHECKVERSION();
                ImGui::CreateContext();
                if (ImGui::GetCurrentContext() == nullptr) {
                    LOGE("[ensure] FAILED: ImGui::CreateContext() returned null context");
                    return false;
                }
                LOGI("[ensure] ImGui context created at %p",
                     (void*)ImGui::GetCurrentContext());
            } else {
                LOGI("[ensure] ImGui context already exists at %p",
                     (void*)ImGui::GetCurrentContext());
            }

            // Step 2: BufferWindow
            if (g_BufferPtr == nullptr) {
                LOGI("[ensure] Allocating BufferWindow...");
                g_BufferPtr = new (std::nothrow) ImStudio::BufferWindow();
                if (g_BufferPtr == nullptr) {
                    LOGE("[ensure] FAILED: BufferWindow allocation returned null");
                    return false;
                }
                LOGI("[ensure] BufferWindow allocated at %p", (void*)g_BufferPtr);
            } else {
                LOGI("[ensure] BufferWindow already exists at %p", (void*)g_BufferPtr);
            }

            return true;
        }

        static ImStudio::BufferWindow& buf() {
            std::lock_guard<std::mutex> lock(g_Mutex);
            if (!ensure_initialized_locked()) {
                // This is unrecoverable — throw so JNI caller can catch and report.
                LOGE("[buf] unrecoverable: engine not initialized");
                throw std::runtime_error("ImStudio engine not initialized");
            }
            return *g_BufferPtr;
        }

        ImStudio::BufferWindow& get_buffer() { return buf(); }

        void init() {
            LOGI("[init] entering");
            auto& b = buf();
            b.objects.clear();
            b.idgen = 0;
            b.selected_obj_id = -1;
            b.staticlayout = false;
            b.objects.reserve(2048);
            LOGI("[init] done: objects.size=%zu", b.objects.size());
        }

        void shutdown() {
            LOGI("[shutdown] entering");
            std::lock_guard<std::mutex> lock(g_Mutex);
            if (g_BufferPtr) {
                delete g_BufferPtr;
                g_BufferPtr = nullptr;
                LOGI("[shutdown] BufferWindow deleted");
            }
            if (ImGui::GetCurrentContext() != nullptr) {
                ImGui::DestroyContext();
                LOGI("[shutdown] ImGui context destroyed");
            }
            LOGI("[shutdown] done");
        }

        static ImStudio::Object* get_obj(int id) {
            return buf().getobj(id);
        }

        int add_widget(const std::string& type) {
            LOGI("[add_widget] type=%s", type.c_str());
            auto& b = buf();
            b.create(type, false);
            int id = b.objects.empty() ? -1 : b.objects.back().id;
            LOGI("[add_widget] -> id=%d", id);
            return id;
        }

        bool delete_widget(int id) {
            if (auto* o = get_obj(id)) { o->del(); return true; }
            return false;
        }

        int get_count() { return (int)buf().objects.size(); }

        int get_id_at(int index) {
            auto& b = buf();
            if (index < 0 || index >= (int)b.objects.size()) return -1;
            return b.objects[index].id;
        }

        std::string get_type(int id)      { auto* o = get_obj(id); return o ? o->type : ""; }
        std::string get_label(int id)     { auto* o = get_obj(id); return o ? o->label : ""; }
        std::string get_value_s(int id)   { auto* o = get_obj(id); return o ? o->value_s : ""; }
        float get_x(int id)               { auto* o = get_obj(id); return o ? o->pos.x : 0.f; }
        float get_y(int id)               { auto* o = get_obj(id); return o ? o->pos.y : 0.f; }
        float get_size_x(int id)          { auto* o = get_obj(id); return o ? o->size.x : 0.f; }
        float get_size_y(int id)          { auto* o = get_obj(id); return o ? o->size.y : 0.f; }
        float get_width(int id)           { auto* o = get_obj(id); return o ? o->width : 0.f; }

        bool set_label(int id, const std::string& v)   { auto* o = get_obj(id); if (!o) return false; o->label = v; return true; }
        bool set_value_s(int id, const std::string& v) { auto* o = get_obj(id); if (!o) return false; o->value_s = v; return true; }
        bool move(int id, float x, float y)            { auto* o = get_obj(id); if (!o) return false; o->pos.x = x; o->pos.y = y; return true; }
        bool resize(int id, float sx, float sy)        { auto* o = get_obj(id); if (!o) return false; o->size.x = sx; o->size.y = sy; return true; }
        bool set_width(int id, float w)                { auto* o = get_obj(id); if (!o) return false; o->width = w; return true; }

        } // namespace imstudio::engine
        EOF

        write_if_missing android/app/src/main/cpp/src/engine/code_generator.h <<'EOF'
        #pragma once
        #include <string>

        namespace imstudio::engine {
            std::string generate_full_code();
        }
        EOF

        write_if_missing android/app/src/main/cpp/src/engine/code_generator.cpp <<'EOF'
        #include "engine/code_generator.h"
        #include "ims_buffer.h"
        #include "ims_generator.h"
        #include "ims_object.h"
        #include <sstream>
        #include <android/log.h>

        #define LOG_TAG "ImStudioCore"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

        namespace imstudio::engine {
            ImStudio::BufferWindow& get_buffer();  // defined in buffer_accessor.cpp
        }

        namespace imstudio::engine {

        std::string generate_full_code() {
            LOGI("[generate_full_code] entering");
            auto& g_Buffer = get_buffer();

            std::ostringstream out;
            out << "// Generated by ImStudio (Android)\n";
            out << "#include \"imgui.h\"\n\n";

            for (auto& obj : g_Buffer.objects) {
                if (obj.type == "checkbox")         out << "static bool c1" << obj.id << " = false;\n";
                else if (obj.type == "radio")       out << "static bool r1" << obj.id << " = false;\n";
                else if (obj.type == "combo" || obj.type == "listbox")
                    out << "static const char* items" << obj.id << "[] = { \"Item 1\", \"Item 2\" };\n";
                else if (obj.type == "sliderfloat" || obj.type == "dragfloat")
                    out << "static float f1" << obj.id << " = 0.0f;\n";
                else if (obj.type == "sliderint" || obj.type == "dragint")
                    out << "static int i1" << obj.id << " = 0;\n";
                else if (obj.type == "textinput")   out << "static char buf" << obj.id << "[128] = \"\";\n";
                else if (obj.type == "inputint")    out << "static int in1" << obj.id << " = 0;\n";
                else if (obj.type == "inputfloat")  out << "static float inf1" << obj.id << " = 0.0f;\n";
            }
            out << "\nvoid RenderUI() {\n";
            for (auto& obj : g_Buffer.objects) {
                std::string snippet;
                ImStudio::Recreate(obj, &snippet, g_Buffer.staticlayout);
                out << snippet;
            }
            out << "}\n";
            LOGI("[generate_full_code] produced %zu bytes", out.str().size());
            return out.str();
        }

        } // namespace imstudio::engine
        EOF

        write_if_missing android/app/src/main/cpp/src/jni_bridge.cpp <<'EOF'
        #include <jni.h>
        #include "jni_bridge.h"
        #include "engine/buffer_accessor.h"
        #include "engine/code_generator.h"
        #include "util/jstring_util.h"
        #include <android/log.h>
        #include <exception>
        #include <stdexcept>

        #define LOG_TAG "ImStudioJNI"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO,  LOG_TAG, __VA_ARGS__)
        #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

        using namespace imstudio::engine;
        using imstudio::util::from_jstring;
        using imstudio::util::to_jstring;

        // ------------------------------------------------------------------
        // Throw a RuntimeException on the JVM side so Kotlin can catch it.
        // ------------------------------------------------------------------
        static void throw_java_runtime(JNIEnv* env, const char* msg) {
            if (env->ExceptionCheck()) return;
            jclass cls = env->FindClass("java/lang/RuntimeException");
            if (cls) env->ThrowNew(cls, msg);
        }

        #define JNI_GUARD_BEGIN \
            try {

        #define JNI_GUARD_END(env) \
            } catch (const std::exception& e) { \
                LOGE("C++ exception: %s", e.what()); \
                throw_java_runtime((env), e.what()); \
            } catch (...) { \
                LOGE("Unknown C++ exception"); \
                throw_java_runtime((env), "Unknown C++ exception in native call"); \
            }

        extern "C" {

        // ==================================================================
        // JNI lifecycle: called by System.loadLibrary
        // ==================================================================
        JNIEXPORT jint JNI_OnLoad(JavaVM* /*vm*/, void* /*reserved*/) {
            LOGI("========== JNI_OnLoad: libimstudio_core.so loading ==========");
            try {
                // Force full init so load fails fast if anything is wrong.
                // If this throws, we still return JNI_VERSION_1_6 so that
                // Kotlin's try/catch can display the error nicely instead
                // of crashing at System.loadLibrary time.
                imstudio::engine::init();
                LOGI("========== JNI_OnLoad: init OK ==========");
            } catch (const std::exception& e) {
                LOGE("========== JNI_OnLoad: init FAILED: %s ==========", e.what());
            } catch (...) {
                LOGE("========== JNI_OnLoad: init FAILED (unknown) ==========");
            }
            return JNI_VERSION_1_6;
        }

        JNIEXPORT void JNI_OnUnload(JavaVM* /*vm*/, void* /*reserved*/) {
            LOGI("========== JNI_OnUnload: cleaning up ==========");
            try {
                imstudio::engine::shutdown();
            } catch (...) {
                LOGE("JNI_OnUnload: shutdown threw");
            }
            LOGI("========== JNI_OnUnload: done ==========");
        }

        // ==================================================================
        // Public JNI surface
        // ==================================================================
        JNIEXPORT void JNICALL
        Java_com_raais_imstudio_NativeBridge_initBuffer(JNIEnv* env, jobject) {
            LOGI("[JNI] initBuffer called");
            JNI_GUARD_BEGIN
                imstudio::engine::init();
            JNI_GUARD_END(env)
        }

        JNIEXPORT void JNICALL
        Java_com_raais_imstudio_NativeBridge_shutdown(JNIEnv* env, jobject) {
            LOGI("[JNI] shutdown called");
            JNI_GUARD_BEGIN
                imstudio::engine::shutdown();
            JNI_GUARD_END(env)
        }

        JNIEXPORT jint JNICALL
        Java_com_raais_imstudio_NativeBridge_createWidget(JNIEnv* env, jobject, jstring type) {
            JNI_GUARD_BEGIN
                return add_widget(from_jstring(env, type));
            JNI_GUARD_END(env)
            return -1;
        }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_deleteWidget(JNIEnv* env, jobject, jint id) {
            JNI_GUARD_BEGIN
                return delete_widget(id) ? JNI_TRUE : JNI_FALSE;
            JNI_GUARD_END(env)
            return JNI_FALSE;
        }

        JNIEXPORT jint JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetCount(JNIEnv* env, jobject) {
            JNI_GUARD_BEGIN
                return get_count();
            JNI_GUARD_END(env)
            return 0;
        }

        JNIEXPORT jint JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetId(JNIEnv* env, jobject, jint i) {
            JNI_GUARD_BEGIN
                return get_id_at(i);
            JNI_GUARD_END(env)
            return -1;
        }

        JNIEXPORT jstring JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetType(JNIEnv* env, jobject, jint id) {
            JNI_GUARD_BEGIN
                return to_jstring(env, get_type(id));
            JNI_GUARD_END(env)
            return env->NewStringUTF("");
        }

        JNIEXPORT jstring JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetLabel(JNIEnv* env, jobject, jint id) {
            JNI_GUARD_BEGIN
                return to_jstring(env, get_label(id));
            JNI_GUARD_END(env)
            return env->NewStringUTF("");
        }

        JNIEXPORT jstring JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetValueS(JNIEnv* env, jobject, jint id) {
            JNI_GUARD_BEGIN
                return to_jstring(env, get_value_s(id));
            JNI_GUARD_END(env)
            return env->NewStringUTF("");
        }

        JNIEXPORT jfloat JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetX(JNIEnv* env, jobject, jint id) {
            JNI_GUARD_BEGIN return get_x(id); JNI_GUARD_END(env) return 0.f;
        }
        JNIEXPORT jfloat JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetY(JNIEnv* env, jobject, jint id) {
            JNI_GUARD_BEGIN return get_y(id); JNI_GUARD_END(env) return 0.f;
        }
        JNIEXPORT jfloat JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetSizeX(JNIEnv* env, jobject, jint id) {
            JNI_GUARD_BEGIN return get_size_x(id); JNI_GUARD_END(env) return 0.f;
        }
        JNIEXPORT jfloat JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetSizeY(JNIEnv* env, jobject, jint id) {
            JNI_GUARD_BEGIN return get_size_y(id); JNI_GUARD_END(env) return 0.f;
        }
        JNIEXPORT jfloat JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetWidth(JNIEnv* env, jobject, jint id) {
            JNI_GUARD_BEGIN return get_width(id); JNI_GUARD_END(env) return 0.f;
        }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_setWidgetLabel(JNIEnv* env, jobject, jint id, jstring v) {
            JNI_GUARD_BEGIN
                return set_label(id, from_jstring(env, v)) ? JNI_TRUE : JNI_FALSE;
            JNI_GUARD_END(env)
            return JNI_FALSE;
        }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_setWidgetValueS(JNIEnv* env, jobject, jint id, jstring v) {
            JNI_GUARD_BEGIN
                return set_value_s(id, from_jstring(env, v)) ? JNI_TRUE : JNI_FALSE;
            JNI_GUARD_END(env)
            return JNI_FALSE;
        }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_moveWidget(JNIEnv* env, jobject, jint id, jfloat x, jfloat y) {
            JNI_GUARD_BEGIN
                return move(id, x, y) ? JNI_TRUE : JNI_FALSE;
            JNI_GUARD_END(env)
            return JNI_FALSE;
        }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_resizeWidget(JNIEnv* env, jobject, jint id, jfloat sx, jfloat sy) {
            JNI_GUARD_BEGIN
                return resize(id, sx, sy) ? JNI_TRUE : JNI_FALSE;
            JNI_GUARD_END(env)
            return JNI_FALSE;
        }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_setWidgetWidth(JNIEnv* env, jobject, jint id, jfloat w) {
            JNI_GUARD_BEGIN
                return set_width(id, w) ? JNI_TRUE : JNI_FALSE;
            JNI_GUARD_END(env)
            return JNI_FALSE;
        }

        JNIEXPORT jstring JNICALL
        Java_com_raais_imstudio_NativeBridge_generateCode(JNIEnv* env, jobject) {
            JNI_GUARD_BEGIN
                return to_jstring(env, generate_full_code());
            JNI_GUARD_END(env)
            return env->NewStringUTF("// error");
        }

        } // extern "C"
        EOF

        write_if_missing android/app/src/main/cpp/CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.22)
        project(imstudio_core)
        set(CMAKE_CXX_STANDARD 17)

        # ------------------------------------------------------------------
        # ★★ Critical: disable IM_ASSERT abort() so that a spurious assert
        #    inside ImGui cannot kill the app. Errors are logged, not fatal.
        # ------------------------------------------------------------------
        add_library(imgui STATIC
            vendor/imgui/imgui.cpp
            vendor/imgui/imgui_draw.cpp
            vendor/imgui/imgui_tables.cpp
            vendor/imgui/imgui_widgets.cpp
            vendor/imgui/imgui_demo.cpp
            vendor/imgui/misc/cpp/imgui_stdlib.cpp
        )
        target_include_directories(imgui PUBLIC
            vendor/imgui
            vendor/imgui/misc/cpp
        )
        target_compile_definitions(imgui PUBLIC "IM_ASSERT(_EXPR)=((void)0)")

        add_library(fmt INTERFACE)
        target_include_directories(fmt INTERFACE vendor/fmt/include)
        target_compile_definitions(fmt INTERFACE FMT_HEADER_ONLY=1)

        set(IMS_SOURCES
            vendor/imstudio/ims_generator.cpp
            vendor/imstudio/ims_buffer.cpp
            vendor/imstudio/ims_object.cpp
        )
        if(EXISTS ${CMAKE_CURRENT_SOURCE_DIR}/vendor/imstudio/ims_object_draw.cpp)
            list(APPEND IMS_SOURCES vendor/imstudio/ims_object_draw.cpp)
        endif()
        if(EXISTS ${CMAKE_CURRENT_SOURCE_DIR}/vendor/imstudio/ims_utils.cpp)
            list(APPEND IMS_SOURCES vendor/imstudio/ims_utils.cpp)
        endif()

        add_library(imstudio_core SHARED
            src/jni_bridge.cpp
            src/engine/buffer_accessor.cpp
            src/engine/code_generator.cpp
