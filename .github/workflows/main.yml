name: Build ImGui Menu Editor APK
'on':
  push: null
  workflow_dispatch: null
  pull_request:
    branches:
    - main
permissions:
  contents: read
env:
  IMGUI_VERSION_TAG: v1.91.5
  GRADLE_VERSION: '8.9'
  AGP_VERSION: 8.5.2
  NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1
jobs:
  build:
    name: Build APK (Kotlin + C++ NDK, real Dear ImGui)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Generate project tree (all sources embedded in this workflow)
      run: |-
        set -euo pipefail

        mkdir -p app/src/main/java/com/imguied/menueditor app/src/main/cpp gradle/wrapper

        mkdir -p "$(dirname 'app/src/main/java/com/imguied/menueditor/MainActivity.kt')"
        cat > 'app/src/main/java/com/imguied/menueditor/MainActivity.kt' <<'IMGUIED_EOF'
        package com.imguied.menueditor

        import android.app.NativeActivity
        import android.os.Bundle
        import android.content.Context
        import android.view.inputmethod.InputMethodManager
        import android.view.KeyEvent
        import java.util.concurrent.LinkedBlockingQueue

        class MainActivity : NativeActivity() {
            public override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
            }

            fun showSoftInput() {
                val inputMethodManager = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                inputMethodManager.showSoftInput(this.window.decorView, 0)
            }

            fun hideSoftInput() {
                val inputMethodManager = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                inputMethodManager.hideSoftInputFromWindow(this.window.decorView.windowToken, 0)
            }

            // Queue for the Unicode characters to be polled from native code (via pollUnicodeChar())
            private var unicodeCharacterQueue: LinkedBlockingQueue<Int> = LinkedBlockingQueue()

            // We assume dispatchKeyEvent() of the NativeActivity is actually called for every
            // KeyEvent and not consumed by any View before it reaches here
            override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                if (event.action == KeyEvent.ACTION_DOWN) {
                    unicodeCharacterQueue.offer(event.getUnicodeChar(event.metaState))
                }
                return super.dispatchKeyEvent(event)
            }

            fun pollUnicodeChar(): Int {
                return unicodeCharacterQueue.poll() ?: 0
            }
        }

        IMGUIED_EOF

        mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
        cat > 'app/src/main/AndroidManifest.xml' <<'IMGUIED_EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
                android:label="ImGui Menu Editor"
                android:allowBackup="false"
                android:fullBackupContent="false"
                android:hasCode="true"
                android:icon="@android:drawable/sym_def_app_icon">

                <activity
                    android:name="com.imguied.menueditor.MainActivity"
                    android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                    android:configChanges="orientation|keyboardHidden|screenSize"
                    android:exported="true">
                    <meta-data android:name="android.app.lib_name"
                        android:value="ImGuiMenuEditor" />

                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>

        IMGUIED_EOF

        mkdir -p "$(dirname 'settings.gradle')"
        cat > 'settings.gradle' <<'IMGUIED_EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "ImGuiMenuEditor"
        include ':app'

        IMGUIED_EOF

        mkdir -p "$(dirname 'build.gradle')"
        cat > 'build.gradle' <<'IMGUIED_EOF'
        // Top-level build file.
        plugins {
            id 'com.android.application' version '8.5.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
        }

        IMGUIED_EOF

        mkdir -p "$(dirname 'gradle.properties')"
        cat > 'gradle.properties' <<'IMGUIED_EOF'
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        kotlin.code.style=official

        IMGUIED_EOF

        mkdir -p "$(dirname 'app/build.gradle')"
        cat > 'app/build.gradle' <<'IMGUIED_EOF'
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            compileSdk 34
            ndkVersion "27.0.12077973"

            defaultConfig {
                applicationId "com.imguied.menueditor"
                namespace "com.imguied.menueditor"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
                debug {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }

            externalNativeBuild {
                cmake {
                    path "src/main/cpp/CMakeLists.txt"
                    version '3.22.1'
                }
            }
        }

        repositories {
            mavenCentral()
        }
        dependencies {
            implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
        }

        IMGUIED_EOF

        mkdir -p "$(dirname 'app/src/main/cpp/CMakeLists.txt')"
        cat > 'app/src/main/cpp/CMakeLists.txt' <<'IMGUIED_EOF'
        cmake_minimum_required(VERSION 3.22.1)

        project(ImGuiMenuEditor)

        set(CMAKE_CXX_STANDARD 17)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)
        set(CMAKE_CXX_EXTENSIONS OFF)

        # Dear ImGui sources live in app/src/main/cpp/imgui/ (fetched in CI step)
        set(IMGUI_DIR ${CMAKE_CURRENT_SOURCE_DIR}/imgui)

        # NOTE: editor_nodes.cpp is NOT compiled standalone: main.cpp includes it
        # directly (#include "editor_nodes.cpp"), same as the other editor modules.
        # Compiling it separately would create duplicate symbols at link time.
        add_library(${CMAKE_PROJECT_NAME} SHARED
          main.cpp
          ${IMGUI_DIR}/imgui.cpp
          ${IMGUI_DIR}/imgui_demo.cpp
          ${IMGUI_DIR}/imgui_draw.cpp
          ${IMGUI_DIR}/imgui_tables.cpp
          ${IMGUI_DIR}/imgui_widgets.cpp
          ${IMGUI_DIR}/backends/imgui_impl_android.cpp
          ${IMGUI_DIR}/backends/imgui_impl_opengl3.cpp
          ${ANDROID_NDK}/sources/android/native_app_glue/android_native_app_glue.c
        )

        set(CMAKE_SHARED_LINKER_FLAGS
          "${CMAKE_SHARED_LINKER_FLAGS} -u ANativeActivity_onCreate"
        )

        target_compile_definitions(${CMAKE_PROJECT_NAME} PRIVATE
          IMGUI_IMPL_OPENGL_ES3
        )

        target_include_directories(${CMAKE_PROJECT_NAME} PRIVATE
          ${CMAKE_CURRENT_SOURCE_DIR}
          ${IMGUI_DIR}
          ${IMGUI_DIR}/backends
          ${ANDROID_NDK}/sources/android/native_app_glue
        )

        target_link_libraries(${CMAKE_PROJECT_NAME} PRIVATE
          android
          EGL
          GLESv3
          log
        )

        IMGUIED_EOF

        mkdir -p "$(dirname 'app/src/main/cpp/main.cpp')"
        cat > 'app/src/main/cpp/main.cpp' <<'IMGUIED_EOF'
        // main.cpp - Android entry point for the visual Dear ImGui menu editor/engine.
        // Real Dear ImGui (v1.91.5) with the official Android + OpenGL ES 3 backends.
        #include <android/log.h>
        #include <android/input.h>
        #include <android/keycode.h>
        #include <android_native_app_glue.h>
        #include <android/asset_manager.h>
        #include <jni.h>
        #include <EGL/egl.h>
        #include <GLES3/gl3.h>
        #include <string>
        #include <vector>

        #include "imgui.h"
        #include "imgui_impl_android.h"
        #include "imgui_impl_opengl3.h"
        #include <string>
        #include <vector>

        #include "editor_nodes.h"

        // Editor modules (single TU style: include .cpp for simplicity on CI)
        #include "editor_nodes.cpp"
        #include "editor_render.cpp"
        #include "editor_chrome.cpp"

        // ---------------------------------------------------------------------------
        // Data
        // ---------------------------------------------------------------------------
        static EGLDisplay           g_EglDisplay = EGL_NO_DISPLAY;
        static EGLSurface           g_EglSurface = EGL_NO_SURFACE;
        static EGLContext           g_EglContext = EGL_NO_CONTEXT;
        static struct android_app*  g_App = nullptr;
        static bool                 g_Initialized = false;
        static char                  g_LogTag[] = "ImGuiMenuEditor";
        static std::string           g_IniFilename = "";
        static std::string           g_DocFilename = "";
        static std::string           g_SaveBuf = "";

        // JNI helpers -------------------------------------------------------------
        static JNIEnv* GetJEnv()
        {
            JNIEnv* env = nullptr;
            if (g_App->activity->vm->GetEnv((void**)&env, JNI_VERSION_1_6) == JNI_OK)
                return env;
            if (g_App->activity->vm->AttachCurrentThread(&env, nullptr) == JNI_OK)
                return env; // caller detaches not needed: NativeActivity thread stays attached
            return nullptr;
        }

        static int ShowSoftKeyboardInput()
        {
            JNIEnv* env = GetJEnv(); if (!env) return -1;
            jclass cl = env->GetObjectClass(g_App->activity->clazz);
            jmethodID m = env->GetMethodID(cl, "showSoftInput", "()V");
            if (m) env->CallVoidMethod(g_App->activity->clazz, m);
            return 0;
        }

        static int PollUnicodeChars()
        {
            JNIEnv* env = GetJEnv(); if (!env) return -1;
            jclass cl = env->GetObjectClass(g_App->activity->clazz);
            jmethodID m = env->GetMethodID(cl, "pollUnicodeChar", "()I");
            if (!m) return -2;
            ImGuiIO& io = ImGui::GetIO();
            jint c;
            int n = 0;
            while ((c = env->CallIntMethod(g_App->activity->clazz, m)) != 0)
                io.AddInputCharacter((unsigned)c), n++;
            return n;
        }

        // File I/O via internal storage -------------------------------------------
        static bool SaveDoc(const char* text)
        {
            if (!g_App) return false;
            std::string path = std::string(g_App->activity->internalDataPath) + "/menu.gmz";
            FILE* f = fopen(path.c_str(), "w");
            if (!f) return false;
            fwrite(text, 1, strlen(text), f);
            fclose(f);
            return true;
        }
        static std::string LoadDoc()
        {
            std::string path = std::string(g_App->activity->internalDataPath) + "/menu.gmz";
            FILE* f = fopen(path.c_str(), "r");
            if (!f) return "";
            std::string s;
            char buf[1024]; size_t r;
            while ((r = fread(buf, 1, sizeof(buf), f)) > 0) s.append(buf, r);
            fclose(f);
            return s;
        }

        // ---------------------------------------------------------------------------
        // Default starter document: a full-featured example menu tree.
        // ---------------------------------------------------------------------------
        static Node* MakeDefaultDocument()
        {
            Node* win = Node_New(NWindow);
            strncpy(win->name, "My Menu", 63); win->w = 420; win->h = 340;

            Node* mb = Node_New(NMenuBar);
            Node_AddChild(win, mb);
            Node* m_file = Node_New(NMenu); strncpy(m_file->name, "File", 63);
            Node_AddChild(mb, m_file);
            const char* mis[] = {"New", "Open...", "Save", "Exit"};
            for (const char* t : mis)
            {
                Node* mi = Node_New(NMenuItem); strncpy(mi->name, t, 63);
                Node_AddChild(m_file, mi);
            }
            Node* m_help = Node_New(NMenu); strncpy(m_help->name, "Help", 63);
            Node_AddChild(mb, m_help);
            Node* mi_about = Node_New(NMenuItem); strncpy(mi_about->name, "About", 63);
            Node_AddChild(m_help, mi_about);

            Node* hdr = Node_New(NCollapsingHeader); strncpy(hdr->name, "Settings", 63);
            Node_AddChild(win, hdr);

            Node* tb = Node_New(NTabBar); Node_AddChild(hdr, tb);
            Node* t1 = Node_New(NTabItem); strncpy(t1->name, "Display", 63); Node_AddChild(tb, t1);

            Node* chk = Node_New(NCheckbox); strncpy(chk->name, "Fullscreen", 63); Node_AddChild(t1, chk);
            Node* vs = Node_New(NSliderFloat); strncpy(vs->name, "Brightness", 63);
            vs->v_float = 0.8f; vs->v_min = 0; vs->v_max = 1; Node_AddChild(t1, vs);
            Node* vi = Node_New(NSliderInt); strncpy(vi->name, "Resolution", 63);
            vi->v_int = 2; vi->v_min = 0; vi->v_max = 3; Node_AddChild(t1, vi);
            Node* cmb = Node_New(NCombo); strncpy(cmb->name, "Quality", 63);
            strncpy(cmb->value_str, "Low,Medium,High,Ultra", 63); cmb->combo_i = 2; Node_AddChild(t1, vi->parent == t1 ? t1 : t1), Node_AddChild(t1, cmb);

            Node* t2 = Node_New(NTabItem); strncpy(t2->name, "Audio", 63); Node_AddChild(tb, t2);
            Node* vol = Node_New(NSliderFloat); strncpy(vol->name, "Volume", 63);
            vol->v_float = 0.5f; vol->v_min = 0; vol->v_max = 1; Node_AddChild(t2, vol);
            Node* plot = Node_New(NPlotLines); strncpy(plot->name, "Waveform", 63);
            plot->v_int = 90; plot->w = -1; plot->h = 60; Node_AddChild(t2, plot);

            Node* tbl_hdr = Node_New(NCollapsingHeader); strncpy(tbl_hdr->name, "Players", 63);
            Node_AddChild(win, tbl_hdr);
            Node* tbl = Node_New(NTable); tbl->v_int = 3;
            Node_AddChild(tbl_hdr, tbl);
            for (int r = 0; r < 3; r++)
            {
                Node* row = Node_New(NTableRow); Node_AddChild(tbl, row);
                char cell[32];
                snprintf(cell, sizeof(cell), "Player %d", r + 1);
                Node* c1 = Node_New(NText); strncpy(c1->name, cell, 63); Node_AddChild(row, c1);
                Node* c2 = Node_New(NText); strncpy(c2->name, "100", 63); Node_AddChild(row, c2);
                Node* c3 = Node_New(NProgressBar); c3->fraction = 0.3f + 0.3f * r; Node_AddChild(row, c3);
            }

            Node* tipbox = Node_New(NTooltip); strncpy(tipbox->value_str, "Tap any item in the palette to edit it.", 63);
            Node_AddChild(win, tipbox);

            return win;
        }

        // ---------------------------------------------------------------------------
        // App lifecycle
        // ---------------------------------------------------------------------------
        static void Init(struct android_app* app)
        {
            if (g_Initialized) return;
            g_App = app;
            ANativeWindow_acquire(g_App->window);

            g_EglDisplay = eglGetDisplay(EGL_DEFAULT_DISPLAY);
            eglInitialize(g_EglDisplay, 0, 0);
            const EGLint egl_attributes[] = { EGL_BLUE_SIZE, 8, EGL_GREEN_SIZE, 8, EGL_RED_SIZE, 8, EGL_DEPTH_SIZE, 24, EGL_SURFACE_TYPE, EGL_WINDOW_BIT, EGL_NONE };
            EGLint num_configs = 0;
            if (eglChooseConfig(g_EglDisplay, egl_attributes, nullptr, 0, &num_configs) != EGL_TRUE || num_configs == 0)
                __android_log_print(ANDROID_LOG_ERROR, g_LogTag, "%s", "eglChooseConfig() failed");
            EGLConfig egl_config;
            eglChooseConfig(g_EglDisplay, egl_attributes, &egl_config, 1, &num_configs);
            EGLint egl_format;
            eglGetConfigAttrib(g_EglDisplay, egl_config, EGL_NATIVE_VISUAL_ID, &egl_format);
            ANativeWindow_setBuffersGeometry(g_App->window, 0, 0, egl_format);
            const EGLint egl_context_attributes[] = { EGL_CONTEXT_CLIENT_VERSION, 3, EGL_NONE };
            g_EglContext = eglCreateContext(g_EglDisplay, egl_config, EGL_NO_CONTEXT, egl_context_attributes);
            g_EglSurface = eglCreateWindowSurface(g_EglDisplay, egl_config, g_App->window, nullptr);
            eglMakeCurrent(g_EglDisplay, g_EglSurface, g_EglSurface, g_EglContext);

            IMGUI_CHECKVERSION();
            ImGui::CreateContext();
            ImGuiIO& io = ImGui::GetIO();
            g_IniFilename = std::string(app->activity->internalDataPath) + "/imgui.ini";
            io.IniFilename = g_IniFilename.c_str();
            ImGui::StyleColorsDark();

            ImGui_ImplAndroid_Init(g_App->window);
            ImGui_ImplOpenGL3_Init("#version 300 es");

            ImFontConfig font_cfg;
            font_cfg.SizePixels = 22.0f;
            io.Fonts->AddFontDefault(&font_cfg);
            ImGui::GetStyle().ScaleAllSizes(2.6f);

            // Load saved document or default
            std::string saved = LoadDoc();
            if (!saved.empty())
                g_ed.root = LoadTreeFromString(saved);
            if (!g_ed.root) g_ed.root = MakeDefaultDocument();
            g_ed.sel = g_ed.root ? g_ed.root->id : -1;

            g_Initialized = true;
        }

        static void Shutdown()
        {
            if (!g_Initialized) return;
            ImGui_ImplOpenGL3_Shutdown();
            ImGui_ImplAndroid_Shutdown();
            ImGui::DestroyContext();
            if (g_EglDisplay != EGL_NO_DISPLAY)
            {
                eglMakeCurrent(g_EglDisplay, EGL_NO_SURFACE, EGL_NO_SURFACE, EGL_NO_CONTEXT);
                if (g_EglContext != EGL_NO_CONTEXT) eglDestroyContext(g_EglDisplay, g_EglContext);
                if (g_EglSurface != EGL_NO_SURFACE) eglDestroySurface(g_EglDisplay, g_EglSurface);
                eglTerminate(g_EglDisplay);
            }
            g_EglDisplay = EGL_NO_DISPLAY; g_EglContext = EGL_NO_CONTEXT; g_EglSurface = EGL_NO_SURFACE;
            ANativeWindow_release(g_App->window);
            g_Initialized = false;
        }

        // ---------------------------------------------------------------------------
        // Frame
        // ---------------------------------------------------------------------------
        static void MainLoopStep()
        {
            ImGuiIO& io = ImGui::GetIO();
            if (g_EglDisplay == EGL_NO_DISPLAY) return;

            PollUnicodeChars();

            static bool WantTextInputLast = false;
            if (io.WantTextInput && !WantTextInputLast) ShowSoftKeyboardInput();
            WantTextInputLast = io.WantTextInput;

            ImGui_ImplOpenGL3_NewFrame();
            ImGui_ImplAndroid_NewFrame();
            ImGui::NewFrame();

            // touch-tap selection in the palette area (edit mode only): consume taps
            // that didn't land on editor chrome. We detect via a tap released in the
            // middle palette region this frame and no editor window under it.
            if (g_ed.edit_mode && g_ed.root)
            {
                // A tap: mouse pressed then released. Select the hit node if the
                // release point lies in the central palette region (outside the
                // editor chrome drawers/boxes).
                static ImVec2 press_pos(-1, -1);
                if (ImGui::IsMouseClicked(ImGuiMouseButton_Left))
                    press_pos = io.MousePos;
                if (ImGui::IsMouseReleased(ImGuiMouseButton_Left) && press_pos.x >= 0)
                {
                    int hit = HitTest((int)press_pos.x, (int)press_pos.y);
                    if (hit > 0)
                    {
                        float W = io.DisplaySize.x, H = io.DisplaySize.y;
                        bool in_palette = press_pos.x > 210 && press_pos.x < W - 270 &&
                                          press_pos.y > 70 && press_pos.y < H - 120;
                        bool chrome_hovered = ImGui::IsWindowHovered(ImGuiHoveredFlags_AnyWindow);
                        if (in_palette && !chrome_hovered)
                            g_ed.sel = hit;
                    }
                    press_pos = ImVec2(-1, -1);
                }
            }

            // 1. Palette in the middle: render the user's document (real widgets).
            if (g_ed.root)
            {
                HitClear();
                RenderNode(g_ed.root, g_ed.edit_mode, g_ed.sel);
            }

            // 2. Editor chrome (drawers + boxes + lock) in edit mode.
            if (g_ed.edit_mode)
            {
                DrawTopBox();
                DrawAddPalette();
                DrawTree();
                DrawProps();
                DrawBottomBox();
                DrawLockButton();
            }
            else
            {
                DrawLockedOverlay();
                if (g_ed.show_demo_test)
                    ImGui::ShowDemoWindow(&g_ed.show_demo_test);
            }

            // Render
            ImGui::Render();
            glViewport(0, 0, (int)io.DisplaySize.x, (int)io.DisplaySize.y);
            glClearColor(0.10f, 0.12f, 0.14f, 1.00f);
            glClear(GL_COLOR_BUFFER_BIT);
            ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
            eglSwapBuffers(g_EglDisplay, g_EglSurface);

            // Autosave (every ~5 s)
            static double last_save = 0.0;
            if (ImGui::GetTime() - last_save > 5.0)
            {
                last_save = ImGui::GetTime();
                SaveDoc(SaveTreeToString(g_ed.root).c_str());
            }
        }

        static void handleAppCmd(struct android_app* app, int32_t appCmd)
        {
            switch (appCmd)
            {
            case APP_CMD_INIT_WINDOW: Init(app); break;
            case APP_CMD_TERM_WINDOW: Shutdown(); break;
            default: break;
            }
        }
        static int32_t handleInputEvent(struct android_app* app, AInputEvent* inputEvent)
        {
            return ImGui_ImplAndroid_HandleInputEvent(inputEvent);
        }

        void android_main(struct android_app* app)
        {
            app->onAppCmd = handleAppCmd;
            app->onInputEvent = handleInputEvent;

            while (true)
            {
                int out_events;
                struct android_poll_source* out_data;
                while (ALooper_pollOnce(g_Initialized ? 0 : -1, nullptr, &out_events, (void**)&out_data) >= 0)
                {
                    if (out_data != nullptr) out_data->process(app, out_data);
                    if (app->destroyRequested != 0)
                    {
                        if (!g_Initialized) Shutdown();
                        return;
                    }
                }
                MainLoopStep();
            }
        }

        IMGUIED_EOF

        mkdir -p "$(dirname 'app/src/main/cpp/editor_nodes.h')"
        cat > 'app/src/main/cpp/editor_nodes.h' <<'IMGUIED_EOF'
        // editor_nodes.h - Node model for the visual Dear ImGui menu editor/engine.
        // Defines every widget type, its per-node options, flag sets, style overrides,
        // tree structure (parent/child), and (de)serialization to a compact text format.
        #pragma once

        #include "imgui.h"
        #include "imgui_internal.h"   // ImRect, ImMax, ImVec2 ops
        #include <vector>
        #include <string>
        #include <cstring>
        #include <cstdlib>
        #include <cstdio>

        // ---------------------------------------------------------------------------
        // Node type: every Dear ImGui menu-building element the editor supports.
        // ---------------------------------------------------------------------------
        enum NodeKind
        {
            NWindow = 0, NMenuBar, NMenu, NMenuItem, NCollapsingHeader, NTreeNode,
            NTabBar, NTabItem, NGroup, NChild, NTable, NTableRow, NText, NTextWrapped,
            NTextDisabled, NSeparator, NSeparatorText, NBulletText, NButton, NSmallButton,
            NArrowButton, NCheckbox, NCheckboxFlags, NRadioButton, NCombo, NListBox,
            NInputText, NInputTextMultiline, NInputInt, NInputFloat, NDragInt, NDragFloat,
            NSliderInt, NSliderFloat, NColorEdit3, NColorEdit4, NProgressBar, NPlotLines,
            NPlotHistogram, NImage, NSelectable, NTooltip, NPopupModal, NKIND_COUNT
        };

        inline const char* NodeKindName(int k)
        {
            static const char* names[NKIND_COUNT] = {
                "Window","MenuBar","Menu","MenuItem","CollapsingHeader","TreeNode",
                "TabBar","TabItem","Group","Child","Table","TableRow",
                "Text","TextWrapped","TextDisabled","Separator","SeparatorText","BulletText",
                "Button","SmallButton","ArrowButton","Checkbox","CheckboxFlags","RadioButton",
                "Combo","ListBox","InputText","InputTextMultiline","InputInt","InputFloat",
                "DragInt","DragFloat","SliderInt","SliderFloat","ColorEdit3","ColorEdit4",
                "ProgressBar","PlotLines","PlotHistogram","Image","Selectable",
                "Tooltip","PopupModal"
            };
            return (k >= 0 && k < NKIND_COUNT) ? names[k] : "?";
        }

        inline int NodeKindFromName(const char* n)
        {
            for (int i = 0; i < NKIND_COUNT; i++) if (strcmp(NodeKindName(i), n) == 0) return i;
            return -1;
        }

        // Which node kinds may parent which children (drives the tree structure UI).
        inline bool NodeAcceptsChildren(int k)
        {
            switch (k)
            {
            case NWindow: case NMenuBar: case NMenu: case NCollapsingHeader: case NTreeNode:
            case NTabItem: case NGroup: case NChild: case NTable: case NTableRow:
            case NPopupModal: case NTooltip: case NListBox:
                return true;
            default: return false;
            }
        }
        inline bool NodeIsContainerish(int k) // containers shown open in palette by default
        {
            switch (k)
            {
            case NWindow: case NMenuBar: case NMenu: case NCollapsingHeader: case NTreeNode:
            case NTabItem: case NGroup: case NChild: case NPopupModal:
                return true;
            default: return false;
            }
        }

        // ---------------------------------------------------------------------------
        // Node: one menu element with ALL its configurable options.
        // ---------------------------------------------------------------------------
        struct Node
        {
            int             kind = NText;
            int             id = 0;              // stable id, used for selection
            char            name[64] = "Item";    // window title / button label / id string
            char            value_str[64] = "";   // text content, combo items (csv), shortcut...
            bool            open = true;         // container open state in palette/preview
            bool            visible = true;       // item enabled/visible
            bool            selected = false;     // radio/selected state preview
            bool            p_open_flag = true;  // window/tab close-button flag
            int             flags = 0;            // per-kind ImGui flags (window/input/slider...)
            int             flags2 = 0;           // secondary set (table row: row flags; etc.)
            int             arrow_dir = 0;        // ArrowButton dir, 0..3
            int             v_int = 0, v_int2 = 0;
            float           v_float = 0.0f, v_float2 = 0.0f, v_float3 = 1.0f, v_float4 = 0.0f;
            float           v_min = 0.0f, v_max = 1.0f, v_speed = 1.0f;
            float           w = 0.0f, h = 0.0f;   // explicit size (child/table/graph/image)
            float           colors[4] = {0.26f, 0.59f, 0.98f, 1.0f};
            float           fraction = 0.7f;      // progress bar
            int             combo_i = 0;          // current combo/listbox/radio index
            char            fmt[24] = "%.3f";     // numeric format string
            char            shortcut[24] = "";   // menu item shortcut text
            bool            round_to_int = false;// drag display
            // style overrides applied to this subtree entry
            bool            st_alpha_used = false;  float st_alpha = 1.0f;
            bool            st_col_used[3] = {false,false,false};
            int             st_col_id[3] = {0,0,0};
            float           st_col_v[3][4] = {{0},{0},{0}};
            // layout
            bool            same_line = false;    // start on same line as previous item
            float           indent = 0.0f;
            // runtime (not serialized)
            bool            palette_open = true;
            Node*           parent = nullptr;
            std::vector<Node*> children;

            ~Node() { for (Node* c : children) delete c; }
        };

