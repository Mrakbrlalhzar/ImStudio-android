name: Fix JVM target mismatch and build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Rewrite app/build.gradle.kts with matching JVM targets
      run: |
        cat > android/app/build.gradle.kts <<'EOF'
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.example.imguieditor"
            compileSdk = 34
            ndkVersion = "26.1.10909125"

            defaultConfig {
                applicationId = "com.example.imguieditor"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
                externalNativeBuild {
                    cmake {
                        cppFlags += "-std=c++17 -fexceptions"
                        arguments += "-DANDROID_STL=c++_shared"
                    }
                }
                ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
            }

            externalNativeBuild {
                cmake { path = file("src/main/cpp/CMakeLists.txt") }
            }

            buildFeatures { buildConfig = true }

            // ★ FIX: match both Kotlin and Java to JVM 17
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        EOF
        echo "app/build.gradle.kts rewritten (JVM 17 for both Kotlin and Java)"

    - name: Commit fix
      run: |
        git config user.name "ImGui Engine Bot"
        git config user.email "bot@imgui-engine.local"
        git add -A
        if git diff --staged --quiet; then echo "Nothing to commit"; else
          git commit -m "fix(gradle): align Kotlin and Java JVM target to 17 [skip ci]"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Install NDK
      run: |
        echo "y" | sdkmanager --install "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ImGui-Visual-Engine-fixed
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
