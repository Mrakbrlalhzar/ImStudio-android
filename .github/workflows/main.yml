name: ImStudio Android — Sync & Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write

jobs:
  sync-generate-build:
    runs-on: ubuntu-latest
    steps:
    # ============================================================
    # 1. Checkout + clone upstream
    # ============================================================
    - name: Checkout target repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Clone upstream ImStudio (read-only reference)
      run: |
        git clone --depth 1 https://github.com/Raais/ImStudio /tmp/ImStudio
        UPSTREAM_SHA=$(cd /tmp/ImStudio && git rev-parse --short HEAD)
        echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV

    - name: Prepare helper
      run: |
        cat > /tmp/write_if_missing <<'HELPER_EOF'
        #!/bin/bash
        path="$1"
        if [ ! -f "$path" ]; then
            mkdir -p "$(dirname "$path")"
            cat > "$path"
            echo "  + wrote $path"
        else
            cat > /dev/null
        fi
        HELPER_EOF
        chmod +x /tmp/write_if_missing
        echo "/tmp" >> $GITHUB_PATH

    - name: Clean stale build cache
      run: rm -rf android/app/.cxx android/app/build/intermediates/cxx 2>/dev/null || true

    # ============================================================
    # 2. Copy vendor
    # ============================================================
    - name: Copy upstream vendor sources
      run: |
        VD=android/app/src/main/cpp/vendor
        mkdir -p $VD/imstudio $VD/imgui $VD/fmt

        for f in ims_generator.cpp ims_generator.h ims_buffer.cpp ims_buffer.h \
                 ims_object.h ims_object.cpp ims_object_draw.cpp; do
            [ -f /tmp/ImStudio/src/sources/$f ] && cp -f /tmp/ImStudio/src/sources/$f $VD/imstudio/
        done
        for f in ims_utils.cpp ims_utils.h; do
            [ -f /tmp/ImStudio/src/utils/$f ] && cp -f /tmp/ImStudio/src/utils/$f $VD/imstudio/
        done

        cp -f /tmp/ImStudio/src/third-party/imgui/imgui*.cpp     $VD/imgui/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/imgui*.h       $VD/imgui/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/imconfig.h     $VD/imgui/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/imstb_*.h      $VD/imgui/ 2>/dev/null || true
        mkdir -p $VD/imgui/misc/cpp
        cp -f /tmp/ImStudio/src/third-party/imgui/misc/cpp/imgui_stdlib.h   $VD/imgui/misc/cpp/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/misc/cpp/imgui_stdlib.cpp $VD/imgui/misc/cpp/ 2>/dev/null || true

        if [ -d /tmp/ImStudio/src/third-party/fmt/include/fmt ]; then
            mkdir -p $VD/fmt/include/fmt
            cp -f /tmp/ImStudio/src/third-party/fmt/include/fmt/*.h $VD/fmt/include/fmt/
        fi

        echo "$UPSTREAM_SHA" > .upstream-commit

    # ============================================================
    # 3. C++ bridge (لاجیک کامل، بدون ساده‌سازی)
    # ============================================================
    - name: Write C++ sources
      run: |
        mkdir -p android/app/src/main/cpp/{include,src/util,src/engine}

        cat > android/app/src/main/cpp/include/jni_bridge.h <<'EOF'
        #pragma once
        #include <string>
        namespace imstudio::engine {
            void init(); void shutdown();
            int  add_widget(const std::string& type);
            bool delete_widget(int id);
            int  get_count(); int  get_id_at(int index);
            std::string get_type(int id); std::string get_label(int id); std::string get_value_s(int id);
            float get_x(int id); float get_y(int id);
            float get_size_x(int id); float get_size_y(int id); float get_width(int id);
            bool set_label(int id, const std::string& v);
            bool set_value_s(int id, const std::string& v);
            bool move(int id, float x, float y);
            bool resize(int id, float sx, float sy);
            bool set_width(int id, float w);
            std::string generate_full_code();
        }
        EOF

        cat > android/app/src/main/cpp/src/util/jstring_util.h <<'EOF'
        #pragma once
        #include <jni.h>
        #include <string>
        namespace imstudio::util {
            inline std::string from_jstring(JNIEnv* env, jstring s) {
                if (!s) return {};
                const char* c = env->GetStringUTFChars(s, nullptr);
                std::string out(c ? c : "");
                env->ReleaseStringUTFChars(s, c);
                return out;
            }
            inline jstring to_jstring(JNIEnv* env, const std::string& s) {
                return env->NewStringUTF(s.c_str());
            }
        }
        EOF

        cat > android/app/src/main/cpp/src/engine/buffer_accessor.h <<'EOF'
        #pragma once
        #include <string>
        namespace imstudio::engine {
            void init(); void shutdown();
            int  add_widget(const std::string& type);
            bool delete_widget(int id);
            int  get_count(); int  get_id_at(int index);
            std::string get_type(int id); std::string get_label(int id); std::string get_value_s(int id);
            float get_x(int id); float get_y(int id);
            float get_size_x(int id); float get_size_y(int id); float get_width(int id);
            bool set_label(int id, const std::string& v);
            bool set_value_s(int id, const std::string& v);
            bool move(int id, float x, float y);
            bool resize(int id, float sx, float sy);
            bool set_width(int id, float w);
        }
        EOF

        cat > android/app/src/main/cpp/src/engine/buffer_accessor.cpp <<'EOF'
        #include "engine/buffer_accessor.h"
        #include "ims_buffer.h"
        #include "ims_object.h"
        #include "imgui.h"
        #include <android/log.h>
        #include <mutex>
        #include <new>
        #include <stdexcept>

        #define LOG_TAG "ImStudioCore"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO,  LOG_TAG, __VA_ARGS__)
        #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

        namespace imstudio::engine {
        static ImStudio::BufferWindow* g_BufferPtr = nullptr;
        static std::mutex g_Mutex;

        static bool ensure_locked() {
            if (ImGui::GetCurrentContext() == nullptr) {
                LOGI("[ensure] Creating ImGui context...");
                IMGUI_CHECKVERSION();
                ImGui::CreateContext();
                if (ImGui::GetCurrentContext() == nullptr) {
                    LOGE("[ensure] FAILED: null context");
                    return false;
                }
                LOGI("[ensure] ImGui context at %p", (void*)ImGui::GetCurrentContext());
            }
            if (g_BufferPtr == nullptr) {
                LOGI("[ensure] Allocating BufferWindow...");
                g_BufferPtr = new (std::nothrow) ImStudio::BufferWindow();
                if (!g_BufferPtr) { LOGE("[ensure] FAILED alloc"); return false; }
                LOGI("[ensure] BufferWindow at %p", (void*)g_BufferPtr);
            }
            return true;
        }

        static ImStudio::BufferWindow& buf() {
            std::lock_guard<std::mutex> lock(g_Mutex);
            if (!ensure_locked()) throw std::runtime_error("engine not initialized");
            return *g_BufferPtr;
        }

        ImStudio::BufferWindow& get_buffer() { return buf(); }

        void init() {
            LOGI("[init] entering");
            auto& b = buf();
            b.objects.clear();
            b.idgen = 0;
            b.selected_obj_id = -1;
            b.staticlayout = false;
            b.objects.reserve(2048);
            LOGI("[init] done size=%zu", b.objects.size());
        }

        void shutdown() {
            LOGI("[shutdown]");
            std::lock_guard<std::mutex> lock(g_Mutex);
            if (g_BufferPtr) { delete g_BufferPtr; g_BufferPtr = nullptr; }
            if (ImGui::GetCurrentContext()) ImGui::DestroyContext();
        }

        static ImStudio::Object* get_obj(int id) { return buf().getobj(id); }

        int add_widget(const std::string& type) {
            LOGI("[add_widget] %s", type.c_str());
            auto& b = buf();
            b.create(type, false);
            return b.objects.empty() ? -1 : b.objects.back().id;
        }
        bool delete_widget(int id) { if (auto* o = get_obj(id)) { o->del(); return true; } return false; }
        int get_count() { return (int)buf().objects.size(); }
        int get_id_at(int i) { auto& b = buf(); if (i<0||i>=(int)b.objects.size()) return -1; return b.objects[i].id; }
        std::string get_type(int id)    { auto* o=get_obj(id); return o?o->type:""; }
        std::string get_label(int id)   { auto* o=get_obj(id); return o?o->label:""; }
        std::string get_value_s(int id) { auto* o=get_obj(id); return o?o->value_s:""; }
        float get_x(int id)      { auto* o=get_obj(id); return o?o->pos.x:0.f; }
        float get_y(int id)      { auto* o=get_obj(id); return o?o->pos.y:0.f; }
        float get_size_x(int id) { auto* o=get_obj(id); return o?o->size.x:0.f; }
        float get_size_y(int id) { auto* o=get_obj(id); return o?o->size.y:0.f; }
        float get_width(int id)  { auto* o=get_obj(id); return o?o->width:0.f; }
        bool set_label(int id, const std::string& v)   { auto* o=get_obj(id); if(!o)return false; o->label=v; return true; }
        bool set_value_s(int id, const std::string& v) { auto* o=get_obj(id); if(!o)return false; o->value_s=v; return true; }
        bool move(int id, float x, float y)            { auto* o=get_obj(id); if(!o)return false; o->pos.x=x; o->pos.y=y; return true; }
        bool resize(int id, float sx, float sy)        { auto* o=get_obj(id); if(!o)return false; o->size.x=sx; o->size.y=sy; return true; }
        bool set_width(int id, float w)                { auto* o=get_obj(id); if(!o)return false; o->width=w; return true; }
        }
        EOF

        cat > android/app/src/main/cpp/src/engine/code_generator.h <<'EOF'
        #pragma once
        #include <string>
        namespace imstudio::engine { std::string generate_full_code(); }
        EOF

        cat > android/app/src/main/cpp/src/engine/code_generator.cpp <<'EOF'
        #include "engine/code_generator.h"
        #include "ims_buffer.h"
        #include "ims_generator.h"
        #include "ims_object.h"
        #include <sstream>
        #include <android/log.h>
        #define LOG_TAG "ImStudioCore"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

        namespace imstudio::engine { ImStudio::BufferWindow& get_buffer(); }

        namespace imstudio::engine {
        std::string generate_full_code() {
            LOGI("[gen] entering");
            auto& g = get_buffer();
            std::ostringstream out;
            out << "// Generated by ImStudio (Android)\n#include \"imgui.h\"\n\n";
            for (auto& o : g.objects) {
                if (o.type=="checkbox")     out << "static bool c1" << o.id << " = false;\n";
                else if (o.type=="radio")   out << "static bool r1" << o.id << " = false;\n";
                else if (o.type=="combo"||o.type=="listbox")
                    out << "static const char* items" << o.id << "[] = { \"Item 1\", \"Item 2\" };\n";
                else if (o.type=="sliderfloat"||o.type=="dragfloat")
                    out << "static float f1" << o.id << " = 0.0f;\n";
                else if (o.type=="sliderint"||o.type=="dragint")
                    out << "static int i1" << o.id << " = 0;\n";
                else if (o.type=="textinput")  out << "static char buf" << o.id << "[128] = \"\";\n";
                else if (o.type=="inputint")   out << "static int in1" << o.id << " = 0;\n";
                else if (o.type=="inputfloat") out << "static float inf1" << o.id << " = 0.0f;\n";
            }
            out << "\nvoid RenderUI() {\n";
            for (auto& o : g.objects) {
                std::string s;
                ImStudio::Recreate(o, &s, g.staticlayout);
                out << s;
            }
            out << "}\n";
            LOGI("[gen] %zu bytes", out.str().size());
            return out.str();
        }
        }
        EOF

        cat > android/app/src/main/cpp/src/engine/crash_handler.cpp <<'EOF'
        #include <jni.h>
        #include <signal.h>
        #include <unistd.h>
        #include <fcntl.h>
        #include <time.h>
        #include <string.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <unwind.h>
        #include <dlfcn.h>
        #include <cxxabi.h>
        #include <android/log.h>
        #define LOG_TAG "ImStudioCrash"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

        static char g_CrashDir[512] = {0};

        struct BtState { void** current; void** end; };
        static _Unwind_Reason_Code unwind_cb(struct _Unwind_Context* ctx, void* arg) {
            BtState* s = static_cast<BtState*>(arg);
            uintptr_t pc = _Unwind_GetIP(ctx);
            if (pc) { if (s->current==s->end) return _URC_END_OF_STACK; *s->current++ = reinterpret_cast<void*>(pc); }
            return _URC_NO_REASON;
        }
        static int capture_bt(void** b, int max) { BtState s = {b, b+max}; _Unwind_Backtrace(unwind_cb, &s); return (int)(s.current - b); }

        static void write_crash(int sig, siginfo_t* info, void*) {
            if (g_CrashDir[0]==0) return;
            char path[700]; time_t now = time(nullptr);
            snprintf(path, sizeof(path), "%s/native_crash_%ld_sig%d.log", g_CrashDir, (long)now, sig);
            int fd = open(path, O_WRONLY|O_CREAT|O_TRUNC, 0644);
            if (fd < 0) return;
            char buf[512];
            int n = snprintf(buf, sizeof(buf), "=== Native crash ===\nSignal: %d (%s)\nTime: %ld\n\n",
                             sig, strsignal(sig), (long)now);
            write(fd, buf, n);
            void* frames[64]; int count = capture_bt(frames, 64);
            n = snprintf(buf, sizeof(buf), "Backtrace (%d frames):\n", count); write(fd, buf, n);
            for (int i = 0; i < count; i++) {
                Dl_info dl;
                if (dladdr(frames[i], &dl) && dl.dli_sname) {
                    int status=0;
                    char* dm = abi::__cxa_demangle(dl.dli_sname, nullptr, nullptr, &status);
                    const char* name = (status==0 && dm) ? dm : dl.dli_sname;
                    n = snprintf(buf, sizeof(buf), "  #%02d %p %s (%s)\n", i, frames[i], name, dl.dli_fname?dl.dli_fname:"?");
                    if (dm) free(dm);
                } else n = snprintf(buf, sizeof(buf), "  #%02d %p\n", i, frames[i]);
                write(fd, buf, n);
            }
            close(fd);
        }
        static void handler(int sig, siginfo_t* info, void* uc) {
            write_crash(sig, info, uc);
            signal(sig, SIG_DFL);
            raise(sig);
        }
        extern "C" JNIEXPORT void JNICALL
        Java_com_raais_imstudio_NativeBridge_initCrashHandler(JNIEnv* env, jobject, jstring dir) {
            if (!dir) return;
            const char* c = env->GetStringUTFChars(dir, nullptr);
            strncpy(g_CrashDir, c, sizeof(g_CrashDir)-1);
            g_CrashDir[sizeof(g_CrashDir)-1] = 0;
            env->ReleaseStringUTFChars(dir, c);
            static char alt[64*1024];
            stack_t ss; ss.ss_sp = alt; ss.ss_size = sizeof(alt); ss.ss_flags = 0;
            sigaltstack(&ss, nullptr);
            struct sigaction sa; memset(&sa, 0, sizeof(sa));
            sa.sa_sigaction = handler; sa.sa_flags = SA_SIGINFO | SA_ONSTACK;
            sigemptyset(&sa.sa_mask);
            int sigs[] = {SIGSEGV, SIGABRT, SIGFPE, SIGILL, SIGBUS, SIGTRAP};
            for (int s : sigs) sigaction(s, &sa, nullptr);
            LOGI("Crash handler installed: %s", g_CrashDir);
        }
        EOF

        cat > android/app/src/main/cpp/src/jni_bridge.cpp <<'EOF'
        #include <jni.h>
        #include "jni_bridge.h"
        #include "engine/buffer_accessor.h"
        #include "engine/code_generator.h"
        #include "util/jstring_util.h"
        #include <android/log.h>
        #include <exception>
        #include <stdexcept>
        #define LOG_TAG "ImStudioJNI"
        #define LOGI(...) __android_log_print(ANDROID_LOG_INFO,  LOG_TAG, __VA_ARGS__)
        #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)
        using namespace imstudio::engine;
        using imstudio::util::from_jstring;
        using imstudio::util::to_jstring;

        static void throw_runtime(JNIEnv* env, const char* msg) {
            if (env->ExceptionCheck()) return;
            jclass c = env->FindClass("java/lang/RuntimeException");
            if (c) env->ThrowNew(c, msg);
        }
        #define TRY try {
        #define CATCH(env) } catch (const std::exception& e) { \
            LOGE("C++ ex: %s", e.what()); throw_runtime((env), e.what()); \
        } catch (...) { throw_runtime((env), "Unknown C++ exception"); }

        extern "C" {
        JNIEXPORT jint JNI_OnLoad(JavaVM*, void*) {
            LOGI("========== JNI_OnLoad ==========");
            try { imstudio::engine::init(); LOGI("JNI_OnLoad init OK"); }
            catch (const std::exception& e) { LOGE("JNI_OnLoad init FAILED: %s", e.what()); }
            catch (...) { LOGE("JNI_OnLoad init FAILED (unknown)"); }
            return JNI_VERSION_1_6;
        }
        JNIEXPORT void JNI_OnUnload(JavaVM*, void*) {
            try { imstudio::engine::shutdown(); } catch (...) {}
        }
        JNIEXPORT void JNICALL Java_com_raais_imstudio_NativeBridge_initBuffer(JNIEnv* env, jobject) {
            LOGI("[JNI] initBuffer"); TRY imstudio::engine::init(); CATCH(env)
        }
        JNIEXPORT void JNICALL Java_com_raais_imstudio_NativeBridge_shutdown(JNIEnv* env, jobject) {
            TRY imstudio::engine::shutdown(); CATCH(env)
        }
        JNIEXPORT jint JNICALL Java_com_raais_imstudio_NativeBridge_createWidget(JNIEnv* env, jobject, jstring t) {
            TRY return add_widget(from_jstring(env, t)); CATCH(env) return -1;
        }
        JNIEXPORT jboolean JNICALL Java_com_raais_imstudio_NativeBridge_deleteWidget(JNIEnv* env, jobject, jint id) {
            TRY return delete_widget(id) ? JNI_TRUE : JNI_FALSE; CATCH(env) return JNI_FALSE;
        }
        JNIEXPORT jint JNICALL Java_com_raais_imstudio_NativeBridge_getWidgetCount(JNIEnv* env, jobject) {
            TRY return get_count(); CATCH(env) return 0;
        }
        JNIEXPORT jint JNICALL Java_com_raais_imstudio_NativeBridge_getWidgetId(JNIEnv* env, jobject, jint i) {
            TRY return get_id_at(i); CATCH(env) return -1;
        }
        JNIEXPORT jstring JNICALL Java_com_raais_imstudio_NativeBridge_getWidgetType(JNIEnv* env, jobject, jint id) {
            TRY return to_jstring(env, get_type(id)); CATCH(env) return env->NewStringUTF("");
        }
        JNIEXPORT jstring JNICALL Java_com_raais_imstudio_NativeBridge_getWidgetLabel(JNIEnv* env, jobject, jint id) {
            TRY return to_jstring(env, get_label(id)); CATCH(env) return env->NewStringUTF("");
        }
        JNIEXPORT jstring JNICALL Java_com_raais_imstudio_NativeBridge_getWidgetValueS(JNIEnv* env, jobject, jint id) {
            TRY return to_jstring(env, get_value_s(id)); CATCH(env) return env->NewStringUTF("");
        }
        JNIEXPORT jfloat JNICALL Java_com_raais_imstudio_NativeBridge_getWidgetX(JNIEnv* env, jobject, jint id) {
            TRY return get_x(id); CATCH(env) return 0.f;
        }
        JNIEXPORT jfloat JNICALL Java_com_raais_imstudio_NativeBridge_getWidgetY(JNIEnv* env, jobject, jint id) {
            TRY return get_y(id); CATCH(env) return 0.f;
        }
        JNIEXPORT jfloat JNICALL Java_com_raais_imstudio_NativeBridge_getWidgetSizeX(JNIEnv* env, jobject, jint id) {
            TRY return get_size_x(id); CATCH(env) return 0.f;
        }
        JNIEXPORT jfloat JNICALL Java_com_raais_imstudio_NativeBridge_getWidgetSizeY(JNIEnv* env, jobject, jint id) {
            TRY return get_size_y(id); CATCH(env) return 0.f;
        }
        JNIEXPORT jfloat JNICALL Java_com_raais_imstudio_NativeBridge_getWidgetWidth(JNIEnv* env, jobject, jint id) {
            TRY return get_width(id); CATCH(env) return 0.f;
        }
        JNIEXPORT jboolean JNICALL Java_com_raais_imstudio_NativeBridge_setWidgetLabel(JNIEnv* env, jobject, jint id, jstring v) {
            TRY return set_label(id, from_jstring(env, v)) ? JNI_TRUE : JNI_FALSE; CATCH(env) return JNI_FALSE;
        }
        JNIEXPORT jboolean JNICALL Java_com_raais_imstudio_NativeBridge_setWidgetValueS(JNIEnv* env, jobject, jint id, jstring v) {
            TRY return set_value_s(id, from_jstring(env, v)) ? JNI_TRUE : JNI_FALSE; CATCH(env) return JNI_FALSE;
        }
        JNIEXPORT jboolean JNICALL Java_com_raais_imstudio_NativeBridge_moveWidget(JNIEnv* env, jobject, jint id, jfloat x, jfloat y) {
            TRY return move(id, x, y) ? JNI_TRUE : JNI_FALSE; CATCH(env) return JNI_FALSE;
        }
        JNIEXPORT jboolean JNICALL Java_com_raais_imstudio_NativeBridge_resizeWidget(JNIEnv* env, jobject, jint id, jfloat sx, jfloat sy) {
            TRY return resize(id, sx, sy) ? JNI_TRUE : JNI_FALSE; CATCH(env) return JNI_FALSE;
        }
        JNIEXPORT jboolean JNICALL Java_com_raais_imstudio_NativeBridge_setWidgetWidth(JNIEnv* env, jobject, jint id, jfloat w) {
            TRY return set_width(id, w) ? JNI_TRUE : JNI_FALSE; CATCH(env) return JNI_FALSE;
        }
        JNIEXPORT jstring JNICALL Java_com_raais_imstudio_NativeBridge_generateCode(JNIEnv* env, jobject) {
            TRY return to_jstring(env, generate_full_code()); CATCH(env) return env->NewStringUTF("// error");
        }
        }
        EOF

    # ============================================================
    # 4. CMakeLists (IM_ASSERT via -include)
    # ============================================================
    - name: Write CMakeLists.txt
      run: |
        cat > android/app/src/main/cpp/CMakeLists.txt <<'CMAKE'
        cmake_minimum_required(VERSION 3.22)
        project(imstudio_core)
        set(CMAKE_CXX_STANDARD 17)

        set(IMASSERT_HDR "${CMAKE_CURRENT_BINARY_DIR}/imassert_override.h")
        file(WRITE "${IMASSERT_HDR}"
            "#pragma once\n#undef IM_ASSERT\n#define IM_ASSERT(_EXPR) ((void)0)\n")

        add_library(imgui STATIC
            vendor/imgui/imgui.cpp
            vendor/imgui/imgui_draw.cpp
            vendor/imgui/imgui_tables.cpp
            vendor/imgui/imgui_widgets.cpp
            vendor/imgui/imgui_demo.cpp
            vendor/imgui/misc/cpp/imgui_stdlib.cpp
        )
        target_include_directories(imgui PUBLIC vendor/imgui vendor/imgui/misc/cpp)
        target_compile_options(imgui PUBLIC "-include" "${IMASSERT_HDR}")

        add_library(fmt INTERFACE)
        target_include_directories(fmt INTERFACE vendor/fmt/include)
        target_compile_definitions(fmt INTERFACE FMT_HEADER_ONLY=1)

        set(IMS_SOURCES
            vendor/imstudio/ims_generator.cpp
            vendor/imstudio/ims_buffer.cpp
            vendor/imstudio/ims_object.cpp
        )
        if(EXISTS ${CMAKE_CURRENT_SOURCE_DIR}/vendor/imstudio/ims_object_draw.cpp)
            list(APPEND IMS_SOURCES vendor/imstudio/ims_object_draw.cpp)
        endif()
