            ImGui::Spacing();

            // 4-way pad: grid [up / focus] then [left / right / down]
            float bw = 56, bh = 34;
            ImGui::BeginGroup();
            {
                ImGui::SetCursorPosX(ImGui::GetCursorPosX() + bw + 8);
                if (ImGui::Button("Up", ImVec2(bw, bh))) { /* up = to parent */ MoveSelParent(); }
                ImGui::SameLine(0, 8);
                if (ImGui::Button("Focus ©", ImVec2(bw + 20, bh))) { /* cycle layers */ static int k = 0; Node* n = g_ed.SelNode(); if (n) { k = (k + 1) % ImMax((int)n->children.size(), 1); if (!n->children.empty()) g_ed.sel = n->children[k]->id; } }
                ImGui::SetCursorPosX(ImGui::GetCursorPosX());
