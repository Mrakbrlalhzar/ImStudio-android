name: Fix gradlew wrapper and build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Install NDK
      run: |
        echo "y" | sdkmanager --install "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    # ★ FIX: generate wrapper BEFORE building
    - name: Generate Gradle wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.4

    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon

    # ★ Also commit the generated wrapper so future builds work
    - name: Commit gradle wrapper (so future runs work)
      run: |
        git config user.name "ImGui Engine Bot"
        git config user.email "bot@imgui-engine.local"
        git add -A
        if git diff --staged --quiet; then
          echo "Nothing new to commit"
        else
          git commit -m "chore: add gradle wrapper files [skip ci]"
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ImGui-Visual-Engine
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
