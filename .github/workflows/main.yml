    # ============================================================
    # 7. Docs & .gitignore
    # ============================================================
    - name: Generate docs and gitignore
      run: |
        write_if_missing .gitignore <<'EOF'
        *.iml
        .gradle/
        .idea/
        local.properties
        .DS_Store
        build/
        captures/
        .externalNativeBuild/
        .cxx/
        *.apk
        *.aab
        android/app/build/
        android/build/
        android/app/.cxx/
        *.log
        EOF
        write_if_missing README.md <<'EOF'
        # ImStudio Android
        Native Android port of Raais/ImStudio with Jetpack Compose UI.
        EOF
      shell: bash

    # ============================================================
    # 8. Commit & push
    # ============================================================
    - name: Commit and push to your repo
      run: |
        git config user.name "ImStudio Sync Bot"
        git config user.email "bot@imstudio.local"
        git add -A
        if git diff --staged --quiet; then
          echo "Nothing to commit."
        else
          git commit -m "fix(android): full ImGui lifecycle + IM_ASSERT noop + JNI_OnLoad (sync @ ${UPSTREAM_SHA})"
          git push
          echo "✓ Pushed"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ============================================================
    # 9. Build APK
    # ============================================================
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK (without NDK)
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Install Android NDK 26.1.10909125
      run: |
        echo "y" | sdkmanager --install "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: |
        cd android
        gradle wrapper --gradle-version 8.4
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ImStudio-Android-${{ env.UPSTREAM_SHA }}
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
