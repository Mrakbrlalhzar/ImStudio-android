        cat > android/app/src/main/java/com/raais/imstudio/ui/DesignCanvas.kt <<'EOF'
        package com.raais.imstudio.ui

        import androidx.compose.foundation.background
        import androidx.compose.foundation.gestures.detectDragGestures
        import androidx.compose.foundation.gestures.detectTapGestures
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material3.Text
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.geometry.Offset
        import androidx.compose.ui.geometry.Size
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.drawscope.DrawScope
        import androidx.compose.ui.graphics.drawscope.Stroke
        import androidx.compose.ui.input.pointer.pointerInput
        import androidx.compose.ui.text.style.TextOverflow
        import androidx.compose.ui.unit.dp
        import com.raais.imstudio.engine.ImStudioState
        import com.raais.imstudio.model.Widget

        @Composable
        fun DesignCanvas(
            state: ImStudioState,
            onSelect: (Int?) -> Unit,
            onLongPress: (Int) -> Unit
        ) {
            Box(
                modifier = Modifier
                    .fillMaxSize()
                    .background(Color(0xFF121212))
                    .pointerInput(Unit) {
                        detectTapGestures(onTap = { onSelect(null) })
                    }
            ) {
                // Grid background
                androidx.compose.foundation.Canvas(modifier = Modifier.fillMaxSize()) {
                    drawGrid(Color(0xFF1F1F1F), 24f)
                }

                state.widgets.forEach { widget ->
                    WidgetItem(
                        widget = widget,
                        isSelected = state.selectedId.value == widget.id,
                        onSelect = { onSelect(widget.id) },
                        onLongPress = { onLongPress(widget.id) },
                        onMove = { dx, dy ->
                            state.moveWidget(widget.id, widget.x + dx, widget.y + dy)
                        }
                    )
                }
            }
        }

        private fun DrawScope.drawGrid(color: Color, step: Float) {
            var x = 0f
            while (x < size.width) {
                drawLine(color, Offset(x, 0f), Offset(x, size.height), strokeWidth = 1f)
                x += step
            }
            var y = 0f
            while (y < size.height) {
                drawLine(color, Offset(0f, y), Offset(size.width, y), strokeWidth = 1f)
                y += step
            }
        }

        @Composable
        private fun WidgetItem(
            widget: Widget,
            isSelected: Boolean,
            onSelect: () -> Unit,
            onLongPress: () -> Unit,
            onMove: (Float, Float) -> Unit
        ) {
            var dragOffset by remember(widget.id) { mutableStateOf(Offset.Zero) }
            val w = if (widget.sizeX > 0f) widget.sizeX.dp else widget.width.dp
            val h = if (widget.sizeY > 0f) widget.sizeY.dp else 36.dp

            Box(
                modifier = Modifier
                    .offset(
                        x = (widget.x + dragOffset.x).dp,
                        y = (widget.y + dragOffset.y).dp
                    )
                    .size(width = w, height = h)
                    .clip(RoundedCornerShape(6.dp))
                    .background(
                        if (isSelected) Color(0xFF4A90D9) else Color(0xFF2C2C2C)
                    )
                    .pointerInput(widget.id) {
                        detectDragGestures(
                            onDragStart = { onSelect() },
                            onDrag = { change, drag ->
                                change.consume()
                                dragOffset += drag
                            },
                            onDragEnd = {
                                onMove(dragOffset.x, dragOffset.y)
                                dragOffset = Offset.Zero
                            }
                        )
                    }
                    .pointerInput(widget.id) {
                        detectTapGestures(onLongPress = { onLongPress() })
                    },
                contentAlignment = Alignment.Center
            ) {
                Text(
                    text = widget.displayText,
                    color = Color(0xFFE0E0E0),
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis,
                    modifier = Modifier.padding(horizontal = 8.dp)
                )

                if (isSelected) {
                    androidx.compose.foundation.Canvas(
                        modifier = Modifier.matchParentSize()
                    ) {
                        drawRect(
                            color = Color(0xFF6DB3F2),
                            size = Size(size.width, size.height),
                            style = Stroke(width = 3f)
                        )
                    }
                }
            }
        }
        EOF

