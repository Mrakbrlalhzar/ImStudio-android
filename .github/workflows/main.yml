        // ---------------------------------------------------------------------------
        // Bottom box: 4-way d-pad (left/right/up/down/focus) + tree ops.
        // ---------------------------------------------------------------------------
        static void MoveSelSibling(int delta)
        {
            Node* n = g_ed.SelNode();
            if (!n || !n->parent) return;
            int i = Node_IndexInParent(n) + delta;
            if (i >= 0 && i < (int)n->parent->children.size()) g_ed.sel = n->parent->children[i]->id;
        }
        static void MoveSelParent()
        {
            Node* n = g_ed.SelNode();
            if (n && n->parent) g_ed.sel = n->parent->id;
        }
        static void MoveSelFirstChild()
        {
            Node* n = g_ed.SelNode();
            if (n && !n->children.empty()) g_ed.sel = n->children[0]->id;
        }

        static void DrawBottomBox()
        {
            ImGuiIO& io = ImGui::GetIO();
            float h = 110;
            ImGui::SetNextWindowPos(ImVec2(0, io.DisplaySize.y - h), ImGuiCond_Always);
            ImGui::SetNextWindowSize(ImVec2(io.DisplaySize.x, h), ImGuiCond_Always);
            ImGui::Begin("Bottom", nullptr, ImGuiWindowFlags_NoTitleBar | ImGuiWindowFlags_NoResize | ImGuiWindowFlags_NoMove | ImGuiWindowFlags_NoSavedSettings | ImGuiWindowFlags_NoScrollbar);
