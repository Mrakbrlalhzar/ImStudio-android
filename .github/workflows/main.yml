        // Resolve a fully-qualified ImGui flag/enum name (e.g. "ImGuiWindowFlags_NoResize")
        // to its value. Returns false if unknown.
        inline bool ImGuiEdResolveName(const char* q, int& out_val)
        {
            int n = 0;
            const FlagGroup* gs = AllFlagGroups(n);
            for (int gi = 0; gi < n; gi++)
            {
                int m = 0;
                const FlagDef* d = gs[gi].fn(m);
                for (int i = 0; i < m; i++)
                    if (strcmp(d[i].name, q) == 0) { out_val = d[i].value; return true; }
            }
            return false;
        }


