        // ---------------------------------------------------------------------------
        // Dock animation state
        // ---------------------------------------------------------------------------
        struct DockAnim
        {
            float open = 0.0f;   // 0..1
            bool  want = false;
        };
        static DockAnim g_dockPalette, g_dockInspector, g_dockConsole;

        static void AnimDock(DockAnim& d, bool want_open, float dt)
        {
            d.want = want_open;
            float target = want_open ? 1.0f : 0.0f;
            float speed = 7.0f * dt;
            if (d.open < target) d.open = ImMin(d.open + speed, target);
            else if (d.open > target) d.open = ImMax(d.open - speed, target);
        }

