name: ImStudio Android — Sync & Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write

jobs:
  sync-generate-build:
    runs-on: ubuntu-latest
    steps:
    # ============================================================
    # 1. بررسی و کلون
    # ============================================================
    - name: Checkout target repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Clone upstream ImStudio (read-only reference)
      run: |
        git clone --depth 1 https://github.com/Raais/ImStudio /tmp/ImStudio
        UPSTREAM_SHA=$(cd /tmp/ImStudio && git rev-parse --short HEAD)
        echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> $GITHUB_ENV
        echo "Syncing from upstream commit $UPSTREAM_SHA"
        echo "→ Available sources:"
        ls -1 /tmp/ImStudio/src/sources/ | head -40

    - name: Prepare helper
      run: |
        cat > /tmp/write_if_missing <<'HELPER_EOF'
        #!/bin/bash
        # Usage: write_if_missing <path>
        # Reads stdin, writes to file only if it doesn't exist. Drains stdin otherwise.
        path="$1"
        if [ ! -f "$path" ]; then
            mkdir -p "$(dirname "$path")"
            cat > "$path"
            echo "  + wrote $path"
        else
            cat > /dev/null
        fi
        HELPER_EOF
        chmod +x /tmp/write_if_missing
        echo "/tmp" >> $GITHUB_PATH

    - name: Verify helper is on PATH
      run: |
        which write_if_missing || echo "NOT FOUND"
        echo "PATH=$PATH"

    # ============================================================
    # 2. کپی vendor (همیشه overwrite، همگام با upstream)
    # ============================================================
    - name: Copy upstream vendor sources
      run: |
        VD=android/app/src/main/cpp/vendor
        mkdir -p $VD/imstudio $VD/imgui $VD/fmt

        echo "→ Copying imstudio core..."
        cp -f /tmp/ImStudio/src/sources/ims_generator.cpp $VD/imstudio/
        cp -f /tmp/ImStudio/src/sources/ims_generator.h   $VD/imstudio/
        cp -f /tmp/ImStudio/src/sources/ims_buffer.cpp    $VD/imstudio/
        cp -f /tmp/ImStudio/src/sources/ims_buffer.h      $VD/imstudio/
        cp -f /tmp/ImStudio/src/sources/ims_object.h      $VD/imstudio/

        # ★ Fix 1: ims_object.cpp باید کپی و کامپایل بشه
        if [ -f /tmp/ImStudio/src/sources/ims_object.cpp ]; then
            cp -f /tmp/ImStudio/src/sources/ims_object.cpp $VD/imstudio/
            echo "  + copied ims_object.cpp"
        else
            echo "  ! ims_object.cpp not found upstream — will patch later"
        fi

        [ -f /tmp/ImStudio/src/utils/ims_utils.cpp ] && cp -f /tmp/ImStudio/src/utils/ims_utils.cpp $VD/imstudio/ || true
        [ -f /tmp/ImStudio/src/utils/ims_utils.h ]   && cp -f /tmp/ImStudio/src/utils/ims_utils.h   $VD/imstudio/ || true

        echo "→ Copying ImGui core (incl. demo)..."
        cp -f /tmp/ImStudio/src/third-party/imgui/imgui*.cpp     $VD/imgui/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/imgui*.h       $VD/imgui/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/imconfig.h     $VD/imgui/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/imstb_*.h      $VD/imgui/ 2>/dev/null || true
        [ -f /tmp/ImStudio/src/third-party/imgui/LICENSE.txt ] && cp -f /tmp/ImStudio/src/third-party/imgui/LICENSE.txt $VD/imgui/ || true

        echo "→ Copying ImGui misc/cpp (imgui_stdlib)..."
        mkdir -p $VD/imgui/misc/cpp
        cp -f /tmp/ImStudio/src/third-party/imgui/misc/cpp/imgui_stdlib.h   $VD/imgui/misc/cpp/ 2>/dev/null || true
        cp -f /tmp/ImStudio/src/third-party/imgui/misc/cpp/imgui_stdlib.cpp $VD/imgui/misc/cpp/ 2>/dev/null || true

        echo "→ Copying fmt (header-only)..."
        if [ -d /tmp/ImStudio/src/third-party/fmt/include/fmt ]; then
            mkdir -p $VD/fmt/include/fmt
            cp -f /tmp/ImStudio/src/third-party/fmt/include/fmt/*.h $VD/fmt/include/fmt/
        fi
        if [ -f /tmp/ImStudio/src/third-party/fmt/LICENSE.rst ]; then
            cp -f /tmp/ImStudio/src/third-party/fmt/LICENSE.rst $VD/fmt/
        fi

        echo "→ Writing provenance..."
        echo "$UPSTREAM_SHA" > .upstream-commit

        ls -R $VD | head -30

    # ============================================================
    # 3. C++ bridge (تقسیم‌شده به فایل‌های مستقل)
    # ============================================================
    - name: Generate C++ bridge sources
      run: |
        write_if_missing android/app/src/main/cpp/include/jni_bridge.h <<'EOF'
        #pragma once
        // Public C++ API consumed by jni_bridge.cpp.
        #include <string>

        namespace imstudio::engine {
            void init();
            int  add_widget(const std::string& type);
            bool delete_widget(int id);
            int  get_count();
            int  get_id_at(int index);
            std::string get_type(int id);
            std::string get_label(int id);
            std::string get_value_s(int id);
            float get_x(int id);
            float get_y(int id);
            float get_size_x(int id);
            float get_size_y(int id);
            float get_width(int id);
            bool set_label(int id, const std::string& v);
            bool set_value_s(int id, const std::string& v);
            bool move(int id, float x, float y);
            bool resize(int id, float sx, float sy);
            bool set_width(int id, float w);
            std::string generate_full_code();
        }
        EOF

        write_if_missing android/app/src/main/cpp/src/util/jstring_util.h <<'EOF'
        #pragma once
        #include <jni.h>
        #include <string>

        namespace imstudio::util {
            inline std::string from_jstring(JNIEnv* env, jstring s) {
                if (!s) return {};
                const char* c = env->GetStringUTFChars(s, nullptr);
                std::string out(c ? c : "");
                env->ReleaseStringUTFChars(s, c);
                return out;
            }
            inline jstring to_jstring(JNIEnv* env, const std::string& s) {
                return env->NewStringUTF(s.c_str());
            }
        }
        EOF

        write_if_missing android/app/src/main/cpp/src/engine/buffer_accessor.h <<'EOF'
        #pragma once
        #include <string>

        namespace imstudio::engine {
            void init();
            int  add_widget(const std::string& type);
            bool delete_widget(int id);
            int  get_count();
            int  get_id_at(int index);
            std::string get_type(int id);
            std::string get_label(int id);
            std::string get_value_s(int id);
            float get_x(int id);
            float get_y(int id);
            float get_size_x(int id);
            float get_size_y(int id);
            float get_width(int id);
            bool set_label(int id, const std::string& v);
            bool set_value_s(int id, const std::string& v);
            bool move(int id, float x, float y);
            bool resize(int id, float sx, float sy);
            bool set_width(int id, float w);
        }
        EOF

        write_if_missing android/app/src/main/cpp/src/engine/buffer_accessor.cpp <<'EOF'
        #include "engine/buffer_accessor.h"
        #include "ims_buffer.h"
        #include "ims_object.h"

        namespace imstudio::engine {

        // ★ بدون static تا code_generator.cpp بتونه extern کنه
        ImStudio::BufferWindow g_Buffer;

        static ImStudio::Object* get_obj(int id) {
            return g_Buffer.getobj(id);
        }

        void init() {
            g_Buffer.objects.clear();
            g_Buffer.idgen = 0;
            g_Buffer.selected_obj_id = -1;
            g_Buffer.staticlayout = false;
            g_Buffer.objects.reserve(2048);
        }

        int add_widget(const std::string& type) {
            g_Buffer.create(type, false);
            return g_Buffer.objects.empty() ? -1 : g_Buffer.objects.back().id;
        }

        bool delete_widget(int id) {
            if (auto* o = get_obj(id)) { o->del(); return true; }
            return false;
        }

        int get_count() { return (int)g_Buffer.objects.size(); }

        int get_id_at(int index) {
            if (index < 0 || index >= (int)g_Buffer.objects.size()) return -1;
            return g_Buffer.objects[index].id;
        }

        std::string get_type(int id) {
            auto* o = get_obj(id);
            return o ? o->type : "";
        }
        std::string get_label(int id) {
            auto* o = get_obj(id);
            return o ? o->label : "";
        }
        std::string get_value_s(int id) {
            auto* o = get_obj(id);
            return o ? o->value_s : "";
        }
        float get_x(int id)       { auto* o = get_obj(id); return o ? o->pos.x : 0.f; }
        float get_y(int id)       { auto* o = get_obj(id); return o ? o->pos.y : 0.f; }
        float get_size_x(int id)  { auto* o = get_obj(id); return o ? o->size.x : 0.f; }
        float get_size_y(int id)  { auto* o = get_obj(id); return o ? o->size.y : 0.f; }
        float get_width(int id)   { auto* o = get_obj(id); return o ? o->width : 0.f; }

        bool set_label(int id, const std::string& v) {
            auto* o = get_obj(id); if (!o) return false; o->label = v; return true;
        }
        bool set_value_s(int id, const std::string& v) {
            auto* o = get_obj(id); if (!o) return false; o->value_s = v; return true;
        }
        bool move(int id, float x, float y) {
            auto* o = get_obj(id); if (!o) return false;
            o->pos.x = x; o->pos.y = y; return true;
        }
        bool resize(int id, float sx, float sy) {
            auto* o = get_obj(id); if (!o) return false;
            o->size.x = sx; o->size.y = sy; return true;
        }
        bool set_width(int id, float w) {
            auto* o = get_obj(id); if (!o) return false; o->width = w; return true;
        }

        } // namespace imstudio::engine
        EOF

        write_if_missing android/app/src/main/cpp/src/engine/code_generator.h <<'EOF'
        #pragma once
        #include <string>

        namespace imstudio::engine {
            std::string generate_full_code();
        }
        EOF

        write_if_missing android/app/src/main/cpp/src/engine/code_generator.cpp <<'EOF'
        #include "engine/code_generator.h"
        #include "ims_buffer.h"
        #include "ims_generator.h"
        #include "ims_object.h"
        #include <sstream>

        // ★ Fix 3: extern داخل namespace imstudio::engine (نه global)
        namespace imstudio::engine {
            extern ImStudio::BufferWindow g_Buffer;
        }

        namespace imstudio::engine {

        std::string generate_full_code() {
            std::ostringstream out;
            out << "// Generated by ImStudio (Android)\n";
            out << "// Upstream: Raais/ImStudio\n\n";
            out << "#include \"imgui.h\"\n\n";

            for (auto& obj : g_Buffer.objects) {
                if (obj.type == "checkbox") {
                    out << "static bool c1" << obj.id << " = false;\n";
                } else if (obj.type == "radio") {
                    out << "static bool r1" << obj.id << " = false;\n";
                } else if (obj.type == "combo" || obj.type == "listbox") {
                    out << "static const char* items" << obj.id
                        << "[] = { \"Item 1\", \"Item 2\", \"Item 3\" };\n";
                } else if (obj.type == "sliderfloat" || obj.type == "dragfloat") {
                    out << "static float f1" << obj.id << " = 0.0f;\n";
                } else if (obj.type == "sliderint" || obj.type == "dragint") {
                    out << "static int i1" << obj.id << " = 0;\n";
                } else if (obj.type == "textinput") {
                    out << "static char buf" << obj.id << "[128] = \"\";\n";
                } else if (obj.type == "inputint") {
                    out << "static int in1" << obj.id << " = 0;\n";
                } else if (obj.type == "inputfloat") {
                    out << "static float inf1" << obj.id << " = 0.0f;\n";
                }
            }
            out << "\nvoid RenderUI() {\n";

            for (auto& obj : g_Buffer.objects) {
                std::string snippet;
                ImStudio::Recreate(obj, &snippet, g_Buffer.staticlayout);
                out << snippet;
            }

            out << "}\n";
            return out.str();
        }

        } // namespace imstudio::engine
        EOF

        write_if_missing android/app/src/main/cpp/src/jni_bridge.cpp <<'EOF'
        #include <jni.h>
        #include "jni_bridge.h"
        #include "engine/buffer_accessor.h"
        #include "engine/code_generator.h"
        #include "util/jstring_util.h"

        using namespace imstudio;
        using namespace imstudio::engine;
        using imstudio::util::from_jstring;
        using imstudio::util::to_jstring;

        extern "C" {

        JNIEXPORT void JNICALL
        Java_com_raais_imstudio_NativeBridge_initBuffer(JNIEnv*, jobject) {
            imstudio::engine::init();
        }

        JNIEXPORT jint JNICALL
        Java_com_raais_imstudio_NativeBridge_createWidget(JNIEnv* env, jobject, jstring type) {
            return add_widget(from_jstring(env, type));
        }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_deleteWidget(JNIEnv*, jobject, jint id) {
            return delete_widget(id) ? JNI_TRUE : JNI_FALSE;
        }

        JNIEXPORT jint JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetCount(JNIEnv*, jobject) {
            return get_count();
        }

        JNIEXPORT jint JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetId(JNIEnv*, jobject, jint i) {
            return get_id_at(i);
        }

        JNIEXPORT jstring JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetType(JNIEnv* env, jobject, jint id) {
            return to_jstring(env, get_type(id));
        }

        JNIEXPORT jstring JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetLabel(JNIEnv* env, jobject, jint id) {
            return to_jstring(env, get_label(id));
        }

        JNIEXPORT jstring JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetValueS(JNIEnv* env, jobject, jint id) {
            return to_jstring(env, get_value_s(id));
        }

        JNIEXPORT jfloat JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetX(JNIEnv*, jobject, jint id) { return get_x(id); }

        JNIEXPORT jfloat JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetY(JNIEnv*, jobject, jint id) { return get_y(id); }

        JNIEXPORT jfloat JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetSizeX(JNIEnv*, jobject, jint id) { return get_size_x(id); }

        JNIEXPORT jfloat JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetSizeY(JNIEnv*, jobject, jint id) { return get_size_y(id); }

        JNIEXPORT jfloat JNICALL
        Java_com_raais_imstudio_NativeBridge_getWidgetWidth(JNIEnv*, jobject, jint id) { return get_width(id); }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_setWidgetLabel(JNIEnv* env, jobject, jint id, jstring v) {
            return set_label(id, from_jstring(env, v)) ? JNI_TRUE : JNI_FALSE;
        }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_setWidgetValueS(JNIEnv* env, jobject, jint id, jstring v) {
            return set_value_s(id, from_jstring(env, v)) ? JNI_TRUE : JNI_FALSE;
        }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_moveWidget(JNIEnv*, jobject, jint id, jfloat x, jfloat y) {
            return move(id, x, y) ? JNI_TRUE : JNI_FALSE;
        }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_resizeWidget(JNIEnv*, jobject, jint id, jfloat sx, jfloat sy) {
            return resize(id, sx, sy) ? JNI_TRUE : JNI_FALSE;
        }

        JNIEXPORT jboolean JNICALL
        Java_com_raais_imstudio_NativeBridge_setWidgetWidth(JNIEnv*, jobject, jint id, jfloat w) {
            return set_width(id, w) ? JNI_TRUE : JNI_FALSE;
        }

        JNIEXPORT jstring JNICALL
        Java_com_raais_imstudio_NativeBridge_generateCode(JNIEnv* env, jobject) {
            return to_jstring(env, generate_full_code());
        }

        } // extern "C"
        EOF

        write_if_missing android/app/src/main/cpp/CMakeLists.txt <<'EOF'
        cmake_minimum_required(VERSION 3.22)
        project(imstudio_core)
        set(CMAKE_CXX_STANDARD 17)

        # ★ Fix 4: imgui_demo.cpp اضافه شد (ShowStyleEditor)
        add_library(imgui STATIC
            vendor/imgui/imgui.cpp
            vendor/imgui/imgui_draw.cpp
            vendor/imgui/imgui_tables.cpp
            vendor/imgui/imgui_widgets.cpp
            vendor/imgui/imgui_demo.cpp
            vendor/imgui/misc/cpp/imgui_stdlib.cpp
        )
        target_include_directories(imgui PUBLIC
            vendor/imgui
            vendor/imgui/misc/cpp
        )

        add_library(fmt INTERFACE)
        target_include_directories(fmt INTERFACE vendor/fmt/include)
        target_compile_definitions(fmt INTERFACE FMT_HEADER_ONLY=1)

        # ★ Fix 5: ims_object.cpp به لیست سورس‌ها اضافه شد (اگر موجود باشد)
        set(IMS_SOURCES
            vendor/imstudio/ims_generator.cpp
            vendor/imstudio/ims_buffer.cpp
        )
        if(EXISTS ${CMAKE_CURRENT_SOURCE_DIR}/vendor/imstudio/ims_object.cpp)
            list(APPEND IMS_SOURCES vendor/imstudio/ims_object.cpp)
        endif()
        if(EXISTS ${CMAKE_CURRENT_SOURCE_DIR}/vendor/imstudio/ims_utils.cpp)
            list(APPEND IMS_SOURCES vendor/imstudio/ims_utils.cpp)
        endif()

        add_library(imstudio_core SHARED
            src/jni_bridge.cpp
            src/engine/buffer_accessor.cpp
            src/engine/code_generator.cpp
            ${IMS_SOURCES}
        )
        target_compile_definitions(imstudio_core PRIVATE FMT_HEADER_ONLY=1)
        target_include_directories(imstudio_core PRIVATE
            include
            src
            vendor/imstudio
            vendor/imgui
            vendor/imgui/misc/cpp
        )

        find_library(log-lib log)
        target_link_libraries(imstudio_core imgui fmt ${log-lib})
        EOF
      shell: bash

    # ============================================================
    # 3.5. Patch known compilation issues (failsafe for existing repos)
    # ============================================================
    - name: Patch compilation issues
      run: |
        VD=android/app/src/main/cpp/vendor
        SRC=android/app/src/main/cpp/src
        CPP=android/app/src/main/cpp

        echo "→ Fix 1: imgui_demo.cpp must be in vendor/imgui"
        cp -f /tmp/ImStudio/src/third-party/imgui/imgui_demo.cpp $VD/imgui/

        echo "→ Fix 2: imgui_stdlib from misc/cpp/"
        mkdir -p $VD/imgui/misc/cpp
        cp -f /tmp/ImStudio/src/third-party/imgui/misc/cpp/imgui_stdlib.h   $VD/imgui/misc/cpp/
        cp -f /tmp/ImStudio/src/third-party/imgui/misc/cpp/imgui_stdlib.cpp $VD/imgui/misc/cpp/

        echo "→ Fix 3: normalize include paths (vendor/imstudio/X → X)"
        sed -i -E 's|#include "vendor/imstudio/([^"]+)"|#include "\1"|g' \
            $SRC/engine/buffer_accessor.cpp \
            $SRC/engine/code_generator.cpp || true

        echo "→ Fix 4: ensure g_Buffer is non-static"
        sed -i -E 's|^static ImStudio::BufferWindow g_Buffer;|ImStudio::BufferWindow g_Buffer;|' \
            $SRC/engine/buffer_accessor.cpp || true

        echo "→ Fix 5: ensure extern g_Buffer sits inside namespace imstudio::engine"
        # فقط اگر extern در ابتدای خط (scope گلوبال) باشد، آن را داخل namespace می‌بریم
        if grep -qE '^extern ImStudio::BufferWindow g_Buffer;' $SRC/engine/code_generator.cpp; then
            sed -i -E 's|^extern ImStudio::BufferWindow g_Buffer;|namespace imstudio::engine { extern ImStudio::BufferWindow g_Buffer; }|' \
                $SRC/engine/code_generator.cpp
            echo "  + patched global-scope extern"
        else
            echo "  · extern already scoped (or absent) — leaving as-is"
        fi

        echo "→ Fix 6: force-update CMakeLists (imgui_demo + ims_object.cpp + misc/cpp)"
        cat > $CPP/CMakeLists.txt <<'CMAKE'
        cmake_minimum_required(VERSION 3.22)
        project(imstudio_core)
        set(CMAKE_CXX_STANDARD 17)

        add_library(imgui STATIC
            vendor/imgui/imgui.cpp
            vendor/imgui/imgui_draw.cpp
            vendor/imgui/imgui_tables.cpp
            vendor/imgui/imgui_widgets.cpp
            vendor/imgui/imgui_demo.cpp
            vendor/imgui/misc/cpp/imgui_stdlib.cpp
        )
        target_include_directories(imgui PUBLIC
            vendor/imgui
            vendor/imgui/misc/cpp
        )

        add_library(fmt INTERFACE)
        target_include_directories(fmt INTERFACE vendor/fmt/include)
        target_compile_definitions(fmt INTERFACE FMT_HEADER_ONLY=1)

        set(IMS_SOURCES
            vendor/imstudio/ims_generator.cpp
            vendor/imstudio/ims_buffer.cpp
        )
        if(EXISTS ${CMAKE_CURRENT_SOURCE_DIR}/vendor/imstudio/ims_object.cpp)
            list(APPEND IMS_SOURCES vendor/imstudio/ims_object.cpp)
        endif()
        if(EXISTS ${CMAKE_CURRENT_SOURCE_DIR}/vendor/imstudio/ims_utils.cpp)
            list(APPEND IMS_SOURCES vendor/imstudio/ims_utils.cpp)
        endif()

        add_library(imstudio_core SHARED
            src/jni_bridge.cpp
            src/engine/buffer_accessor.cpp
            src/engine/code_generator.cpp
            ${IMS_SOURCES}
        )
        target_compile_definitions(imstudio_core PRIVATE FMT_HEADER_ONLY=1)
        target_include_directories(imstudio_core PRIVATE
            include
            src
            vendor/imstudio
            vendor/imgui
            vendor/imgui/misc/cpp
        )

        find_library(log-lib log)
        target_link_libraries(imstudio_core imgui fmt ${log-lib})
        CMAKE

        echo "✓ Patch applied"

    # ============================================================
    # 4. Gradle & Manifest
    # ============================================================
    - name: Generate Gradle and manifest files
      run: |
        write_if_missing android/settings.gradle.kts <<'EOF'
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "ImStudioAndroid"
        include(":app")
        EOF

        write_if_missing android/build.gradle.kts <<'EOF'
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        write_if_missing android/gradle.properties <<'EOF'
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        EOF

        write_if_missing android/app/build.gradle.kts <<'EOF'
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.raais.imstudio"
            compileSdk = 34
            ndkVersion = "26.1.10909125"

            defaultConfig {
                applicationId = "com.raais.imstudio"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
                externalNativeBuild {
                    cmake {
                        cppFlags += "-std=c++17 -fexceptions"
                        arguments += "-DANDROID_STL=c++_shared"
                    }
                }
