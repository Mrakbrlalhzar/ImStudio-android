        // ---------------------------------------------------------------------------
        // Slide-out dock helper: window anchored to an edge, offset by open fraction.
        // side: 0=left, 1=right, 2=bottom. Returns true while visible (open>0.02).
        // ---------------------------------------------------------------------------
        static bool BeginDock(const char* name, DockAnim& d, int side, float size)
        {
            if (d.open < 0.02f) return false;
            ImGuiIO& io = ImGui::GetIO();
            float W = io.DisplaySize.x, H = io.DisplaySize.y;
            float slide = d.open; // eased
            slide = slide * slide * (3 - 2 * slide); // smoothstep

            ImGui::PushStyleVar(ImGuiStyleVar_WindowRounding, 0);
            ImGui::PushStyleVar(ImGuiStyleVar_WindowBorderSize, 1);
            ImGuiWindowFlags fl = ImGuiWindowFlags_NoTitleBar | ImGuiWindowFlags_NoResize |
                                  ImGuiWindowFlags_NoMove | ImGuiWindowFlags_NoSavedSettings |
                                  ImGuiWindowFlags_NoCollapse | ImGuiWindowFlags_NoScrollbar;
            if (side == 0)      { ImGui::SetNextWindowPos(ImVec2(-size * (1 - slide), 44), ImGuiCond_Always);  ImGui::SetNextWindowSize(ImVec2(size, H - 44), ImGuiCond_Always); }
            else if (side == 1) { ImGui::SetNextWindowPos(ImVec2(W + size * (1 - slide), 44), ImGuiCond_Always); ImGui::SetNextWindowSize(ImVec2(size, H - 44), ImGuiCond_Always); }
            else               { ImGui::SetNextWindowPos(ImVec2(0, H - size * slide), ImGuiCond_Always);          ImGui::SetNextWindowSize(ImVec2(W, size * slide + 0.001f), ImGuiCond_Always); }
            bool vis = ImGui::Begin(name, nullptr, fl);
            if (!vis) { ImGui::End(); ImGui::PopStyleVar(2); return false; }
            return true;
        }
        static void EndDock()
        {
            ImGui::End();
            ImGui::PopStyleVar(2);
        }

        // ---------------------------------------------------------------------------
        // Palette drawer (left): search + categorized add buttons + tree
        // ---------------------------------------------------------------------------
        static char g_palette_filter[64] = "";

        static bool KindNameMatches(const char* name)
        {
            if (!g_palette_filter[0]) return true;
            const char* a = g_palette_filter;
            for (const char* b = name; *b; b++)
            {
                const char* bb = b; const char* aa = a; bool m = true;
                while (*aa && *bb)
                {
                    if (tolower((unsigned char)*aa) != tolower((unsigned char)*bb)) { m = false; break; }
                    aa++; bb++;
                }
                if (m && *aa == 0) return true;
            }
            return false;
        }

        static void DrawPaletteDock()
        {
            const float DW = 230;
            if (!BeginDock("##dock_palette", g_dockPalette, 0, DW)) return;
            ImGui::TextUnformatted("ADD ITEM");
            ImGui::Separator();
            ImGui::InputTextWithHint("##filter", "search widgets...", g_palette_filter, sizeof(g_palette_filter));
            ImGui::Spacing();

            Node* sel = g_ed.SelNode();
            int pid = (sel && NodeAcceptsChildren(sel->kind)) ? sel->id : (g_ed.root ? g_ed.root->id : -1);
            if (!sel) ImGui::TextDisabled("no selection");
            char lbl[64];
            for (int c = 0; c < 9; c++)
            {
                bool has_any = false;
                for (auto& m : KindCategoryMap)
                    if (m[0] == c && KindNameMatches(NodeKindName(m[1]))) { has_any = true; break; }
                if (!has_any) continue;
                if (!ImGui::CollapsingHeader(KindCategories[c], ImGuiTreeNodeFlags_DefaultOpen)) continue;
                for (auto& m : KindCategoryMap)
                {
                    if (m[0] != c || !KindNameMatches(NodeKindName(m[1]))) continue;
                    snprintf(lbl, sizeof(lbl), "+ %s", NodeKindName(m[1]));
                    if (ImGui::SmallButton(lbl)) AddNodeButton(m[1], pid);
                    ImGui::SameLine();
                }
                ImGui::NewLine();
            }
            ImGui::Separator();
            ImGui::TextUnformatted("DOCUMENT TREE");
            ImGui::Separator();
            if (!g_ed.root) ImGui::TextDisabled("(empty)");
            else TreeRow(g_ed.root);
            EndDock();
        }

        // ---------------------------------------------------------------------------
        // Inspector drawer (right): node properties + full flag browser
        // ---------------------------------------------------------------------------
        static void DrawInspectorDock()
        {
            const float DW = 300;
            if (!BeginDock("##dock_inspector", g_dockInspector, 1, DW)) return;
            Node* n = g_ed.SelNode();
            if (!n) { ImGui::TextDisabled("select an item"); EndDock(); return; }
            ImGui::Text("path: %s", GetSelPath(n));
            ImGui::Separator();
            DrawNodeProps(n);

            // ---- Flags reference browser: ALL groups from editor_flags.h ----
            if (ImGui::CollapsingHeader("Flag Browser (all ImGui enums)"))
            {
                static char fb_filter[48] = "";
                ImGui::InputTextWithHint("##fbfilter", "search flags...", fb_filter, sizeof(fb_filter));
                static int open_group = -1;
                int ng = 0; const FlagGroup* gs = AllFlagGroups(ng);
                for (int gi = 0; gi < ng; gi++)
                {
                    int m = 0; const FlagDef* d = gs[gi].fn(m);
                    // count matches
                    int match = 0;
                    for (int i = 0; i < m; i++)
                        if (!fb_filter[0] || strstr(d[i].name, fb_filter)) match++;
                    if (!match) continue;
                    char t[96]; snprintf(t, sizeof(t), "%s (%d)", gs[gi].title, match);
                    if (ImGui::TreeNode(t))
                    {
                        for (int i = 0; i < m; i++)
                        {
                            if (fb_filter[0] && !strstr(d[i].name, fb_filter)) continue;
                            ImGui::BulletText("%s = %d (0x%X)", d[i].name, d[i].value, d[i].value);
                        }
                        ImGui::TreePop();
                    }
                }
            }
            EndDock();
        }

